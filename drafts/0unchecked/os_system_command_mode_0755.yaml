id: os_system_command_mode_0755
title: Ubuntu must have system commands set to a mode of 0755 or less permissive.
discussion: "Allowing any user to modify software libraries in Ubuntu could\
  \ lead to untested changes that bypass proper change-management testing and\
  \ approvals. Only qualified, authorized individuals should be permitted to access\
  \ and modify these components."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_24:
      - UBTU-24-300011
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            -perm /022 -type f -exec stat -c "%n %a" '{}' \;
          result:
            string: no output
        fix:
          shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            -perm /022 -type f -exec chmod 755 '{}' \;
tags:
- testing
