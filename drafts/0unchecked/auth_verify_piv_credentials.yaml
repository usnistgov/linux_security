id: auth_verify_piv_credentials
title: Ubuntu 22.04 LTS must electronically verify personal identity verification
  (PIV) credentials.
discussion: "PIV credentials, such as the DoD\u2011mandated CAC, standardize identity\
  \ management and authentication under HSPD\u201112, reducing unauthorized\u2011\
  access risk and serving as a key layer of protection for national security systems."
references:
  nist:
    800-53r5:
    - IA-2 (12)
  disa:
    cci:
    - CCI-001954
    srg:
    - SRG-OS-000377-GPOS-00162
    disa_stig:
      ubuntu_2204:
      - UBTU-22-612025
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -E '^\s*cert_policy\s*=' /etc/pam_pkcs11/pam_pkcs11.conf |
        grep -q ocsp_on; echo $?
      expected_output: 0
    fix:
      shell: sed -i 's/\(^[[:space:]]*cert_policy[[:space:]]*=\).*$/\1 ocsp_on/' /etc/pam_pkcs11/pam_pkcs11.conf
tags:
- testing
