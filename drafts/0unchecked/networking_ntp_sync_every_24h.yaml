id: networking_ntp_sync_every_24h
title: Ubuntu 22.04 LTS must, for networked systems, compare internal information
  system clocks at least every 24 hours with a server synchronized to one of the redundant
  United States Naval Observatory (USNO) time servers, or a time server designated
  for the appropriate DOD network (NIPRNet/SIPRNet), and/or the Global Positioning
  System (GPS).
discussion: Inaccurate timestamps hinder event correlation and forensic analysis,
  so internal system clocks must be synchronized to a reliable time source, considering
  endpoints that may have limited access to authoritative servers.
references:
  nist:
    800-53r5:
    - SC-45 (1) (a)
  disa:
    cci:
    - CCI-004923
    - CCI-001891
    srg:
    - SRG-OS-000355-GPOS-00143
    disa_stig:
      ubuntu_2204:
      - UBTU-22-252010
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: "sudo awk '\n/^\\s*#/ {next}\n/^\\s*server/ {\n    if ($0 ~ /tick\\.usno\\\
        .navy\\.mil|tock\\.usno\\.navy\\.mil|ntp2\\.usno\\.navy\\.mil/) {\n      \
        \  s++\n        for(i=1;i<=NF;i++) {\n            if($i ~ /^maxpoll[0-9]+$/)\
        \ {\n                split($i,a,\"maxpoll\"); mp=a[2]+0\n                if(mp>16)\
        \ m++\n            }\n            if($i==\"maxpoll\") {\n                if($(i+1)+0>16)\
        \ m++\n            }\n        }\n    }\n}\nEND {exit (s<3 || m>0)?1:0}\n'\
        \ /etc/chrony/chrony.conf /etc/chrony/*.conf 2>/dev/null"
      expected_output: 0
    fix:
      shell: sudo systemctl restart chrony.service
tags:
- testing
