id: auth_prevent_root_login
title: Ubuntu 22.04 LTS must prevent direct login into the root account.
discussion: Organizational users must be individually identified and authenticated
  before accessing systems; using a group authenticator (e.g., root, Administrator)
  alone does not provide unique identification. To ensure traceability and prevent
  unauthorized access, individuals must authenticate with their own credentials prior
  to assuming any shared or privileged account.
references:
  nist:
    800-53r5:
    - IA-02(05)
  disa:
    cci:
    - CCI-000770
    - CCI-004045
    srg:
    - SRG-OS-000109-GPOS-00056
    disa_stig:
      ubuntu_2204:
      - UBTU-22-411010
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo passwd -S root | grep -q '^root L'
      expected_output: 0
    fix:
      shell: sudo passwd -l root
tags:
- 800-53r5_high
