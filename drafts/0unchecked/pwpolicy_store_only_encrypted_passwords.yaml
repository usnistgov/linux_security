id: pwpolicy_store_only_encrypted_passwords
title: Ubuntu 22.04 LTS must store only encrypted representations of passwords.
discussion: "Password complexity measures how well a password resists guessing and\
  \ brute\u2011force attacks. Allowing consecutive reuse after its lifetime defeats\
  \ policy\u2011required password changes."
references:
  nist:
    800-53r5:
    - IA-5 (1) (d)
  disa:
    cci:
    - CCI-000196
    - CCI-004062
    srg:
    - SRG-OS-000073-GPOS-00041
    disa_stig:
      ubuntu_2204:
      - UBTU-22-611055
      ubuntu_2404:
      - UBTU-24-400220
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep pam_unix.so /etc/pam.d/common-password | grep -q sha512 && grep
        pam_unix.so /etc/pam.d/common-password | grep -o 'rounds=[0-9]\+' | cut -d=
        -f2 | awk '{if ($1>=100000) exit 0; else exit 1}'
      expected_output: 0
    fix:
      shell: sudo sed -i 's/^password.*pam_unix.so.*/password [success=1 default=ignore]
        pam_unix.so obscure sha512 shadow rounds=100000/' /etc/pam.d/common-password
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: awk '/pam_unix\.so/ && /sha512/ { match($0,/rounds=[0-9]+/); if (RSTART)
        { rounds=substr($0,RSTART+7); if (rounds+0 >= 100000) exit 0 } } END { exit
        1 }' /etc/pam.d/common-password
      expected_output: 0
    fix:
      shell: sudo sed -i 's/^password\s\+\[success=1 default=ignore\]\s\+pam_unix\.so.*/password
        [success=1 default=ignore] pam_unix.so obscure sha512 shadow rounds=100000/'
        /etc/pam.d/common-password
tags:
- testing
