id: os_system_command_dirs_755
title: Ubuntu 22.04 LTS must have directories that contain system commands set to
  a mode of "755" or less permissive.
discussion: "Protecting audit tools-such as vendor-provided, open-\
  source, and custom query/report generators-is essential to prevent unauthorized\
  \ manipulation of audit information, and operating systems enforce this by using\
  \ user permissions and roles to control access to those tools."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-001495
    srg:
    - SRG-OS-000258-GPOS-00099
    disa_stig:
      ubuntu_22:
      - UBTU-22-232010
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: '! find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            -perm /022 -type d -exec stat -c "%n %a" ''{}'' \; | grep -q .'
          result:
            integer: 0
        fix:
          shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            -perm /022 -type d -exec chmod -R 755 '{}' \;
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
