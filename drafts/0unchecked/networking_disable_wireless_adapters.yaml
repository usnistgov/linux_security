id: networking_disable_wireless_adapters
title: Ubuntu 22.04 LTS must disable all wireless network adapters.
discussion: "Without protection, wireless peripheral communications can be intercepted,\
  \ altered, or used to compromise the operating system, so they must meet DoD wireless\
  \ transmission requirements and be AO\u2011approved. Protection can be achieved\
  \ via physical barriers or cryptographic means, with either method sufficient."
references:
  nist:
    800-53r5:
    - SC-08
  disa:
    cci:
    - CCI-002418
    srg:
    - SRG-OS-000481-GPOS-00481
    disa_stig:
      ubuntu_2204:
      - UBTU-22-291015
      ubuntu_2404:
      - UBTU-24-600230
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: '[ -z "$(tail -n +3 /proc/net/wireless | grep -v ''^$'')" ]'
      expected_output: 0
    fix:
      shell: 'sudo su -c "echo install  /bin/false >> /etc/modprobe.d/stig.conf"

        sudo modprobe -r'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: test -z "$(ls -L -d /sys/class/net/*/wireless 2>/dev/null | xargs dirname
        | xargs basename)"
      expected_output: 0
    fix:
      shell: sudo modprobe -r
tags:
- 800-53r5_moderate
- 800-53r5_high
