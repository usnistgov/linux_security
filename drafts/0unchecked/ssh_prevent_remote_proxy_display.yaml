id: ssh_prevent_remote_proxy_display
title: Ubuntu SSH daemon must prevent remote hosts from connecting to the
  proxy display.
discussion: Enabling X11 forwarding can expose displays if sshd listens on the wildcard
  address; by default it binds to the loopback address and sets DISPLAY to localhost,
  preventing remote connections.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-255045
      ubuntu_24:
      - UBTU-24-300023
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -i '^X11UseLocalhost\s*yes' /etc/ssh/sshd_config >/dev/null
          result:
            integer: 0
        fix:
          shell: 'echo "X11UseLocalhost yes" >> /etc/ssh/sshd_config

            sudo systemctl restart ssh'
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -iq '^X11UseLocalhost yes' /etc/ssh/sshd_config*
          result:
            integer: 0
        fix:
          shell: sudo systemctl restart ssh
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
