id: os_library_file_mode_0755
title: Ubuntu 24.04 LTS library files must have mode 0755 or less permissive.
discussion: "Allowing any user to modify software libraries in Ubuntu 24.04 LTS could\
  \ lead to untested changes that bypass proper change-management testing and\
  \ approvals. Only qualified, authorized individuals should be permitted to access\
  \ and modify these components, including privileged programs."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_24:
      - UBTU-24-300006
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' -perm
            /022 -exec stat -c "%n %a" {} +
          result:
            string: no output
        fix:
          shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' -perm
            /022 -exec chmod go-w {} +
tags:
- testing
