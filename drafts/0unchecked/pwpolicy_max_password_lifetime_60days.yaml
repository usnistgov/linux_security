id: pwpolicy_max_password_lifetime_60days
title: Ubuntu 22.04 LTS must enforce a 60-day maximum password lifetime restriction.
  Passwords for new users must have a 60-day maximum password lifetime restriction.
discussion: Passwords can eventually be cracked, so they must be changed periodically;
  without enforced password lifetime limits, the operating system risks password compromise.
references:
  nist:
    800-53r5:
    - IA-5 (1) (h)
  disa:
    cci:
    - CCI-004066
    - CCI-000199
    srg:
    - SRG-OS-000076-GPOS-00044
    disa_stig:
      ubuntu_2204:
      - UBTU-22-411030
      ubuntu_2404:
      - UBTU-24-400310
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -E '^\s*PASS_MAX_DAYS\s+60\s*$' /etc/login.defs
      expected_output: 0
    fix:
      shell: sudo sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS    60/' /etc/login.defs
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -qE '^\s*PASS_MAX_DAYS\s+60\s*$' /etc/login.defs
      expected_output: 0
    fix:
      shell: sudo bash -c 'grep -q "^PASS_MAX_DAYS" /etc/login.defs && sed -i "s/^PASS_MAX_DAYS.*/PASS_MAX_DAYS    60/"
        /etc/login.defs || echo "PASS_MAX_DAYS    60" >> /etc/login.defs'
tags:
- testing
