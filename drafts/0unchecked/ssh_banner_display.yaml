id: ssh_banner_display
title: Ubuntu 24.04 LTS must display the Standard Mandatory DOD Notice and Consent
  Banner before granting access to via an SSH logon.
discussion: "A standardized, approved use notification must be displayed before granting\
  \ access to a publicly accessible operating system to ensure privacy and security,\
  \ consistent with federal laws and DOD policy, and is required only for human logon\
  \ interfaces. The banner uses either the full 1300\u2011character text or the abbreviated\
  \ version for systems with severe character limits."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-08
    - AC-08
    - AC-08
    - AC-08
  disa:
    cci:
    - CCI-001388
    - CCI-001384
    - CCI-000048
    - CCI-001387
    - CCI-001385
    - CCI-001386
    srg:
    - SRG-OS-000023-GPOS-00006
    disa_stig:
      ubuntu_24:
      - UBTU-24-200640
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -h '^Banner' /etc/ssh/sshd_config* | grep -v '^#' | awk
            '{print $2}' | { read bannerfile; [ -n "$bannerfile" ] && [ -f "$bannerfile"
            ] && cmp -s "$bannerfile" <(echo -e "You are accessing a U.S. Government
            (USG) Information System (IS) that is provided for USG-authorized use
            only.\n\nBy using this IS (which includes any device attached to this
            IS), you consent to the following conditions:\n\n-The USG routinely intercepts
            and monitors communications on this IS for purposes including, but not
            limited to, penetration testing, COMSEC monitoring, network operations
            and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence
            (CI) investigations.\n\n-At any time, the USG may inspect and seize data
            stored on this IS.\n\n-Communications using, or data stored on, this IS
            are not private, are subject to routine monitoring, interception, and
            search, and may be disclosed or used for any USG-authorized purpose.\n\n-This
            IS includes security measures (e.g., authentication and access controls)
            to protect USG interests--not for your personal benefit or privacy.\n\n-Notwithstanding
            the above, using this IS does not constitute consent to PM, LE or CI investigative
            searching or monitoring of the content of privileged communications, or
            work product, related to personal representation or services by attorneys,
            psychotherapists, or clergy, and their assistants. Such communications
            and work product are private and confidential. See User Agreement for
            details.") && exit 0 || exit 1; }
          result:
            integer: 0
        fix:
          shell: 'sudo sed -i ''/^Banner/d'' /etc/ssh/sshd_config

            sudo sed -i ''$aBanner /etc/issue.net'' /etc/ssh/sshd_config

            sudo systemctl -s SIGHUP kill sshd'
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
