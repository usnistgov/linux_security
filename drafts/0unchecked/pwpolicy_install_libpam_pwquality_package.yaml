id: pwpolicy_install_libpam_pwquality_package
title: Ubuntu must have the "libpam-pwquality" package installed.
discussion: "Complex passwords increase the time and resources needed to crack them,\
  \ and pwquality enforces such complexity to limit brute-force attacks."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00225
    disa_stig:
      ubuntu_22:
      - UBTU-22-215010
      ubuntu_24:
      - UBTU-24-100600
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: dpkg -l | grep -q libpam-pwquality
          result:
            integer: 0
        fix:
          shell: sudo apt-get install libpam-pwquality
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: dpkg -l | grep -q libpam-pwquality
          result:
            integer: 0
        fix:
          shell: sudo apt install -y libpam-pwquality
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
