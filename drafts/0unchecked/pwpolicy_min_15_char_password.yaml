id: pwpolicy_min_15_char_password
title: Ubuntu 22.04 LTS must enforce a minimum 15-character password length.
discussion: "The shorter a password, the fewer combinations an attacker must test\
  \ to compromise it. Increasing password length and complexity exponentially raises\
  \ the time and resources required for a brute-force attack."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-000205
    - CCI-004066
    srg:
    - SRG-OS-000078-GPOS-00046
    disa_stig:
      ubuntu_22:
      - UBTU-22-611035
      ubuntu_24:
      - UBTU-24-400320
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: awk '!/^#/ && $1=="minlen" && $3+0>=15 {exit 0} END {exit 1}' /etc/security/pwquality.conf
          result:
            integer: 0
        fix:
          shell: sudo sed -i 's/^#\?minlen\s*=.*/minlen = 15/' /etc/security/pwquality.conf
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -E '^\s*minlen\s*=\s*[0-9]+' /etc/security/pwquality.conf |
            awk -F= '{if($2+0 >= 15) exit 0; else exit 1}'
          result:
            integer: 0
        fix:
          shell: sudo bash -c 'echo "minlen=15" >> /etc/security/pwquality.conf'
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
