id: auth_dod_pki_ca_verification
title: Ubuntu 24.04 LTS must use DOD PKI-established certificate authorities (CAs)
  for verification of the establishment of protected sessions.
discussion: "Untrusted CAs may issue certificates that could compromise DoD systems;\
  \ only certificates from DoD\u2011approved CAs are trusted. The DoD accepts PKI\
  \ certificates solely from approved internal or external authorities, such as those\
  \ used for SSL/TLS."
references:
  nist:
    800-53r5:
    - SC-23 (5)
  disa:
    cci:
    - CCI-002470
    srg:
    - SRG-OS-000403-GPOS-00182
    disa_stig:
      ubuntu_2404:
      - UBTU-24-600060
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: for f in /etc/ssl/certs/*; do if openssl x509 -noout -subject -in "$f"
        2>/dev/null | grep -qi "DOD ROOT CA"; then exit 0; fi; done; exit 1
      expected_output: 0
    fix:
      shell: 'sudo sed -i -E ''s/^([^!#]+)/!\1/'' /etc/ca-certificates.conf

        sudo update-ca-certificates'
tags:
- testing
