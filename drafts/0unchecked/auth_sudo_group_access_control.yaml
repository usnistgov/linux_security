id: auth_sudo_group_access_control
title: Ubuntu 22.04 LTS must ensure only users who need access to security functions
  are part of sudo group.
discussion: "An isolation boundary enforces access control to protect the integrity\
  \ of the hardware, software, and firmware that perform security functions, which\
  \ enforce the system security policy and isolate code and data. Ubuntu\u202F22.04\u202F\
  LTS restricts access to these functions through access\u2011control mechanisms and\
  \ least\u2011privilege capabilities, leveraging kernel separation, file\u2011system\
  \ and address\u2011space protections, and disciplined development practices."
references:
  nist:
    800-53r5:
    - SC-03
  disa:
    cci:
    - CCI-001084
    srg:
    - SRG-OS-000134-GPOS-00068
    disa_stig:
      ubuntu_2204:
      - UBTU-22-432015
      ubuntu_2404:
      - UBTU-24-600130
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: grep -E '^sudo:[^:]*:[^:]*:$' /etc/group
      expected_output: 0
    fix:
      shell: sudo gpasswd -d sudo
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: grep -c '^sudo:' /etc/group
      expected_output: 1
    fix:
      shell: sudo gpasswd -d sudo
tags:
- 800-53r5_high
