id: os_library_dirs_group_root
title: Ubuntu 22.04 LTS library directories must be group-owned by "root".
discussion: "Allowing any user to modify software libraries could bypass required\
  \ testing and approvals, weakening change\u2011management controls. Only qualified,\
  \ authorized individuals should be permitted to access these components for changes,\
  \ upgrades, or modifications."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_22:
      - UBTU-22-232065
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /lib /usr/lib /lib64 ! -group root -type d -exec stat -c
            "%n %G" '{}' \; | grep -q .
          result:
            string: $?
        fix:
          shell: sudo find /lib /usr/lib /lib64 ! -group root -type d -exec chgrp
            root '{}' \;
tags:
- testing
