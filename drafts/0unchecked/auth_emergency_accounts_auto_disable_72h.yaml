id: auth_emergency_accounts_auto_disable_72h
title: Ubuntu 24.04 LTS must automatically remove or disable emergency accounts after
  72 hours.
discussion: "Temporary accounts are set up for urgent situations and must be disabled\
  \ or automatically expire within 72\u202Fhours, otherwise they degrade system security.\
  \ Unlike emergency (\"break\u2011glass\") accounts, which are for admin use when\
  \ standard logon fails and have no expiration requirement, temporary accounts may\
  \ have their expiration extended only as needed and not indefinitely, with long\u2011\
  term privileged access requiring a permanent account."
references:
  nist:
    800-53r5:
    - AC-2 (2)
  disa:
    cci:
    - CCI-000016
    - CCI-001682
    srg:
    - SRG-OS-000002-GPOS-00002
    disa_stig:
      ubuntu_2404:
      - UBTU-24-200250
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: 'awk -F: ''$3 >= 1000 {print $1}'' /etc/passwd | while read u; do exp=$(sudo
        chage -l "$u" 2>/dev/null | awk -F: ''/account expires/ {print $2}'' | xargs);
        [[ -z "$exp" || "$exp" == "never" ]] && { echo "$u: no expiration"; exit 1;
        }; exp_s=$(date -d "$exp" +%s 2>/dev/null); lim_s=$(date -d ''+72 hours''
        +%s); [[ -z "$exp_s" || "$exp_s" -gt "$lim_s" ]] && { echo "$u: expires $exp
        (>72h)"; exit 1; }; done; exit 0'
      expected_output: 0
    fix:
      shell: sudo chage -E $(date -d +3days +%Y-%m-%d)
tags:
- testing
