id: os_system_command_mode_755
title: Ubuntu must have system commands set to a mode of "755" or less permissive.
discussion: "Allowing any user to modify software libraries in Ubuntu could\
  \ lead to untested changes that bypass proper change-management testing and\
  \ approvals. Only qualified, authorized individuals should be permitted to access\
  \ and modify these components, including privileged programs and interpreted-\
  language libraries."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_22:
      - UBTU-22-232015
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            -perm /022 -type f -exec stat -c "%n %a" '{}' \; | grep -q . && exit 1
            || exit 0
          result:
            integer: 0
        fix:
          shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            -perm /022 -type f -exec chmod 755 '{}' \;
tags:
- testing
