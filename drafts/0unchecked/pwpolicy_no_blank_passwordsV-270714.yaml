id: pwpolicy_no_blank_passwordsV-270714
title: Ubuntu must not allow accounts configured in Pluggable Authentication
  Modules (PAM) with blank or null passwords.
discussion: An account with an empty password allows anyone to log in and run commands
  with that account's privileges, which must never be permitted in operational environments.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_24:
      - UBTU-24-300028
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: grep -q nullok /etc/pam.d/common-password /etc/pam.d/common-auth
          result:
            integer: 1
        fix:
          shell: sed -i 's/\<nullok\>//g' /etc/pam.d/common-password /etc/pam.d/common-auth
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
