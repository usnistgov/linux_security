id: os_prevent_gui_smartcard_override
title: Ubuntu 24.04 LTS must prevent a user from overriding the disabling of the graphical
  user smart card removal action.
discussion: A session lock temporarily secures a user's session when they step away
  without logging out. Ubuntu 24.04 LTS must allow users to manually invoke a session
  lock at any time to secure their session when needed.
references:
  nist:
    800-53r5:
    - AC-11 a
    - AC-11 b
  disa:
    cci:
    - CCI-000056
    - CCI-000057
    - CCI-000058
    srg:
    - SRG-OS-000028-GPOS-00009
    disa_stig:
      ubuntu_2404:
      - UBTU-24-200042
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: test "$(gsettings writable org.gnome.settings-daemon.peripherals.smartcard
        removal-action)" = "false"
      expected_output: 0
    fix:
      shell: 'echo ''/org/gnome/settings-daemon/peripherals/smartcard/removal-action''
        >> /etc/dconf/db/local.d/locks/00-security-settings-lock

        sudo dconf update'
tags:
- testing
