id: os_journal_dir_group_ownership
title: Ubuntu 22.04 LTS must configure the directories used by the system journal
  to be group-owned by "systemd-journal".
discussion: Only authorized personnel should see error details, as messages can reveal
  operational state, OS/platform, PII, or other sensitive information. Error message
  content must be carefully designed per organizational policy to prevent unauthorized
  disclosure.
references:
  nist:
    800-53r5:
    - SI-11 b
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_2204:
      - UBTU-22-232085
      ubuntu_2404:
      - UBTU-24-700060
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: '[ -z "$(sudo find /run/log/journal /var/log/journal -type d ! -group
        systemd-journal -print)" ]'
      expected_output: 0
    fix:
      shell: 'sudo tee /etc/tmpfiles.d/zzz-systemd-stig.conf > /dev/null <<''EOF''

        z /run/log/journal 2750 root systemd-journal - -

        z /var/log/journal 2750 root systemd-journal - -

        z /var/log/journal/%m 2750 root systemd-journal - -

        EOF

        sudo reboot'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /run/log/journal /var/log/journal -type d ! -group systemd-journal
        -quit -print | grep -q . && echo "FAIL" || echo "PASS"
      expected_output: PASS
    fix:
      shell: sudo vi /etc/tmpfiles.d/zzz-systemd-stig.conf
tags:
- testing
