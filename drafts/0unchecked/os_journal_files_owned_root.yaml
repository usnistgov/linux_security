id: os_journal_files_owned_root
title: Ubuntu 22.04 LTS must configure the files used by the system journal to be
  owned by "root".
discussion: Only authorized personnel should see error details, as messages can reveal
  system state, operating system, PII, or operational information. Error message content
  must be carefully designed in accordance with organizational policy and operational
  requirements.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232090
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: '[ -z "$(sudo find /run/log/journal /var/log/journal -type f ! -user
            root -print 2>/dev/null)" ]; echo $?'
          result:
            integer: 0
        fix:
          shell: 'sudo vi /etc/tmpfiles.d/zzz-systemd-stig.conf

            sudo reboot'
tags:
- 800-53r5_moderate
- 800-53r5_high
