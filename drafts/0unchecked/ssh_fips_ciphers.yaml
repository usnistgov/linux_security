id: ssh_fips_ciphers
title: Ubuntu 24.04 LTS must configure the SSH daemon to use FIPS 140-3 approved ciphers
  to prevent the unauthorized disclosure of information and/or detect changes to information
  during transmission.
discussion: Without cryptographic integrity protections, information can be altered
  by unauthorized users without detection; therefore, remote access, maintenance,
  and diagnostic activities must employ cryptographic mechanisms such as hash functions,
  checksums, or message authentication codes to ensure integrity and confidentiality.
references:
  nist:
    800-53r5:
    - AC-17 (2)
    - MA-4 (6)
    - SC-8 (1)
  disa:
    cci:
    - CCI-000068
    - CCI-002421
    - CCI-003123
    srg:
    - SRG-OS-000033-GPOS-00014
    disa_stig:
      ubuntu_2404:
      - UBTU-24-100820
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -h '^Ciphers' /etc/ssh/sshd_config* | grep -v '^#' | awk '{$1=$1};1'
        | grep -x 'Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr'
      expected_output: 0
    fix:
      shell: 'sudo sh -c ''echo "Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr"
        >> /etc/ssh/sshd_config''

        sudo systemctl restart sshd'
tags:
- testing
