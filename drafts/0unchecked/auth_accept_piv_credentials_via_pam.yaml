id: auth_accept_piv_credentials_via_pam
title: "Ubuntu 24.04 LTS must accept Personal Identity Verification (PIV) credentials\
  \ managed through the Privileged Access Management (PAM) \xC2\_framework."
discussion: "PIV credentials, such as the DoD\u2011mandated Common Access Card (CAC),\
  \ standardize authentication and reduce unauthorized\u2011access risk while supporting\
  \ HSPD\u201112 identity management and serving as a key layer of protection for\
  \ national security systems."
references:
  nist:
    800-53r5:
    - IA-2 (12)
  disa:
    cci:
    - CCI-001953
    srg:
    - SRG-OS-000376-GPOS-00161
    disa_stig:
      ubuntu_2404:
      - UBTU-24-100910
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: dpkg -l | grep -q '^ii.*libpam-pkcs11'
      expected_output: 0
    fix:
      shell: sudo apt install -y libpam-pkcs11
tags:
- testing
