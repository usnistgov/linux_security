id: audit_notify_admin_25pct_storage
title: Ubuntu 22.04 LTS must immediately notify the system administrator (SA) and
  information system security officer (ISSO) when the audit record storage volume
  reaches 25 percent remaining of the allocated capacity.
discussion: Security personnel must be alerted when storage drops to 25% remaining,
  or they cannot plan the needed audit log capacity expansion.
references:
  nist:
    800-53r5:
    - AU-05(01)
  disa:
    cci:
    - CCI-001855
    srg:
    - SRG-OS-000343-GPOS-00134
    disa_stig:
      ubuntu_2204:
      - UBTU-22-653040
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: sudo awk -F'=' '/^[[:space:]]*space_left[[:space:]]*=/ {gsub(/[% ]/,"",$2);
        left=$2} /^[[:space:]]*space_left_action[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2);
        action=$2} END {if (left == 25 && (action == "email" || action == "exec"))
        exit 0; else exit 1}' /etc/audit/auditd.conf
      expected_output: 0
    fix:
      shell: sudo systemctl restart auditd.service
tags:
- 800-53r5_high
