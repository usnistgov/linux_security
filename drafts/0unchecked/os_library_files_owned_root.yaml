id: os_library_files_owned_root
title: Ubuntu 22.04 LTS library files must be owned by "root".
discussion: Allowing any user to modify software libraries could bypass required testing
  and approvals, so only qualified, authorized individuals should be permitted to
  access and change these components, including privileged programs.
references:
  nist:
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_2204:
      - UBTU-22-232070
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -user
        root -exec stat -c "%n %U" {} + | grep -q . && exit 1 || exit 0
      expected_output: 0
    fix:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -user
        root -exec chown root {} +
tags:
- testing
