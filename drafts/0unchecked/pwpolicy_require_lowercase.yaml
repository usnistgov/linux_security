id: pwpolicy_require_lowercase
title: Ubuntu must enforce password complexity by requiring at least one
  lowercase character be used.
discussion: "A complex password increases the time and resources needed to crack it\
  \ by raising the number of possible combinations. Password complexity thus measures\
  \ resistance to guessing and brute-force attacks."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-004066
    - CCI-000193
    srg:
    - SRG-OS-000070-GPOS-00038
    disa_stig:
      ubuntu_22:
      - UBTU-22-611015
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -qE '^\s*lcredit\s*=\s*-1\s*(#.*)?$' /etc/security/pwquality.conf
          result:
            integer: 0
        fix:
          shell: sudo sh -c 'echo "lcredit = -1" >> /etc/security/pwquality.conf'
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
