id: os_varlog_owned_by_root
title: Ubuntu 24.04 LTS must configure the /var/log directory to be owned by root.
discussion: Only authorized personnel should receive error details, as error messages
  can reveal the operating system, PII, or operational information. Their structure
  and content must be carefully designed according to organizational policy and operational
  requirements.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_24:
      - UBTU-24-700110
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: '[ "$(stat -c ''%U'' /var/log)" = "root" ]'
          result:
            integer: 0
        fix:
          shell: sudo chown root /var/log
tags:
- 800-53r5_moderate
- 800-53r5_high
