id: os_var_log_directory_group_syslog
title: Ubuntu 22.04 LTS must configure the "/var/log" directory to be group-owned
  by "syslog".
discussion: Only authorized personnel should see error details, as messages can reveal
  operational state, OS/platform, PII, or other sensitive information. Error message
  design must align with organizational policy and operational requirements.
references:
  nist:
    800-53r5:
    - SI-11 b
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_2204:
      - UBTU-22-232125
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: stat -c '%G' /var/log | grep -qx syslog
      expected_output: 0
    fix:
      shell: sudo chgrp syslog /var/log
tags:
- testing
