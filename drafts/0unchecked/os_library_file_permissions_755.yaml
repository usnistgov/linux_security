id: os_library_file_permissions_755
title: Ubuntu 22.04 LTS library files must have mode "755" or less permissive.
discussion: Allowing any user to modify software libraries could bypass required testing
  and approvals, undermining change management. Only qualified, authorized personnel
  should have access to modify these libraries, including privileged programs.
references:
  nist:
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_2204:
      - UBTU-22-232020
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: '[ -z "$(sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name ''*.so*''
        -perm /022 2>/dev/null)" ]'
      expected_output: 0
    fix:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' -perm
        /022 -exec chmod go-w {} +
tags:
- testing
