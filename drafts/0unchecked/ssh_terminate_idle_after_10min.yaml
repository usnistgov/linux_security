id: ssh_terminate_idle_after_10min
title: Ubuntu 22.04 LTS must be configured so that all network connections associated
  with SSH traffic are terminated after 10 minutes of becoming unresponsive.
discussion: Terminating unresponsive SSH sessions quickly limits the window for attackers
  to hijack an unattended console session and frees up system resources. It ends only
  the specific session, releasing its TCP/IP and application-level allocations without
  affecting other sessions or network access.
references:
  nist:
    800-53r5:
    - SC-10
  disa:
    cci:
    - CCI-001133
    srg:
    - SRG-OS-000163-GPOS-00072
    disa_stig:
      ubuntu_2204:
      - UBTU-22-255035
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo /usr/sbin/sshd -dd 2>&1 | awk '/filename/ {print $4}' | tr -d '\r'
        | tr '\n' ' ' | xargs sudo grep -iH 'clientaliveinterval'
      expected_output: 0
    fix:
      shell: 'sudo sed -i ''s/^#*ClientAliveInterval.*/ClientAliveInterval 600/''
        /etc/ssh/sshd_config

        sudo systemctl restart ssh'
tags:
- 800-53r5_moderate
- 800-53r5_high
