id: os_journalctl_owned_by_root
title: Ubuntu 22.04 LTS must be configured so that the "journalctl" command is owned
  by "root".
discussion: Only authorized personnel should see error details, as messages can reveal
  operational state, OS/platform, PII, or other sensitive information. Error message
  content must be carefully designed per organizational policy to limit disclosure
  and ensure proper error handling.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232100
      ubuntu_24:
      - UBTU-24-700040
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: '[ "$(stat -c ''%U'' /usr/bin/journalctl)" = "root" ]'
          result:
            integer: 0
        fix:
          shell: sudo chown root /usr/bin/journalctl
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: stat -c "%U" /usr/bin/journalctl
          result:
            string: root
        fix:
          shell: sudo chown root /usr/bin/journalctl
tags:
- 800-53r5_moderate
- 800-53r5_high
