id: os_time_sync_every_24h
title: Ubuntu 24.04 LTS must compare internal information system clocks at least every
  24 hours with an authoritative time server.
discussion: Accurate time stamps are essential for correlating events and conducting
  forensic analysis; unsynchronized clocks can drift and produce inaccurate timestamps.
  Synchronizing internal system clocks ensures uniformity across networked systems,
  particularly for endpoints that lack regular access to an authoritative time server.
references:
  nist:
    800-53r5:
    - SC-45
    - SC-45(01)
  disa:
    cci:
    - CCI-004923
    - CCI-004922
    srg:
    - SRG-OS-000785-GPOS-00250
    disa_stig:
      ubuntu_2404:
      - UBTU-24-600160
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: sudo grep -ir 'maxpoll' /etc/chrony* | grep -v '^\s*#' | awk '$0 ~ /maxpoll/
        {for(i=1;i<=NF;i++) if($i=="maxpoll") {val=$(i+1); if(val+0 <= 16) exit 0}}
        END {exit 1}'
      expected_output: 0
    fix:
      shell: sudo systemctl restart chrony.service
tags:
- testing
