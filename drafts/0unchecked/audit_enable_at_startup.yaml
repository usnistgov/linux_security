id: audit_enable_at_startup
title: Ubuntu 22.04 LTS must initiate session audits at system startup.
discussion: Enabling auditing after startup may miss the actions of early processes
  and lose required state information, since some audit systems need auditing active
  before a process is created.
references:
  nist:
    800-53r5:
    - AU-14(01)
  disa:
    cci:
    - CCI-001464
    srg:
    - SRG-OS-000254-GPOS-00095
    disa_stig:
      ubuntu_2204:
      - UBTU-22-212015
      ubuntu_2404:
      - UBTU-24-102010
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -q 'GRUB_CMDLINE_LINUX.*audit=1' /etc/default/grub && sudo
        grep -q 'GRUB_CMDLINE_LINUX_DEFAULT.*audit=1' /etc/default/grub && [ -z "$(sudo
        grep '^\s*linux' /boot/grub/grub.cfg | sudo grep -v 'audit=1')" ]
      expected_output: 0
    fix:
      shell: sudo update-grub
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo bash -c 'grep -q "GRUB_CMDLINE_LINUX_DEFAULT.*audit=1" /etc/default/grub
        && grep -q "GRUB_CMDLINE_LINUX.*audit=1" /etc/default/grub && grep "^\s*linux"
        /boot/grub/grub.cfg | grep -q audit=1'
      expected_output: 0
    fix:
      shell: sudo update-grub
tags:
- testing
