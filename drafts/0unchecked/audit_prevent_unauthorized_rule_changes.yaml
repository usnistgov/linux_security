id: audit_prevent_unauthorized_rule_changes
title: Ubuntu 24.04 LTS audit system must protect auditing rules from unauthorized
  change.
discussion: Unauthorized disclosure of audit records can expose system and configuration
  data, compromising confidentiality. In immutable mode, users cannot alter audit
  settings to hide malicious activity, and any reboot would be noticeable for investigation.
references:
  nist:
    800-53r5:
    - AU-9 a
  disa:
    cci:
    - CCI-000163
    srg:
    - SRG-OS-000058-GPOS-00028
    disa_stig:
      ubuntu_2404:
      - UBTU-24-909000
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -q '^-e 2' /etc/audit/audit.rules
      expected_output: 0
    fix:
      shell: echo "-e 2" >> /etc/audit/rules.d/audit.rules
tags:
- testing
