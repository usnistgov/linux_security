id: ssh_banner_acknowledgement_required_for_access
title: Ubuntu 24.04 LTS must be configured to enforce the acknowledgement of the Standard
  Mandatory DOD Notice and Consent Banner for all SSH connections.
discussion: "Ubuntu 24.04 LTS must require the user to acknowledge the consent banner\
  \ before granting access, ensuring they have seen and accepted the terms; without\
  \ acknowledgment, the system blocks further activity to remain compliant with legal\
  \ system\u2011use notifications."
references:
  nist:
    800-53r5:
    - AC-08
  disa:
    cci:
    - CCI-000050
    srg:
    - SRG-OS-000024-GPOS-00007
    disa_stig:
      ubuntu_2404:
      - UBTU-24-200680
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -F "You are accessing a U.S. Government (USG) Information System"
        /etc/profile.d/ssh_confirm.sh
      expected_output: 0
    fix:
      shell: sudo vi /etc/profile.d/ssh_confirm.sh
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
