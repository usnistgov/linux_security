id: os_system_cmd_dirs_root
title: Ubuntu must have directories that contain system commands owned by
  root.
discussion: "Protecting audit information requires securing the tools used to view\
  \ and manipulate logs, as unauthorized access could alter audit data. Operating\
  \ systems enforce user permissions and roles to control who can access these audit\
  \ tools, which include vendor-provided, open-source, and custom query\
  \ or report generators."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-001495
    srg:
    - SRG-OS-000258-GPOS-00099
    disa_stig:
      ubuntu_24:
      - UBTU-24-901270
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            ! -user root -type d -exec stat -c "%n %U" '{}' \;
          result:
            string: (no output)
        fix:
          shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            ! -user root -type d -exec chown root '{}' \;
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
