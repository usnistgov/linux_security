id: os_aide_file_integrity_check
title: Ubuntu 22.04 LTS must configure Advanced Intrusion Detection Environment (AIDE)
  to perform file integrity checking on the file system.
discussion: "Without verification, security functions may fail unnoticed; they encompass\
  \ the hardware, software, or firmware that enforce the system\u2019s security policy,\
  \ manage accounts, configure access authorizations, set auditing events, and define\
  \ intrusion\u2011detection parameters. This requirement applies to Ubuntu\u202F\
  22.04\u202FLTS systems that perform security\u2011function verification/testing\
  \ or operate in environments needing this functionality."
references:
  nist:
    800-53r5:
    - SI-06
  disa:
    cci:
    - CCI-002696
    srg:
    - SRG-OS-000445-GPOS-00199
    disa_stig:
      ubuntu_2204:
      - UBTU-22-651015
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo aide -c /etc/aide/aide.conf --check
      expected_output: 0
    fix:
      shell: sudo aideinit
tags:
- 800-53r5_high
