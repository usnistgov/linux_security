id: audit_tools_group_owner_root
title: Ubuntu 24.04 LTS must configure the audit tools to be group owned by root.
discussion: "Protecting audit information requires securing the tools used to view\
  \ and manipulate logs, ensuring only authorized users can access them via permissions\
  \ and roles. Audit tools include vendor\u2011provided, open\u2011source, custom\
  \ queries, and report generators."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-001494
    - CCI-001493
    srg:
    - SRG-OS-000257-GPOS-00098
    disa_stig:
      ubuntu_24:
      - UBTU-24-901250
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: stat -c "%n %G" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace
            /sbin/auditd /sbin/augenrules /sbin/audispd* 2>/dev/null | awk '$2 !=
            "root" {found=1; print $0} END {if (found) exit 1; else exit 0}'
          result:
            integer: 0
        fix:
          shell: sudo chown :root [audit_tool]
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
