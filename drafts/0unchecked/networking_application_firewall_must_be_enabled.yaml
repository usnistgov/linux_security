id: networking_application_firewall_must_be_enabled
title: Ubuntu 22.04 LTS must have an application firewall enabled.
discussion: Firewalls block or limit access to open network ports to protect computers
  from network attacks, while application firewalls further restrict which applications
  may communicate over the network.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00232
    disa_stig:
      ubuntu_22:
      - UBTU-22-251020
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: 'sudo ufw status | grep -q ''Status: active'''
          result:
            integer: 0
        fix:
          shell: sudo ufw enable
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
