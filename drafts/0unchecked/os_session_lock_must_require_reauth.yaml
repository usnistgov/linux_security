id: os_session_lock_must_require_reauth
title: Ubuntu 22.04 LTS must retain a user's session lock until that user reestablishes
  access using established identification and authentication procedures.
discussion: "A session lock is a temporary action taken when a user steps away from\
  \ the system but does not want to log out. Once invoked on Ubuntu\u202F22.04\u202F\
  LTS, it remains in place until the user reauthenticates, with no other activity\
  \ able to unlock it."
references:
  nist:
    800-53r5:
    - AC-11 b
  disa:
    cci:
    - CCI-000056
    srg:
    - SRG-OS-000028-GPOS-00009
    disa_stig:
      ubuntu_2204:
      - UBTU-22-271020
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo gsettings get org.gnome.desktop.screensaver lock-enabled
      expected_output: 'true'
    fix:
      shell: sudo sh -c 'printf "[org/gnome/desktop/screensaver]\nlock-enabled=true\n"
        > /etc/dconf/db/local.d/00-screensaver'
tags:
- testing
