id: os_journal_no_sensitive_info
title: Ubuntu 22.04 LTS must generate system journal entries without revealing information
  that could be exploited by adversaries.
discussion: "Operating systems that disclose excessive information in error messages\
  \ risk exposing sensitive data, so organizations must carefully control error message\
  \ content. This includes avoiding the release of credentials, personal information,\
  \ or mission\u2011critical details that adversaries could exploit."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001312
    srg:
    - SRG-OS-000205-GPOS-00083
    disa_stig:
      ubuntu_22:
      - UBTU-22-232027
      ubuntu_24:
      - UBTU-24-700020
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /run/log/journal /var/log/journal \( -type d -perm /05027
            \) -o \( -type f -perm /07137 \) -print | grep -q . && exit 1 || exit
            0
          result:
            integer: 0
        fix:
          shell: 'sudo sh -c ''cat >> /usr/lib/tmpfiles.d/systemd.conf <<EOF

            z /run/log/journal 2750 root systemd-journal - -

            Z /run/log/journal/%m ~2750 root systemd-journal - -

            z /var/log/journal 2750 root systemd-journal - -

            z /var/log/journal/%m 2750 root systemd-journal - -

            z /var/log/journal/%m/system.journal 0640 root systemd-journal - -

            EOF

            && reboot'''
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: 'sudo find /run/log/journal /var/log/journal -type d -exec stat -c
            "%a" {} \; | awk ''$1 > 640 {found=1} END {exit found}''


            sudo find /run/log/journal /var/log/journal -type f -exec stat -c "%a"
            {} \; | awk ''$1 > 640 {found=1} END {exit found}'''
          result:
            integer: 0
        fix:
          shell: sudo vi /etc/tmpfiles.d/zzz-systemd-stig.conf
tags:
- 800-53r5_moderate
- 800-53r5_high
