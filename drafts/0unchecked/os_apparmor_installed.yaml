id: os_apparmor_installed
title: Ubuntu 24.04 LTS must have AppArmor installed.
discussion: "Control of program execution prevents unauthorized programs from running,\
  \ particularly on Ubuntu\u202F24.04\u202FLTS where default installations may include\
  \ unnecessary or harmful software. Execution can be limited by environment, privileges,\
  \ subnets, sandboxing, or roles to satisfy SRG-OS-000312-GPOS-\
  00124, SRG-OS-000368-GPOS-00154, and SRG-OS-000370-\
  GPOS-00155."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-03(04)
    - CM-07(02)
    - CM-07(05)
  disa:
    cci:
    - CCI-002165
    - CCI-001764
    - CCI-001774
    srg:
    - SRG-OS-000312-GPOS-00124
    disa_stig:
      ubuntu_24:
      - UBTU-24-100500
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: dpkg -l | grep -q '^ii\s*apparmor'
          result:
            integer: 0
        fix:
          shell: sudo apt install apparmor
tags:
- 800-53r5_moderate
- 800-53r5_high
