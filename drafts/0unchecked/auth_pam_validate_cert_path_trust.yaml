id: auth_pam_validate_cert_path_trust
title: Ubuntu 24.04 LTS, for PKI-based authentication, Privileged Access Management
  (PAM) must validate certificates by constructing a certification path (which includes
  status information) to an accepted trust anchor.
discussion: Path validation ensures a certificate chain leads to a trusted anchor
  and includes revocation status, allowing the relying party to make an informed trust
  decision for certificates not explicitly trusted.
references:
  nist:
    800-53r5:
    - SC-17 b
    - IA-5 (2) (b) (1)
  disa:
    cci:
    - CCI-004909
    - CCI-000185
    srg:
    - SRG-OS-000066-GPOS-00034
    disa_stig:
      ubuntu_2404:
      - UBTU-24-400375
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep use_pkcs11_module /etc/pam_pkcs11/pam_pkcs11.conf | awk '/pkcs11_module
        opensc {/,/}/' /etc/pam_pkcs11/pam_pkcs11.conf | grep cert_policy | grep -q
        ca
      expected_output: 0
    fix:
      shell: 'sudo mkdir -p /etc/pam_pkcs11

        if [ ! -f /etc/pam_pkcs11/pam_pkcs11.conf ]; then sudo cp /usr/share/doc/pam_pkcs11/examples/pam_pkcs11.conf
        /etc/pam_pkcs11/pam_pkcs11.conf; fi

        sudo sed -i ''s/^\(cert_policy\s*=\s*\).*/\1ca,signature,ocsp_on;/'' /etc/pam_pkcs11/pam_pkcs11.conf'
tags:
- testing
