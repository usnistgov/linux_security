id: os_session_user_inactivity_timeout
title: Ubuntu 24.04 LTS must automatically terminate a user session after inactivity
  timeouts have expired.
discussion: "Automatic session termination ends a user's logical session-including\
  \ all associated processes-without disconnecting the underlying network connection,\
  \ triggered by conditions such as inactivity, incident response, or time-of-\
  day restrictions."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-12
  disa:
    cci:
    - CCI-002361
    srg:
    - SRG-OS-000279-GPOS-00109
    disa_stig:
      ubuntu_24:
      - UBTU-24-200060
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -hE '^[^#]*TMOUT=[1-9][0-9]*' /etc/bash.bashrc /etc/profile.d/*
          result:
            integer: 0
        fix:
          shell: sudo bash -c 'grep -qxF "TMOUT=600" /etc/profile.d/99-terminal_tmout.sh
            || echo "TMOUT=600" >> /etc/profile.d/99-terminal_tmout.sh'
tags:
- 800-53r5_moderate
- 800-53r5_high
