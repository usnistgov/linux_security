id: ssh_idle_session_timeout_enable
title: Ubuntu 22.04 LTS must be configured so that all network connections associated
  with SSH traffic terminate after becoming unresponsive.
discussion: Terminating unresponsive SSH sessions quickly limits the window for attackers
  to hijack an unattended console session and frees up system resources. It ends only
  the idle session, releasing its TCP/IP and application resources without affecting
  other connections.
references:
  nist:
    800-53r5:
    - SC-10
  disa:
    cci:
    - CCI-001133
    srg:
    - SRG-OS-000126-GPOS-00066
    disa_stig:
      ubuntu_2204:
      - UBTU-22-255030
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -iH 'clientalivecountmax' /etc/ssh/sshd_config
      expected_output: ClientAliveCountMax 1
    fix:
      shell: 'echo "ClientAliveCountMax 1" | sudo tee -a /etc/ssh/sshd_config

        sudo systemctl restart ssh'
tags:
- testing
