id: os_error_message_information_control
title: Ubuntu 22.04 LTS must generate error messages that provide information necessary
  for corrective actions without revealing information that could be exploited by
  adversaries.
discussion: "Excessive detail in error messages can reveal sensitive information,\
  \ so organizations must restrict what is disclosed according to policy. The /var/log/btmp,\
  \ /var/log/wtmp, and /var/log/lastlog files require group-write and world-\
  read permissions for lastlog to function; tighter permissions will break dependent\
  \ services."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001312
    srg:
    - SRG-OS-000205-GPOS-00083
    disa_stig:
      ubuntu_22:
      - UBTU-22-232026
      ubuntu_24:
      - UBTU-24-700010
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog'
            -type f -exec stat -c "%n %a" {} \; | grep -q . && exit 1 || exit 0
          result:
            integer: 0
        fix:
          shell: sudo find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog'
            -type f -exec chmod 640 '{}' \;
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog'
            -type f -exec stat -c "%n %a" {} \;
          result:
            string: No output (empty stdout indicates compliance)
        fix:
          shell: sudo find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog'
            -type f -exec chmod 640 '{}' \;
tags:
- 800-53r5_moderate
- 800-53r5_high
