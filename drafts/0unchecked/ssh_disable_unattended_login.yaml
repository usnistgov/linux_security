id: ssh_disable_unattended_login
title: Ubuntu must not allow unattended or automatic login via SSH.
discussion: Not restricting system access to authenticated users weakens Ubuntu 22.04
  LTS security.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00229
    disa_stig:
      ubuntu_22:
      - UBTU-22-255025
      ubuntu_24:
      - UBTU-24-300031
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: sudo grep -q -iE '^\s*PermitEmptyPasswords\s+no' /etc/ssh/sshd_config
            && sudo grep -q -iE '^\s*PermitUserEnvironment\s+no' /etc/ssh/sshd_config
          result:
            integer: 0
        fix:
          shell: sudo systemctl restart ssh
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: grep -E '^PermitEmptyPasswords\s+no|^PermitUserEnvironment\s+no'
            /etc/ssh/sshd_config | wc -l
          result:
            integer: 2
        fix:
          shell: sudo systemctl restart ssh
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
