id: networking_enable_ufw
title: Ubuntu 22.04 LTS must enable and run the Uncomplicated Firewall (ufw).
discussion: Remote access services without automated controls increase risk and complicate
  user access management. Ubuntu 22.04 LTS must enforce actions on detected unauthorized
  activity to ensure compliance with remote access policies.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-17(01)
  disa:
    cci:
    - CCI-002314
    srg:
    - SRG-OS-000297-GPOS-00115
    disa_stig:
      ubuntu_22:
      - UBTU-22-251015
      ubuntu_24:
      - UBTU-24-100310
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: 'sudo ufw status | grep -q ''Status: active'''
          result:
            integer: 0
        fix:
          shell: sudo ufw enable
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo systemctl show ufw --property=ActiveState --value | grep -q
            '^active$'
          result:
            integer: 0
        fix:
          shell: sudo ufw enable
tags:
- 800-53r5_moderate
- 800-53r5_high
