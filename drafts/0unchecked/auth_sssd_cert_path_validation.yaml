id: auth_sssd_cert_path_validation
title: Ubuntu 22.04 LTS must ensure SSSD performs certificate path validation, including
  revocation checking, against a trusted anchor for PKI-based authentication.
discussion: "Path validation ensures a relying party can verify a certificate\u2019\
  s chain to a trusted anchor and obtain revocation status, enabling an informed trust\
  \ decision for any certificate not explicitly trusted."
references:
  nist:
    800-53r5:
    - SC-17 b
    - IA-5 (2) (b) (1)
  disa:
    cci:
    - CCI-004909
    - CCI-000185
    srg:
    - SRG-OS-000396-GPOS-00176
    disa_stig:
      ubuntu_2204:
      - UBTU-22-254020
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: 'sudo grep -A 1 ''^\[sssd\]'' /etc/sssd/sssd.conf | grep -q pam


        sudo grep -A 1 ''^\[pam\]'' /etc/sssd/sssd.conf | grep -q ''pam_cert_auth
        = True''


        sudo grep -E ''^\s*certificate_verification\s*='' /etc/sssd/sssd.conf | grep
        -q ''\bca\b'''
      expected_output: 0
    fix:
      shell: sudo vi /etc/sssd/sssd.conf
tags:
- testing
