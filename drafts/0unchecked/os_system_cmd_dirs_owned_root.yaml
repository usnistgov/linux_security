id: os_system_cmd_dirs_owned_root
title: Ubuntu 22.04 LTS must have directories that contain system commands owned by
  "root".
discussion: "Protecting audit tools\u2014including vendor\u2011provided, open\u2011\
  source utilities, and custom queries or report generators\u2014is essential to prevent\
  \ unauthorized manipulation of audit data, and operating systems enforce this protection\
  \ through user permissions and roles."
references:
  nist:
    800-53r5:
    - AU-9 a
  disa:
    cci:
    - CCI-001495
    srg:
    - SRG-OS-000258-GPOS-00099
    disa_stig:
      ubuntu_2204:
      - UBTU-22-232040
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
        ! -user root -type d -exec stat -c "%n %U" '{}' \; | grep -q .
      expected_output: 1
    fix:
      shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
        ! -user root -type d -exec chown root '{}' \;
tags:
- testing
