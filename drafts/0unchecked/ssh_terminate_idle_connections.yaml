id: ssh_terminate_idle_connections
title: Ubuntu 24.04 LTS must immediately terminate all network connections associated
  with SSH traffic after a period of inactivity.
discussion: "Automatic session termination ends user-initiated logical sessions\u2014\
  including all associated processes except those the user explicitly keeps running\u2014\
  without dropping underlying network connections. It is triggered by inactivity,\
  \ incident response, or time-of-day policies and is used on Ubuntu\u202F\
  24.04 LTS when extra assurance is required."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-10
  disa:
    cci:
    - CCI-001133
    srg:
    - SRG-OS-000163-GPOS-00072
    disa_stig:
      ubuntu_24:
      - UBTU-24-600000
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -R '^ClientAliveCountMax' /etc/ssh/sshd_config* | awk '{print
            $2}' | grep -x '1'
          result:
            integer: 0
        fix:
          shell: 'sudo sed -i ''s/^#*ClientAliveCountMax.*/ClientAliveCountMax 1/''
            /etc/ssh/sshd_config

            sudo systemctl restart ssh.service'
tags:
- 800-53r5_moderate
- 800-53r5_high
