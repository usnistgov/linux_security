id: ssh_use_fips1403_mac_algorithms
title: Ubuntu 24.04 LTS SSH client must be configured to use only Message Authentication
  Codes (MACs) employing FIPS 140-3 validated cryptographic hash algorithms.
discussion: "Without cryptographic integrity protections, information can be altered\
  \ by unauthorized users without detection; remote access occurs over external networks,\
  \ whereas local maintenance is performed on\u2011site. Encrypting data in transit\
  \ using cryptographic hash functions, checksums, or message authentication codes\
  \ protects against unauthorized disclosure and modification."
references:
  nist:
    800-53r5:
    - AC-17(02)
  disa:
    cci:
    - CCI-001453
    srg:
    - SRG-OS-000250-GPOS-00093
    disa_stig:
      ubuntu_2404:
      - UBTU-24-100860
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -h '^MACs' /etc/ssh/ssh_config* | grep -v '^#' | sed 's/^MACs[[:space:]]*//'
        | tr -d '[:space:]' | grep -x 'hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256'
        >/dev/null
      expected_output: 0
    fix:
      shell: sudo systemctl restart ssh
tags:
- 800-53r5_moderate
- 800-53r5_high
