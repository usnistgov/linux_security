id: auth_sssd_cert_path_validationV-270735
title: Ubuntu 24.04 LTS, for PKI-based authentication, SSSD must validate certificates
  by constructing a certification path (which includes status information) to an accepted
  trust anchor.
discussion: Path validation ensures that a relying party can make an informed trust
  decision for any certificate not explicitly trusted by verifying a certification
  path to an accepted trust anchor and including status information such as CRL or
  OCSP responses.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-17
    - IA-05(02)
  disa:
    cci:
    - CCI-004909
    - CCI-000185
    srg:
    - SRG-OS-000066-GPOS-00034
    disa_stig:
      ubuntu_24:
      - UBTU-24-400360
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: 'sudo grep -A 1 ''^\[sssd\]'' /etc/sssd/sssd.conf | grep -q pam


            sudo grep -A 1 ''^\[pam]'' /etc/sssd/sssd.conf | grep -q ''pam_cert_auth
            = True''


            sudo grep -q ''^certificate_verification.*ca'' /etc/sssd/sssd.conf'
          result:
            integer: 0
        fix:
          shell: sudo vi /etc/sssd/sssd.conf
tags:
- 800-53r5_moderate
- 800-53r5_high
