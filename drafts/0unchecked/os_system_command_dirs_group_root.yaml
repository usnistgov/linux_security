id: os_system_command_dirs_group_root
title: Ubuntu 24.04 LTS must have directories that contain system commands group-owned
  by root.
discussion: "Protecting audit tools\u2014such as vendor\u2011provided, open\u2011\
  source, and custom query/report generators\u2014is essential to prevent unauthorized\
  \ manipulation of audit information, and operating systems enforce this by using\
  \ user permissions and roles to control access."
references:
  nist:
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-001495
    srg:
    - SRG-OS-000258-GPOS-00099
    disa_stig:
      ubuntu_2404:
      - UBTU-24-901280
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
        ! -group root -type d -exec stat -c "%n %G" '{}' \;
      expected_output: no output
    fix:
      shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
        ! -group root -type d -exec chgrp root '{}' \;
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
