id: audit_file_integrity_change_notify
title: Ubuntu 22.04 LTS must notify designated personnel if baseline configurations
  are changed in an unauthorized manner. The file integrity tool must notify the system
  administrator when changes to the baseline configuration or anomalies in the operation
  of any security functions are discovered.
discussion: Unauthorized changes to the baseline OS configuration can introduce vulnerabilities
  and unintended side effects; detecting such changes and notifying the IMO/ISSO and
  SAs via email or monitoring traps helps maintain system security.
references:
  nist:
    800-53r5:
    - CM-3 (5)
    - SI-6 d
  disa:
    cci:
    - CCI-001744
    - CCI-002702
    srg:
    - SRG-OS-000363-GPOS-00150
    disa_stig:
      ubuntu_2204:
      - UBTU-22-651020
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -i '^\s*silentreports' /etc/default/aide | grep -iq 'no$'
      expected_output: 0
    fix:
      shell: sudo sed -i 's/^SILENTREPORTS=.*/SILENTREPORTS=no/' /etc/default/aide
tags:
- testing
