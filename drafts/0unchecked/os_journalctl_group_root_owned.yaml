id: os_journalctl_group_root_owned
title: Ubuntu 22.04 LTS must be configured so that the "journalctl" command is group-owned
  by "root".
discussion: Only authorized personnel should see error details, as error messages
  can reveal an organization's operational state, OS/platform information, PII, or
  other sensitive data. Their structure and content must be carefully designed per
  organizational policy to prevent unauthorized disclosure.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232105
      ubuntu_24:
      - UBTU-24-700050
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: stat -c "%G" /usr/bin/journalctl | grep -q "^root$"
          result:
            integer: 0
        fix:
          shell: sudo chown :root /usr/bin/journalctl
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: '[ "$(stat -c "%G" /usr/bin/journalctl)" = "root" ]'
          result:
            integer: 0
        fix:
          shell: sudo chown :root /usr/bin/journalctl
tags:
- 800-53r5_moderate
- 800-53r5_high
