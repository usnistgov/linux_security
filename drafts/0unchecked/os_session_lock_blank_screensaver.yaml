id: os_session_lock_blank_screensaver
title: Ubuntu 24.04 LTS must conceal, via the session lock, information previously
  visible on the display with a publicly viewable image.
discussion: Setting the screensaver to blank-only hides the screen contents from passersby.
references:
  nist:
    800-53r5:
    - AC-11 (1)
  disa:
    cci:
    - CCI-000060
    srg:
    - SRG-OS-000031-GPOS-00012
    disa_stig:
      ubuntu_2404:
      - UBTU-24-200043
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: gsettings writable org.gnome.desktop.screensaver picture-uri
      expected_output: 'false'
    fix:
      shell: 'sudo tee /etc/dconf/db/local.d/00-security-settings > /dev/null <<''EOF''

        [org/gnome/desktop/screensaver]

        picture-uri=''''

        EOF


        sudo tee /etc/dconf/db/local.d/locks/00-security-settings-lock > /dev/null
        <<''EOF''

        /org/gnome/desktop/screensaver/picture-uri

        EOF


        sudo dconf update'
tags:
- testing
