id: os_data_at_rest_encryption
title: Ubuntu 24.04 LTS handling data requiring "data at rest" protections must employ
  cryptographic mechanisms to prevent unauthorized disclosure and modification of
  the information at rest.
discussion: "Information at rest is data stored on secondary storage devices (e.g.,\
  \ disks, tapes) within an operating system, including user\u2011generated and OS\
  \ configuration data. Organizations must protect its confidentiality and integrity\
  \ using appropriate mechanisms based on the information\u2019s security category\
  \ or classification."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-28(01)
    - SC-28
    - SC-28(03)
  disa:
    cci:
    - CCI-002475
    - CCI-004910
    - CCI-002476
    - CCI-001199
    srg:
    - SRG-OS-000185-GPOS-00079
    disa_stig:
      ubuntu_24:
      - UBTU-24-600090
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: bash -c 'if [ -z "$(comm -23 <(lsblk -o NAME -n | grep -vE '\''^(vda1|loop|ram)$'\''
            | sort) <(awk '\''{print $1}'\'' /etc/crypttab | sed '\''s|^/dev/||'\''
            | sort))" ]; then exit 0; else exit 1; fi'
          result:
            integer: 0
        fix:
          shell: cryptsetup luksFormat /dev/sda1
tags:
- 800-53r5_moderate
- 800-53r5_high
