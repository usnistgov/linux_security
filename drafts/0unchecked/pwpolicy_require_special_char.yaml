id: pwpolicy_require_special_char
title: Ubuntu 22.04 LTS must enforce password complexity by requiring that at least
  one special character be used.
discussion: "A complex password, particularly one that includes special characters,\
  \ increases the time and resources required to crack it by expanding the number\
  \ of possible combinations. Password complexity thus measures its resistance to\
  \ guessing and brute\u2011force attacks."
references:
  nist:
    800-53r5:
    - IA-5 (1) (h)
  disa:
    cci:
    - CCI-004066
    - CCI-001619
    srg:
    - SRG-OS-000266-GPOS-00101
    disa_stig:
      ubuntu_2204:
      - UBTU-22-611025
      ubuntu_2404:
      - UBTU-24-400330
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -i '^ocredit\s*=' /etc/security/pwquality.conf | grep -q '\-1'
      expected_output: 0
    fix:
      shell: sudo sh -c 'echo "ocredit = -1" >> /etc/security/pwquality.conf'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -q '^\s*ocredit\s*=\s*-1\s*$' /etc/security/pwquality.conf
      expected_output: 0
    fix:
      shell: sudo sh -c 'echo "ocredit=-1" >> /etc/security/pwquality.conf'
tags:
- testing
