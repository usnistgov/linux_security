id: os_syslog_file_mode_640
title: Ubuntu 22.04 LTS must configure "/var/log/syslog" file with mode "640" or less
  permissive.
discussion: Only authorized personnel should see error details, as messages can reveal
  an organization's operational state, OS/platform, PII, or other sensitive information.
  Error message content must be carefully designed according to organizational policy
  to prevent unauthorized disclosure.
references:
  nist:
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_2204:
      - UBTU-22-232030
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: stat -c "%n %a" /var/log/syslog | grep -E '^/var/log/syslog [0-6][0-4]0$'
      expected_output: 0
    fix:
      shell: sudo chmod 0640 /var/log/syslog
tags:
- 800-53r5_moderate
- 800-53r5_high
