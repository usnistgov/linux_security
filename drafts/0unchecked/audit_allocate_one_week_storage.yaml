id: audit_allocate_one_week_storage
title: Ubuntu 24.04 LTS must allocate audit record storage capacity to store at least
  one week's worth of audit records, when audit records are not immediately sent to
  a central audit record storage facility.
discussion: Operating systems must allocate sufficient storage for audit logs, a task
  typically performed during the initial installation of Ubuntu 24.04 LTS.
references:
  nist:
    800-53r5:
    - AU-04
  disa:
    cci:
    - CCI-001849
    srg:
    - SRG-OS-000341-GPOS-00132
    disa_stig:
      ubuntu_2404:
      - UBTU-24-900920
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: LOG_FILE=$(sudo grep ^log_file /etc/audit/auditd.conf | awk -F'=' '{print
        $2}' | xargs); sudo df -h "$LOG_FILE"; sudo du -sh "$(dirname "$LOG_FILE")"
      expected_output: 0
    fix:
      shell: sudo sed -i -E 's@^(log_file\s*=\s*).*@\1 /audit.log@' /etc/audit/auditd.conf
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
