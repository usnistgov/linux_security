id: auth_pam_no_cache_1day
title: Ubuntu 22.04 LTS must be configured such that Pluggable Authentication Module
  (PAM) prohibits the use of cached authentications after one day.
discussion: "Out\u2011of\u2011date cached authentication information may be invalid."
references:
  nist:
    800-53r5:
    - IA-05(13)
  disa:
    cci:
    - CCI-002007
    srg:
    - SRG-OS-000383-GPOS-00166
    disa_stig:
      ubuntu_2204:
      - UBTU-22-631015
      ubuntu_2404:
      - UBTU-24-400340
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: sudo grep -hE '^\s*offline_credentials_expiration\s*=\s*1' /etc/sssd/sssd.conf
        /etc/sssd/conf.d/*.conf >/dev/null 2>&1
      expected_output: 0
    fix:
      shell: sudo sed -i '/^\[pam\]/a offline_credentials_expiration = 1' /etc/sssd/sssd.conf
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: sudo grep -h '^\s*offline_credentials_expiration\s*=\s*1\s*$' /etc/sssd/sssd.conf
        /etc/sssd/conf.d/*.conf
      expected_output: 0
    fix:
      shell: sed -i '/^\[pam\]$/a offline_credentials_expiration = 1' /etc/sssd/sssd.conf
tags:
- testing
