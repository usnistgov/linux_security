id: os_enable_address_space_layout_randomization
title: Ubuntu 22.04 LTS must implement address space layout randomization to protect
  its memory from unauthorized code execution.
discussion: "Adversaries may attempt to execute code in non-executable or restricted\
  \ memory regions, such as through buffer overflow attacks. Defenses like data execution\
  \ prevention (hardware- or software-enforced) and address space layout\
  \ randomization help mitigate these threats."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-16
  disa:
    cci:
    - CCI-002824
    srg:
    - SRG-OS-000433-GPOS-00193
    disa_stig:
      ubuntu_22:
      - UBTU-22-213020
      ubuntu_24:
      - UBTU-24-700310
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sysctl -n kernel.randomize_va_space | grep -qx '2' && ! grep -ER
            '^kernel.randomize_va_space=[^2]' /etc/sysctl.conf /etc/sysctl.d
          result:
            integer: 0
        fix:
          shell: sudo sysctl --system
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sysctl -n kernel.randomize_va_space | grep -qx '2' && ! sudo egrep
            -R "^kernel.randomize_va_space=[^2]" /etc/sysctl.conf /etc/sysctl.d
          result:
            integer: 0
        fix:
          shell: sudo sysctl --system
tags:
- 800-53r5_moderate
- 800-53r5_high
