id: os_verify_security_functions_integrity
title: Ubuntu 22.04 LTS must use a file integrity tool to verify correct operation
  of all security functions.
discussion: "Without verification, security functions may fail unnoticed; they encompass\
  \ the hardware, software, or firmware that enforce the system security policy, manage\
  \ accounts, permissions, auditing, and intrusion detection. This requirement applies\
  \ to Ubuntu\u202F22.04\u202FLTS systems performing security function verification/testing\
  \ or environments that need this functionality."
references:
  nist:
    800-53r5:
    - SI-6 a
  disa:
    cci:
    - CCI-002696
    srg:
    - SRG-OS-000445-GPOS-00199
    disa_stig:
      ubuntu_2204:
      - UBTU-22-651010
      ubuntu_2404:
      - UBTU-24-100100
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: dpkg -l | grep -q '^ii.*aide'
      expected_output: 0
    fix:
      shell: sudo apt install aide
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: dpkg -l | grep -E '^ii.*aide' | wc -l
      expected_output: 2
    fix:
      shell: sudo apt install -y aide
tags:
- testing
