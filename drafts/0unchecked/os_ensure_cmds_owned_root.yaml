id: os_ensure_cmds_owned_root
title: Ubuntu 22.04 LTS must have system commands owned by "root" or a system account.
discussion: "Allowing any user to modify software libraries in Ubuntu\u202F22.04\u202F\
  LTS could introduce untested changes that bypass proper change\u2011management testing\
  \ and approvals. Only qualified, authorized individuals should be permitted to access\
  \ and modify these components, including privileged programs and interpreted\u2011\
  language libraries."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_22:
      - UBTU-22-232050
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            ! -user root -type f -printf '%p %u\n'
          result:
            integer: 0
        fix:
          shell: sudo chown root
tags:
- testing
