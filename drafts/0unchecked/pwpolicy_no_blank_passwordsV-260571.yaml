id: pwpolicy_no_blank_passwordsV-260571
title: Ubuntu 22.04 LTS must not have accounts configured with blank or null passwords.
discussion: An account with an empty password allows anyone to log in and execute
  commands with that account's privileges. Such accounts must not be used in operational
  environments.
references:
  nist:
    800-53r5:
    - CM-6 b
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_2204:
      - UBTU-22-611065
      ubuntu_2404:
      - UBTU-24-300027
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: 'sudo awk -F: ''!$2 {print $1}'' /etc/shadow'
      expected_output: no output
    fix:
      shell: 'sudo passwd

        sudo passwd -l'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: 'sudo awk -F: ''!$2 {print $1; exit 1}'' /etc/shadow'
      expected_output: 0
    fix:
      shell: 'sudo passwd [username]

        sudo passwd -l [username]'
tags:
- testing
