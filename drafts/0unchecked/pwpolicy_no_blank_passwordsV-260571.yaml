id: pwpolicy_no_blank_passwordsV-260571
title: Ubuntu must not have accounts configured with blank or null passwords.
discussion: An account with an empty password allows anyone to log in and execute
  commands with that account's privileges. Such accounts must not be used in operational
  environments.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-611065
      ubuntu_24:
      - UBTU-24-300027
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: 'sudo awk -F: ''!$2 {print $1}'' /etc/shadow'
          result:
            string: no output
        fix:
          shell: 'sudo passwd

            sudo passwd -l'
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: 'sudo awk -F: ''!$2 {print $1; exit 1}'' /etc/shadow'
          result:
            integer: 0
        fix:
          shell: 'sudo passwd [username]

            sudo passwd -l [username]'
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
