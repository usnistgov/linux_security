id: pwpolicy_require_eight_char_change
title: Ubuntu 22.04 LTS must require the change of at least eight characters when
  passwords are changed.
discussion: "If the operating system allows users to reuse large portions of a password,\
  \ it increases the window for guessing and brute-force attacks, raising the\
  \ risk of compromise. The policy mandates a minimum number of changed characters\u2014\
  rounded up for odd-length passwords\u2014to ensure sufficient change between\
  \ successive passwords."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-004066
    - CCI-000195
    srg:
    - SRG-OS-000072-GPOS-00040
    disa_stig:
      ubuntu_22:
      - UBTU-22-611040
      ubuntu_24:
      - UBTU-24-400290
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: value=$(grep -i '^\s*difok\s*=' /etc/security/pwquality.conf | awk
            -F= '{gsub(/[[:space:]]/,"",$2); print $2}'); [[ -n "$value" && "$value"
            -ge 8 ]] && exit 0 || exit 1
          result:
            integer: 0
        fix:
          shell: sudo sh -c 'grep -q "^difok" /etc/security/pwquality.conf && sed
            -i "s/^difok.*/difok = 8/" /etc/security/pwquality.conf || echo "difok
            = 8" >> /etc/security/pwquality.conf'
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -i "difok" /etc/security/pwquality.conf
          result:
            string: difok=8
        fix:
          shell: echo "difok=8" >> /etc/security/pwquality.conf
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
