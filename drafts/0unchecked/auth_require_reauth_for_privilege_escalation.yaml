id: auth_require_reauth_for_privilege_escalation
title: Ubuntu 22.04 LTS must require users to reauthenticate for privilege escalation
  or when changing roles.
discussion: Without reauthentication, users could access unauthorized resources or
  perform unauthorized tasks. Systems that allow privilege escalation must require
  reauthentication.
references:
  nist:
    800-53r5:
    - IA-11
    - SC-11 b
  disa:
    cci:
    - CCI-002038
    - CCI-004895
    srg:
    - SRG-OS-000373-GPOS-00156
    - - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_2204:
      - UBTU-22-432010
      ubuntu_2404:
      - UBTU-24-300021
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -q -iR '!authenticate' /etc/sudoers /etc/sudoers.d/
      expected_output: 1
    fix:
      shell: sed -i '/!authenticate/d' /etc/sudoers && find /etc/sudoers.d -type f
        -exec sed -i '/!authenticate/d' {} +
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -iR '!authenticate' /etc/sudoers /etc/sudoers.d/ >/dev/null
        2>&1
      expected_output: 1
    fix:
      shell: sed -i '/!authenticate/d' /etc/sudoers; find /etc/sudoers.d -type f -exec
        sed -i '/!authenticate/d' {} +
tags:
- testing
