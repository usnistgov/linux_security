id: auth_require_reauth_for_privilege_escalation
title: Ubuntu 22.04 LTS must require users to reauthenticate for privilege escalation
  or when changing roles.
discussion: Without reauthentication, users could access unauthorized resources or
  perform unauthorized tasks. Systems that allow privilege escalation must require
  reauthentication.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-11
    - SC-11
  disa:
    cci:
    - CCI-002038
    - CCI-004895
    srg:
    - SRG-OS-000373-GPOS-00156
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-432010
      ubuntu_24:
      - UBTU-24-300021
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -q -iR '!authenticate' /etc/sudoers /etc/sudoers.d/
          result:
            integer: 1
        fix:
          shell: sed -i '/!authenticate/d' /etc/sudoers && find /etc/sudoers.d -type
            f -exec sed -i '/!authenticate/d' {} +
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -iR '!authenticate' /etc/sudoers /etc/sudoers.d/ >/dev/null
            2>&1
          result:
            integer: 1
        fix:
          shell: sed -i '/!authenticate/d' /etc/sudoers; find /etc/sudoers.d -type
            f -exec sed -i '/!authenticate/d' {} +
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
