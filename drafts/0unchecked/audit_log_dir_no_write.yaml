id: audit_log_dir_no_write
title: Ubuntu 22.04 LTS must be configured so that the audit log directory is not
  write-accessible by unauthorized users.
discussion: If audit information is compromised, forensic analysis cannot determine
  the true source of malicious system activity. Therefore, the operating system must
  protect audit records, settings, and reports from unauthorized deletion.
references:
  nist:
    800-53r5:
    - AU-9 a
  disa:
    cci:
    - CCI-000164
    srg:
    - SRG-OS-000059-GPOS-00029
    disa_stig:
      ubuntu_2204:
      - UBTU-22-653060
      ubuntu_2404:
      - UBTU-24-901380
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: LOG_FILE=$(sudo grep -iw log_file /etc/audit/auditd.conf | awk -F'='
        '{print $2}' | xargs); LOG_DIR=$(dirname "$LOG_FILE"); MODE=$(sudo stat -c
        "%a" "$LOG_DIR"); [ "$MODE" -le 750 ]
      expected_output: 0
    fix:
      shell: sudo chmod -R g-w,o-rwx /var/log/audit
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: dir=$(sudo grep -iw ^log_file /etc/audit/auditd.conf | awk -F'=' '{print
        $2}' | xargs); sudo stat -c "%a" "$(dirname "$dir")" | awk '{if ($1 <= 750)
        exit 0; else exit 1}'
      expected_output: 0
    fix:
      shell: sudo chmod -R 750 /var/log/audit
tags:
- testing
