id: os_journal_files_owned_by_root
title: Ubuntu 24.04 LTS must configure the files used by the system journal to be
  owned by "root"
discussion: Only authorized personnel should see error details, as messages can reveal
  operational state, platform information, or PII. Error message content must be designed
  per organizational policy to prevent unauthorized disclosure.
references:
  nist:
    800-53r5:
    - SI-11 b
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_2404:
      - UBTU-24-700090
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /run/log/journal /var/log/journal -type f ! -user root -print
        | grep -q . && echo "FAIL" || echo "PASS"
      expected_output: PASS
    fix:
      shell: sudo vi /etc/tmpfiles.d/zzz-systemd-stig.conf
tags:
- testing
