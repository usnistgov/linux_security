id: ssh_require_ssh_for_transmission
title: Ubuntu 22.04 LTS must use SSH to protect the confidentiality and integrity
  of transmitted information.
discussion: Without protection, transmitted information can be intercepted and altered,
  compromising confidentiality and integrity. This applies to all internal and external
  network communications and can be safeguarded via physical or cryptographic means.
references:
  nist:
    800-53r5:
    - SC-08(02)
    - SC-08
  disa:
    cci:
    - CCI-002418
    - CCI-002422
    - CCI-002420
    srg:
    - SRG-OS-000423-GPOS-00187
    disa_stig:
      ubuntu_2204:
      - UBTU-22-255015
      ubuntu_2404:
      - UBTU-24-100810
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: sudo systemctl is-enabled ssh.service && sudo systemctl is-active ssh.service
      expected_output: 0
    fix:
      shell: sudo systemctl enable ssh.service --now
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: sudo systemctl is-enabled sshd.service | grep -q enabled && sudo systemctl
        is-active sshd.service | grep -q active
      expected_output: 0
    fix:
      shell: 'sudo systemctl enable ssh.service

        sudo systemctl start ssh.service'
tags:
- 800-53r5_moderate
- 800-53r5_high
