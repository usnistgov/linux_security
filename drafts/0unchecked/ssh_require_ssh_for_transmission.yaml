id: ssh_require_ssh_for_transmission
title: Ubuntu must use SSH to protect the confidentiality and integrity
  of transmitted information.
discussion: Without protection, transmitted information can be intercepted and altered,
  compromising confidentiality and integrity. This applies to all internal and external
  network communications and can be safeguarded via physical or cryptographic means.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-08(02)
    - SC-08
  disa:
    cci:
    - CCI-002418
    - CCI-002422
    - CCI-002420
    srg:
    - SRG-OS-000423-GPOS-00187
    disa_stig:
      ubuntu_22:
      - UBTU-22-255015
      ubuntu_24:
      - UBTU-24-100810
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: sudo systemctl is-enabled ssh.service && sudo systemctl is-active
            ssh.service
          result:
            integer: 0
        fix:
          shell: sudo systemctl enable ssh.service --now
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: sudo systemctl is-enabled sshd.service | grep -q enabled && sudo
            systemctl is-active sshd.service | grep -q active
          result:
            integer: 0
        fix:
          shell: 'sudo systemctl enable ssh.service

            sudo systemctl start ssh.service'
tags:
- 800-53r5_moderate
- 800-53r5_high
