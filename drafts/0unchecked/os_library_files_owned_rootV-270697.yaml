id: os_library_files_owned_rootV-270697
title: Ubuntu 24.04 LTS library files must be owned by root.
discussion: "Allowing any user to modify software libraries could introduce untested\
  \ changes that bypass proper change\u2011management controls. Only qualified, authorized\
  \ individuals should be permitted to access and alter these components, including\
  \ privileged programs."
references:
  nist:
    800-53r5:
    - CM-5 (6)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_2404:
      - UBTU-24-300007
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -user
        root -print
      expected_output: no output
    fix:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -user
        root -exec chown root {} +
tags:
- testing
