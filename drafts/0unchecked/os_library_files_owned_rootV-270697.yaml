id: os_library_files_owned_rootV-270697
title: Ubuntu 24.04 LTS library files must be owned by root.
discussion: "Allowing any user to modify software libraries could introduce untested\
  \ changes that bypass proper change-management controls. Only qualified, authorized\
  \ individuals should be permitted to access and alter these components, including\
  \ privileged programs."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_24:
      - UBTU-24-300007
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' !
            -user root -print
          result:
            string: no output
        fix:
          shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' !
            -user root -exec chown root {} +
tags:
- testing
