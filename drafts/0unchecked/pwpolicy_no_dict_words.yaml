id: pwpolicy_no_dict_words
title: Ubuntu 22.04 LTS must prevent the use of dictionary words for passwords.
discussion: "Allowing dictionary-based passwords in Ubuntu 22.04 LTS raises the risk\
  \ of compromise by making passwords easier to guess or brute\u2011force."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00225
    - SRG-OS-000710-GPOS-00160
    disa_stig:
      ubuntu_22:
      - UBTU-22-611030
      ubuntu_24:
      - UBTU-24-300014
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -qE '^\s*dictcheck\s*=\s*1' /etc/security/pwquality.conf
          result:
            integer: 0
        fix:
          shell: echo "dictcheck = 1" | sudo tee -a /etc/security/pwquality.conf
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -q '^\s*dictcheck\s*=\s*1' /etc/security/pwquality.conf
          result:
            integer: 0
        fix:
          shell: sudo sed -i 's/^#*dictcheck=.*/dictcheck=1/' /etc/security/pwquality.conf
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
