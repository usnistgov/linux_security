id: audit_log_file_access_controlV-270827
title: Ubuntu 24.04 LTS must be configured so that audit log files are not read or
  write-accessible by unauthorized users.
discussion: "Unauthorized disclosure of audit records can expose system and configuration\
  \ data, compromising confidentiality. Audit information\u2014including records,\
  \ settings, and reports\u2014is required to audit OS activity and satisfies SRG-OS-000057-GPOS-00027\
  \ and SRG-OS-000058-GPOS-00028."
references:
  nist:
    800-53r5:
    - AU-9 a
  disa:
    cci:
    - CCI-000163
    - CCI-000162
    srg:
    - SRG-OS-000057-GPOS-00027
    disa_stig:
      ubuntu_2404:
      - UBTU-24-901300
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo stat -c "%n %a" /var/log/audit/*
      expected_output: 0
    fix:
      shell: sudo chmod 0600 /var/log/audit/*
tags:
- testing
