id: os_set_sticky_bit_public_dirs
title: Ubuntu 22.04 LTS must set a sticky bit on all public directories to prevent
  unauthorized and unintended information transferred via shared system resources.
discussion: "Preventing unauthorized information transfers ensures that data\u2014\
  including encrypted data\u2014left by previous users or processes on shared resources\
  \ (registers, memory, disks) is not accessible to subsequent users or processes\
  \ after those resources are released. This concept, known as object reuse or residual\
  \ information protection, applies to IT product design and component configuration\
  \ and can be validated through acceptance/verification processes."
references:
  nist:
    800-53r5:
    - SC-04
  disa:
    cci:
    - CCI-001090
    srg:
    - SRG-OS-000138-GPOS-00069
    disa_stig:
      ubuntu_2204:
      - UBTU-22-232145
      ubuntu_2404:
      - UBTU-24-600150
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: '! sudo find / -type d -perm -002 ! -perm -1000 | grep -q .'
      expected_output: 0
    fix:
      shell: sudo chmod +t <directory>
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find / -type d -perm -002 ! -perm -1000 -print | grep -q .
      expected_output: $?
    fix:
      shell: sudo chmod +t [Public Directory]
tags:
- 800-53r5_moderate
- 800-53r5_high
