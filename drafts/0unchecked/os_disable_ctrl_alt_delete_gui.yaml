id: os_disable_ctrl_alt_delete_gui
title: Ubuntu 22.04 LTS must disable the x86 Ctrl-Alt-Delete key sequence if a graphical
  user interface is installed.
discussion: "Pressing Ctrl\u2011Alt\u2011Delete at the console can reboot the system,\
  \ and an accidental press may cause a brief loss of availability. In a graphical\
  \ environment the action requires confirmation, reducing the risk of unintentional\
  \ reboot."
references:
  nist:
    800-53r5:
    - CM-6 b
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_2204:
      - UBTU-22-271030
      ubuntu_2404:
      - UBTU-24-300025
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: gsettings get org.gnome.settings-daemon.plugins.media-keys logout | grep
        -q '^@as \[\]$'
      expected_output: 0
    fix:
      shell: 'sudo sh -c ''cat > /etc/dconf/db/local.d/00-mediakeys <<EOF

        [org/gnome/settings-daemon/plugins/media-keys]

        logout=@as []

        EOF'' && sudo dconf update'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: gsettings get org.gnome.settings-daemon.plugins.media-keys logout | grep
        -qxF "@as []"
      expected_output: 0
    fix:
      shell: 'sudo tee /etc/dconf/db/local.d/00-mediakeys > /dev/null <<EOF

        [org/gnome/settings-daemon/plugins/media-keys]

        logout=@as []

        EOF

        sudo dconf update'
tags:
- testing
