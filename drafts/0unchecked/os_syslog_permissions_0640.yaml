id: os_syslog_permissions_0640
title: Ubuntu 24.04 LTS must configure /var/log/syslog file with mode "0640" or less
  permissive.
discussion: Only authorized personnel should see error details, as error messages
  can reveal the operating system, platform, or PII. Organizations must design error
  messages according to policy to avoid exposing sensitive or operational information
  to unauthorized users.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_24:
      - UBTU-24-700150
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: '[ "$(stat -c "%a" /var/log/syslog)" -le 640 ]'
          result:
            integer: 0
        fix:
          shell: sudo chmod 0640 /var/log/syslog
tags:
- 800-53r5_moderate
- 800-53r5_high
