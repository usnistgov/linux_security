id: pwpolicy_no_blank_passwords
title: Ubuntu 22.04 LTS must not allow accounts configured with blank or null passwords.
discussion: An account with an empty password allows anyone to log in and execute
  commands with that account's privileges. Such accounts must not be used in operational
  environments.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-611060
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: grep nullok /etc/pam.d/common-auth /etc/pam.d/common-password
          result:
            integer: 1
        fix:
          shell: sed -i 's/\<nullok\>//g' /etc/pam.d/common-auth /etc/pam.d/common-password
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
