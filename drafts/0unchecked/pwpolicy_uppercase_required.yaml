id: pwpolicy_uppercase_required
title: Ubuntu 24.04 LTS must enforce password complexity by requiring that at least
  one uppercase character be used.
discussion: "Complex passwords increase the time and resources needed to crack them\
  \ by raising the number of possible combinations. This enhances resistance to guessing\
  \ and brute\u2011force attacks."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
    - IA-05(01)
  disa:
    cci:
    - CCI-004065
    - CCI-004066
    srg:
    - SRG-OS-000069-GPOS-00037
    disa_stig:
      ubuntu_24:
      - UBTU-24-400260
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -q '^\s*ucredit\s*=\s*-1\s*(#.*)?$' /etc/security/pwquality.conf
          result:
            integer: 0
        fix:
          shell: echo "ucredit=-1" >> /etc/security/pwquality.conf
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
