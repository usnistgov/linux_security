platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: systemctl is-enabled auditd.service && systemctl is-active auditd.service
          result:
            integer: 0
        fix:
          shell: sudo systemctl enable auditd.service --now
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: 'systemctl is-enabled auditd.service


            systemctl is-active auditd.service'
          result:
            string: enabled
        fix:
          shell: 'sudo systemctl enable auditd.service

            sudo augenrules --load'
