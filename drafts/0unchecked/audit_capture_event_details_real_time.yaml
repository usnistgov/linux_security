id: audit_capture_event_details_real_time
title: Ubuntu 22.04 LTS must produce audit records and reports containing information
  to establish when, where, what type, the source, and the outcome for all DOD-defined
  auditable events and actions in near real time.
discussion: "Without detailed audit records\u2014including timestamps, source/destination\
  \ addresses, user/process IDs, event descriptions, success/failure indicators, filenames,\
  \ and invoked rules\u2014it is difficult to establish, correlate, and investigate\
  \ events leading to outages or attacks, hindering forensic analysis and incident\
  \ response. Associating event types with Ubuntu 22.04 LTS audit logs enables attack\
  \ investigation, resource\u2011usage monitoring, and detection of misconfigurations."
