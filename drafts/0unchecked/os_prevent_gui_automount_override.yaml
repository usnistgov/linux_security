id: os_prevent_gui_automount_override
title: Ubuntu 24.04 LTS must prevent a user from overriding the disabling of the graphical
  user interface automount function.
discussion: "A nonprivileged account is an operating system account that has only\
  \ the permissions of a regular, non\u2011privileged user."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-11
  disa:
    cci:
    - CCI-000056
    srg:
    - SRG-OS-000028-GPOS-00009
    disa_stig:
      ubuntu_24:
      - UBTU-24-200040
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -r 'automount-open' /etc/dconf/db/local.d/locks/*
          result:
            integer: 0
        fix:
          shell: 'echo ''/org/gnome/desktop/media-handling/automount-open'' >> /etc/dconf/db/local.d/locks/00-security-settings-lock

            sudo dconf update'
tags:
- 800-53r5_moderate
- 800-53r5_high
