id: services_disable_unnecessary_nfs_server
title: Ubuntu 22.04 LTS must not have the nfs-kernel-server package installed.
discussion: Operating systems should not install unnecessary default functionality,
  as unneeded services increase the attack surface and risk. Examples include games,
  tools, and demo software not required for mission objectives.
references:
  nist:
    800-53r5:
    - CM-7 a
  disa:
    cci:
    - CCI-000381
    srg:
    - SRG-OS-000095-GPOS-00049
    disa_stig:
      ubuntu_2204:
      - UBTU-22-215040
      ubuntu_2404:
      - UBTU-24-100050
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: dpkg -l | grep -q '^ii.*nfs-kernel-server'
      expected_output: 1
    fix:
      shell: 'sudo apt purge --yes nfs-kernel-server

        sudo apt autoremove --yes

        sudo systemctl list-units --type=service | grep nfs'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: dpkg -l | grep -E '^ii.*(nfs-common|nfs-kernel-server)' >/dev/null; echo
        $?
      expected_output: 1
    fix:
      shell: sudo apt purge --yes nfs-common nfs-kernel-server
tags:
- testing
