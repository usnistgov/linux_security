id: os_library_dirs_owned_rootV-270698
title: Ubuntu 24.04 LTS library directories must be owned by root.
discussion: "Allowing any user to modify software libraries in Ubuntu 24.04 LTS could\
  \ lead to untested changes that bypass proper change\u2011management testing and\
  \ approvals. Only qualified, authorized individuals should be permitted to access\
  \ and modify these components, including privileged programs and interpreted\u2011\
  language libraries."
references:
  nist:
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_2404:
      - UBTU-24-300008
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 ! -user root -type d -exec
        stat -c "%n %U" '{}' \;
      expected_output: No output (i.e., the command returns nothing)
    fix:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 ! -user root -type d -exec
        chown root '{}' \;
tags:
- testing
