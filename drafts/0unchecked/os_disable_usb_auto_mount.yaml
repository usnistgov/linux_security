id: os_disable_usb_auto_mount
title: Ubuntu 22.04 LTS must disable automatic mounting of Universal Serial Bus (USB)
  mass storage driver.
discussion: Without device authentication, unknown peripherals such as flash drives,
  external storage, and printers can be introduced, enabling malicious activity.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-07(09)
    - IA-03
  disa:
    cci:
    - CCI-003959
    - CCI-001958
    srg:
    - SRG-OS-000378-GPOS-00163
    - SRG-OS-000690-GPOS-00140
    disa_stig:
      ubuntu_22:
      - UBTU-22-291010
      ubuntu_24:
      - UBTU-24-300039
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -R '^[^#]*install usb-storage /bin/false' /etc/modprobe.d/ >/dev/null
            && grep -R '^[^#]*blacklist usb-storage' /etc/modprobe.d/ >/dev/null;
            echo $?
          result:
            integer: 0
        fix:
          shell: 'sudo su -c "echo install usb-storage /bin/false >> /etc/modprobe.d/stig.conf"

            sudo su -c "echo blacklist usb-storage >> /etc/modprobe.d/stig.conf"'
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -qE '^[^#]*usb-storage.*/(bin/false|blacklist)' /etc/modprobe.d/*
          result:
            integer: 0
        fix:
          shell: 'sudo su -c "echo install usb-storage /bin/false >> /etc/modprobe.d/DISASTIG.conf"

            sudo su -c "echo blacklist usb-storage >> /etc/modprobe.d/DISASTIG.conf"'
tags:
- 800-53r5_moderate
- 800-53r5_high
