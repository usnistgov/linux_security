id: auth_require_piv_credential_usage
title: Ubuntu 24.04 LTS must accept Personal Identity Verification (PIV) credentials.
discussion: "PIV credentials, such as the DoD\u2011mandated CAC, standardize identity\
  \ management and authentication under HSPD\u201112, reducing unauthorized\u2011\
  access risk and serving as a key layer of protection for national security systems."
