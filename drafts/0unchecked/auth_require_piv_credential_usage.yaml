    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: dpkg -l | grep -q opensc-pkcs11
          result:
            integer: 0
        fix:
          shell: sudo apt install -y opensc-pkcs11
