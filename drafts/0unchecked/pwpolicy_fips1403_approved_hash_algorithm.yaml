id: pwpolicy_fips1403_approved_hash_algorithm
title: Ubuntu 22.04 LTS must encrypt all stored passwords with a FIPS 140-3-approved
  cryptographic hashing algorithm.
discussion: Passwords must be protected at all times, and encryption is the standard
  method to prevent them from being readable in clear text. Unencrypted passwords
  can be easily compromised.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - IA-07
  disa:
    cci:
    - CCI-000803
    srg:
    - SRG-OS-000120-GPOS-00061
    disa_stig:
      ubuntu_22:
      - UBTU-22-611070
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -E '^\s*[^#]' /etc/login.defs | grep -iq '^\s*encrypt_method\s*[=:]\s*sha512\s*$'
          result:
            integer: 0
        fix:
          shell: sudo sed -i 's/^#*ENCRYPT_METHOD.*/ENCRYPT_METHOD SHA512/' /etc/login.defs
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
