id: ssh_enforce_fips1403_mac_usage
title: Ubuntu 24.04 LTS must configure the SSH daemon to use Message Authentication
  Codes (MACs) employing FIPS 140-3 approved cryptographic hashes to prevent the unauthorized
  disclosure of information and/or detect changes to information during transmission.
discussion: "Without cryptographic integrity protections, information can be altered\
  \ by unauthorized users without detection. Remote access and maintenance activities\
  \ (local or nonlocal) occur over networks, and encrypting transmission protects\
  \ against disclosure and modification, with cryptographic mechanisms like hash functions\
  \ ensuring integrity, satisfying SRG\u2011OS\u2011000250\u2011GPOS\u201100093, SRG\u2011\
  OS\u2011000393\u2011GPOS\u201100173, and SRG\u2011OS\u2011000424\u2011GPOS\u2011\
  00188."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-17(02)
    - MA-04(06)
    - SC-08(01)
  disa:
    cci:
    - CCI-001453
    - CCI-002421
    - CCI-002890
    srg:
    - SRG-OS-000250-GPOS-00093
    disa_stig:
      ubuntu_24:
      - UBTU-24-100830
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: line=$(grep -E '^\s*MACs\s+' /etc/ssh/sshd_config* | grep -v '^\s*#'
            | head -n1); [ -n "$line" ] && [ "$(echo "$line" | sed -e 's/^[[:space:]]*//'
            -e 's/[[:space:]]*$//')" = "MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
            ] && exit 0 || exit 1
          result:
            integer: 0
        fix:
          shell: 'sudo sh -c ''echo "MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
            >> /etc/ssh/sshd_config''

            sudo systemctl restart sshd'
tags:
- 800-53r5_moderate
- 800-53r5_high
