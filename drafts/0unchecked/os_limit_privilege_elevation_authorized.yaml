id: os_limit_privilege_elevation_authorized
title: The operating system must restrict privilege elevation to authorized personnel.
discussion: An incorrectly configured sudoers file allows any system user to perform
  privileged actions.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - IA-11
    - SC-11
  disa:
    cci:
    - CCI-002038
    - CCI-004895
    srg:
    - SRG-OS-000396-GPOS-00176
    disa_stig:
      ubuntu_22:
      - UBTU-22-654224
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -E '^ALL\s+ALL=\(ALL\)\s+ALL$|^ALL\s+ALL=\(ALL:ALL\)\s+ALL$'
            /etc/sudoers /etc/sudoers.d/ 2>/dev/null
          result:
            integer: 1
        fix:
          shell: sudo sed -i '/^ALL[[:space:]]\+ALL[[:space:]]*=(ALL)[[:space:]]*ALL$/d'
            /etc/sudoers; sudo sed -i '/^ALL[[:space:]]\+ALL[[:space:]]*=(ALL:ALL)[[:space:]]*ALL$/d'
            /etc/sudoers; sudo find /etc/sudoers.d -type f -exec sed -i '/^ALL[[:space:]]\+ALL[[:space:]]*=(ALL)[[:space:]]*ALL$/d'
            {} +; sudo find /etc/sudoers.d -type f -exec sed -i '/^ALL[[:space:]]\+ALL[[:space:]]*=(ALL:ALL)[[:space:]]*ALL$/d'
            {} +
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
