id: pwpolicy_require_numeric_char
title: Ubuntu 22.04 LTS must enforce password complexity by requiring that at least
  one numeric character be used.
discussion: "A complex password increases the time and resources needed to crack it\
  \ by raising the number of possible combinations. Password complexity thus measures\
  \ resistance to guessing and brute-force attacks."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-004066
    - CCI-000194
    srg:
    - SRG-OS-000071-GPOS-00039
    disa_stig:
      ubuntu_22:
      - UBTU-22-611020
      ubuntu_24:
      - UBTU-24-400280
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -E '^\s*dcredit\s*=\s*-1' /etc/security/pwquality.conf
          result:
            integer: 0
        fix:
          shell: sudo sh -c 'echo "dcredit = -1" >> /etc/security/pwquality.conf'
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: value=$(grep -E '^\s*dcredit\s*=' /etc/security/pwquality.conf |
            cut -d'=' -f2 | tr -d ' ') && [ -n "$value" ] && [ "$value" -le -1 ] &&
            exit 0 || exit 1
          result:
            integer: 0
        fix:
          shell: echo "dcredit=-1" >> /etc/security/pwquality.conf
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
