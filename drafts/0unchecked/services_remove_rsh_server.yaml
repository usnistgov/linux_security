id: services_remove_rsh_server
title: Ubuntu 22.04 LTS must not have the "rsh-server" package installed.
discussion: Unnecessary services increase the attack surface; RSH provides unencrypted
  remote access that can expose privileged passwords and session data. Removing the
  rsh-server package reduces the risk of accidental or intentional activation of this
  insecure service.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - CM-07
  disa:
    cci:
    - CCI-000381
    srg:
    - SRG-OS-000095-GPOS-00049
    disa_stig:
      ubuntu_22:
      - UBTU-22-215030
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: dpkg -l | grep rsh-server
          result:
            integer: 1
        fix:
          shell: sudo apt-get remove rsh-server
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
