id: ssh_disable_x11_forwarding
title: Ubuntu 22.04 LTS must be configured so that remote X connections are disabled,
  unless to fulfill documented and validated mission requirements.
discussion: X11 forwarding can expose the client's display to attack, allowing unauthorized
  access and possible keystroke monitoring if trusted forwarding is enabled, so it
  should be used cautiously or disabled when not required.
references:
  nist:
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_2204:
      - UBTU-22-255040
      ubuntu_2404:
      - UBTU-24-300022
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: sudo grep -iH 'x11forwarding' /etc/ssh/sshd_config
      expected_output: /etc/ssh/sshd_config:X11Forwarding no
    fix:
      shell: sudo systemctl restart ssh
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: high
  enforcement_info:
    check:
      shell: sudo grep -i '^x11forwarding' /etc/ssh/sshd_config* | grep -v '^#' |
        awk '{print $2}'
      expected_output: 'no'
    fix:
      shell: sudo systemctl restart ssh
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
