id: auth_mfa_remote_privileged_accounts
title: Ubuntu 22.04 LTS must implement multifactor authentication for remote access
  to privileged accounts in such a way that one of the factors is provided by a device
  separate from the system gaining access.
discussion: Using a separate authentication device (e.g., CAC or token) safeguards
  credentials even if the information system is compromised, enabling multifactor
  authentication for privileged and remote access as defined. This requirement applies
  to components where device function or organizational user concepts are relevant,
  excluding device management authentication.
references:
  nist:
    800-53r5:
    - IA-2 (6) (b)
    - IA-2 (2)
    - IA-2 (6) (a)
    - IA-2 (1)
  disa:
    cci:
    - CCI-000766
    - CCI-004046
    - CCI-004047
    - CCI-000765
    - CCI-000767
    - CCI-000768
    - CCI-001948
    srg:
    - SRG-OS-000375-GPOS-00160
    disa_stig:
