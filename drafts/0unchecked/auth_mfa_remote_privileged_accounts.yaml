      - UBTU-22-612010
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: dpkg -l | grep -q libpam-pkcs11
      expected_output: 0
    fix:
