id: auth_require_password_privilege_escalation
title: Ubuntu 22.04 LTS must require users to provide a password for privilege escalation.
discussion: Without reauthentication, users could access unauthorized resources or
  perform privileged tasks; therefore, when an operating system allows functional
  capability escalation, it must require the user to reauthenticate.
references:
  nist:
    800-53r5:
    - IA-11
    - SC-11 b
  disa:
    cci:
    - CCI-002038
    - CCI-004895
    srg:
    - SRG-OS-000396-GPOS-00176
    - - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_2204:
      - UBTU-22-432011
      ubuntu_2404:
      - UBTU-24-300020
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -R -i 'NOPASSWD' /etc/sudoers /etc/sudoers.d/ >/dev/null ;
        echo $?
      expected_output: 1
    fix:
      shell: sudo find /etc/sudoers /etc/sudoers.d -type f -exec sed -i '/NOPASSWD/
        s/^/# /g' {} \;
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo grep -iqR 'NOPASSWD' /etc/sudoers /etc/sudoers.d/ ; echo $?
      expected_output: 1
    fix:
      shell: sudo find /etc/sudoers /etc/sudoers.d -type f -exec sed -i '/NOPASSWD/
        s/^/# /g' {} \;
tags:
- testing
