id: audit_log_file_access_control
title: Ubuntu 22.04 LTS must be configured so that audit log files are not read- or
  write-accessible by unauthorized users.
discussion: "Unauthorized disclosure of audit records can expose system and configuration\
  \ data, compromising confidentiality. Audit information\u2014including records,\
  \ settings, and reports\u2014is essential for auditing operating system activity."
references:
  nist:
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-000163
    - CCI-000162
    srg:
    - SRG-OS-000057-GPOS-00027
    disa_stig:
      ubuntu_2204:
      - UBTU-22-653045
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: log_dir=$(grep -iw log_file /etc/audit/auditd.conf | awk -F'=' '{print
        $2}' | xargs dirname); [ -z "$log_dir" ] && exit 1; if [ -z "$(find "$log_dir"
        -type f ! -perm 600 2>/dev/null)" ]; then exit 0; else exit 1; fi
      expected_output: 0
    fix:
      shell: sudo chmod 600 /var/log/audit/*
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
