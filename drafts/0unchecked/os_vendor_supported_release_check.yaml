id: os_vendor_supported_release_check
title: Ubuntu 22.04 LTS must be a vendor-supported release.
discussion: "An OS release is considered supported only while the vendor provides\
  \ security patches; unsupported releases cannot receive fixes for discovered vulnerabilities.\
  \ For Ubuntu\u202F22.04, standard support ends April\u202F2027, and Extended Security\
  \ Maintenance (available via an Ubuntu Pro subscription) extends support to April\u202F\
  2032."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-211000
      ubuntu_24:
      - UBTU-24-700400
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: grep -q 'DISTRIB_DESCRIPTION.*Ubuntu 22.04' /etc/lsb-release && pro
            status 2>/dev/null | grep -q 'SUBSCRIPTION STATUS.*Entitled'
          result:
            integer: 0
        fix:
          shell: sudo do-release-upgrade
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: grep -q 'Ubuntu 24.04' /etc/lsb-release && pro status 2>/dev/null
            | grep -q 'Entitled'
          result:
            integer: 0
        fix:
          shell: sudo do-release-upgrade
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
