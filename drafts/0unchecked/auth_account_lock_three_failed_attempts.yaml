id: auth_account_lock_three_failed_attempts
title: Ubuntu 22.04 LTS must automatically lock an account until the locked account
  is released by an administrator when three unsuccessful logon attempts have been
  made.
discussion: "Limiting failed logon attempts reduces the risk of brute\u2011force attacks\
  \ by locking accounts after too many failures."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-07
    - AC-07
  disa:
    cci:
    - CCI-002238
    - CCI-000044
    srg:
    - SRG-OS-000021-GPOS-00005
    disa_stig:
      ubuntu_22:
      - UBTU-22-411045
      ubuntu_24:
      - UBTU-24-200610
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
      enforcement_info:
        check:
          shell: 'grep -q pam_faillock.so /etc/pam.d/common-auth && \

            grep -Eq ''^\s*audit\s*$'' /etc/security/faillock.conf && \

            grep -Eq ''^\s*silent\s*$'' /etc/security/faillock.conf && \

            grep -Eq ''^\s*deny\s*=\s*3\s*(#.*)?$'' /etc/security/faillock.conf &&
            \

            grep -Eq ''^\s*fail_interval\s*=\s*900\s*(#.*)?$'' /etc/security/faillock.conf
            && \

            grep -Eq ''^\s*unlock_time\s*=\s*0\s*(#.*)?$'' /etc/security/faillock.conf'
          result:
            integer: 0
        fix:
          shell: 'sudo sed -i ''/pam_unix.so/a auth     [default=die]  pam_faillock.so
            authfail\nauth     sufficient          pam_faillock.so authsucc'' /etc/pam.d/common-auth

            sudo tee /etc/security/faillock.conf > /dev/null <<EOF

            audit

            silent

            deny = 3

            fail_interval = 900

            unlock_time = 0

            EOF'
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
      enforcement_info:
        check:
          shell: 'grep -q pam_faillock.so /etc/pam.d/common-auth && \

            grep -q ''^\s*audit\s*$'' /etc/security/faillock.conf && \

            grep -q ''^\s*silent\s*$'' /etc/security/faillock.conf && \

            grep -q ''^\s*deny\s*=\s*3\s*$'' /etc/security/faillock.conf && \

            grep -q ''^\s*fail_interval\s*=\s*900\s*$'' /etc/security/faillock.conf
            && \

            grep -q ''^\s*unlock_time\s*=\s*0\s*$'' /etc/security/faillock.conf'
          result:
            integer: 0
        fix:
          shell: 'sed -i ''/pam_unix.so/a auth     [default=die]  pam_faillock.so
            authfail\nauth     sufficient     pam_faillock.so authsucc'' /etc/pam.d/common-auth

            echo -e "audit\nsilent\ndeny = 3\nfail_interval = 900\nunlock_time = 0"
            >> /etc/security/faillock.conf'
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
