id: auth_electronically_verify_piv_credentials
title: Ubuntu 24.04 LTS must electronically verify Personal Identity Verification
  (PIV) credentials.
discussion: "PIV credentials, such as the DoD\u2011mandated Common Access Card (CAC),\
  \ standardize identity management and authentication under HSPD\u201112, reducing\
  \ unauthorized\u2011access risk and serving as a key layer of protection for national\
  \ security systems."
references:
  nist:
    800-53r5:
    - IA-2 (12)
  disa:
    cci:
    - CCI-001954
    srg:
    - SRG-OS-000377-GPOS-00162
    disa_stig:
      ubuntu_2404:
      - UBTU-24-400060
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo awk '/pkcs11_module opensc {/,/}/ { if ($0 ~ /cert_policy/) { if
        ($0 ~ /^[[:space:]]*#/ || $0 !~ /ocsp_on/) { bad=1 } } } END { exit (bad?1:0)
        }' /etc/pam_pkcs11/pam_pkcs11.conf
      expected_output: 0
    fix:
      shell: sed -i '/cert_policy/ s/$/ ocsp_on/' /etc/pam_pkcs11/pam_pkcs11.conf
tags:
- testing
