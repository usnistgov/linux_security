id: auth_limit_sudo_to_authorized
title: Ubuntu 24.04 LTS must restrict privilege elevation to authorized personnel.
discussion: An incorrectly configured sudoers file allows any system user to perform
  privileged actions.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-11
    - SC-11
  disa:
    cci:
    - CCI-002038
    - CCI-004895
    srg:
    - SRG-OS-000373-GPOS-00156
    disa_stig:
      ubuntu_24:
      - UBTU-24-300019
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo grep -iwR 'ALL' /etc/sudoers /etc/sudoers.d/ | grep -v '#' |
            grep -cE '^\s*ALL\s+ALL=\(ALL\)\s+ALL$|^\s*ALL\s+ALL=\(ALL:ALL\)\s+ALL$'
          result:
            integer: 0
        fix:
          shell: sudo sed -i -E '/^\s*ALL\s+ALL=\(ALL\)\s+ALL\s*$/d; /^\s*ALL\s+ALL=\(ALL:ALL\)\s+ALL\s*$/d'
            /etc/sudoers /etc/sudoers.d/*
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
