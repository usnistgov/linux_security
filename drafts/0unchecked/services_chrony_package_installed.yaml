id: services_chrony_package_installed
title: Ubuntu 22.04 LTS must have the "chrony" package installed.
discussion: Inaccurate timestamps hinder event correlation and forensic analysis,
  especially when sources drift beyond allowed limits. Organizations must account
  for endpoints lacking regular access to authoritative time servers.
references:
  nist:
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_2204:
      - UBTU-22-215015
      ubuntu_2404:
      - UBTU-24-100700
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: dpkg -s chrony >/dev/null 2>&1
      expected_output: 0
    fix:
      shell: sudo apt-get install chrony
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: dpkg -l | grep -q '^ii.*chrony'
      expected_output: 0
    fix:
      shell: sudo apt install -y chrony
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
