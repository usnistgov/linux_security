id: os_display_gui_login_banner
title: Ubuntu 22.04 LTS must display the Standard Mandatory DOD Notice and Consent
  Banner before granting local access to the system via a graphical user logon.
discussion: "Ubuntu 22.04 LTS must display a standardized use notification before\
  \ granting access, consistent with federal and DOD policies, for human\u2011user\
  \ logon interfaces; the full banner text is required when space allows, otherwise\
  \ a shortened version may be used."
references:
  nist:
    800-53r5:
    - AC-08
  disa:
    cci:
    - CCI-000048
    srg:
    - SRG-OS-000023-GPOS-00006
    disa_stig:
      ubuntu_2204:
      - UBTU-22-271015
      ubuntu_2404:
      - UBTU-24-200660
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: 'grep -oP ''banner-message-text="\K[^"]+'' /etc/gdm3/greeter.dconf-defaults
        | cmp -s - <(printf ''%s'' "You are accessing a U.S. Government (USG) Information
        System (IS) that is provided for USG-authorized use only.


        By using this IS (which includes any device attached to this IS), you consent
        to the following conditions:


        -The USG routinely intercepts and monitors communications on this IS for purposes
        including, but not limited to, penetration testing, COMSEC monitoring, network
        operations and defense, personnel misconduct (PM), law enforcement (LE), and
        counterintelligence (CI) investigations.


        -At any time, the USG may inspect and seize data stored on this IS.


        -Communications using, or data stored on, this IS are not private, are subject
        to routine monitoring, interception, and search, and may be disclosed or used
        for any USG-authorized purpose.


        -This IS includes security measures (e.g., authentication and access controls)
        to protect USG interests--not for your personal benefit or privacy.


        -Notwithstanding the above, using this IS does not constitute consent to PM,
        LE or CI investigative searching or monitoring of the content of privileged
        communications, or work product, related to personal representation or services
        by attorneys, psychotherapists, or clergy, and their assistants. Such communications
        and work product are private and confidential. See User Agreement for details.")
        && exit 0 || exit 1'
      expected_output: 0
    fix:
      shell: 'sudo dconf update

        sudo systemctl restart gdm3'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: 'grep -Fx ''banner-message-text="You are accessing a U.S. Government
        (USG) Information System (IS) that is provided for USG-authorized use only.
        By using this IS (which includes any device attached to this IS), you consent
        to the following conditions: -The USG routinely intercepts and monitors communications
        on this IS for purposes including, but not limited to, penetration testing,
        COMSEC monitoring, network operations and defense, personnel misconduct (PM),
        law enforcement (LE), and counterintelligence (CI) investigations. -At any
        time, the USG may inspect and seize data stored on this IS. -Communications
        using, or data stored on, this IS are not private, are subject to routine
        monitoring, interception, and search, and may be disclosed or used for any
        USG-authorized purpose. -This IS includes security measures (e.g., authentication
        and access controls) to protect USG interests--not for your personal benefit
        or privacy. -Notwithstanding the above, using this IS does not constitute
        consent to PM, LE or CI investigative searching or monitoring of the content
        of privileged communications, or work product, related to personal representation
        or services by attorneys, psychotherapists, or clergy, and their assistants.
        Such communications and work product are private and confidential. See User
        Agreement for details."'' /etc/gdm3/greeter.dconf-defaults'
      expected_output: 0
    fix:
      shell: 'sudo dconf update

        sudo systemctl restart gdm3'
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
