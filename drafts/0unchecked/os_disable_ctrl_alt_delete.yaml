id: os_disable_ctrl_alt_delete
title: Ubuntu 22.04 LTS must disable the x86 Ctrl-Alt-Delete key sequence.
discussion: "Pressing Ctrl\u2011Alt\u2011Delete at the console can reboot the system,\
  \ and an accidental press may cause unintended loss of availability."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-211015
      ubuntu_24:
      - UBTU-24-300026
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: systemctl show ctrl-alt-del.target -p LoadState --value | grep -q
            masked
          result:
            integer: 0
        fix:
          shell: 'sudo systemctl disable ctrl-alt-del.target

            sudo systemctl mask ctrl-alt-del.target

            sudo systemctl daemon-reload'
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: '[ "$(systemctl is-enabled ctrl-alt-del.target)" = "masked" ]'
          result:
            integer: 0
        fix:
          shell: 'sudo systemctl disable ctrl-alt-del.target

            sudo systemctl mask ctrl-alt-del.target

            sudo systemctl daemon-reload'
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
