id: os_system_commands_groupowned_root
title: Ubuntu must have system commands group-owned by "root" or a system
  account.
discussion: "Allowing any user to modify software libraries in Ubuntu could\
  \ lead to untested changes that bypass proper change-management controls. Only\
  \ qualified and authorized individuals should be permitted to access and modify\
  \ these components, including privileged programs and interpreted-language\
  \ libraries."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_22:
      - UBTU-22-232055
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
            ! -group root -type f ! -perm /2000 -exec stat -c "%n %G" '{}' \; | wc
            -l
          result:
            integer: 0
        fix:
          shell: sudo chgrp root
tags:
- testing
