id: os_syslog_group_adm
title: Ubuntu 22.04 LTS must configure the "/var/log/syslog" file to be group-owned
  by "adm".
discussion: Only authorized personnel should see error details, as messages can reveal
  operational state, OS/platform, PII, or other sensitive information. Error message
  content must be carefully designed per organizational policy to prevent unauthorized
  disclosure.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232135
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: stat -c "%G" /var/log/syslog | grep -q adm
          result:
            integer: 0
        fix:
          shell: sudo chgrp adm /var/log/syslog
tags:
- 800-53r5_moderate
- 800-53r5_high
