id: auth_unique_user_account_identification
title: Ubuntu 22.04 LTS must uniquely identify interactive users.
discussion: Organizational users must be uniquely identified and authenticated for
  all system accesses, except for documented exceptions or authorized group authenticator
  use where individual authentication may not be required.
references:
  nist:
    800-53r5:
    - IA-02
    - IA-08
  disa:
    cci:
    - CCI-000764
    - CCI-000804
    srg:
    - SRG-OS-000104-GPOS-00051
    disa_stig:
      ubuntu_2204:
      - UBTU-22-411015
      ubuntu_2404:
      - UBTU-24-400000
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: 'awk -F: ''!seen[$3]++{uid[$3]=$1; shell[$3]=$7} END{for(u in uid){if(seen[u]>1
        && (shell[u]!="/usr/sbin/nologin" && shell[u]!="/bin/false") && u>=1000) print
        uid[u], u}}'' /etc/passwd'
      expected_output: 0
    fix:
      shell: vipw
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: 'awk -F: ''list[$3]++{print $1,$3; exit 1}'' /etc/passwd'
      expected_output: 0
    fix:
      shell: vipw
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
