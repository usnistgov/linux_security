id: auth_disable_inactive_accounts_35days
title: Ubuntu 22.04 LTS must disable account identifiers (individuals, groups, roles,
  and devices) after 35 days of inactivity.
discussion: Inactive identifiers can be exploited for undetected access, and owners
  may not notice unauthorized use. Systems should track inactivity and disable identifiers
  after 35 days.
references:
  nist:
    800-53r5:
    - AC-2 (3) (b)
    - AC-2 (3) (a)
  disa:
    cci:
    - CCI-003627
    - CCI-000795
    - CCI-003628
    srg:
    - SRG-OS-000118-GPOS-00060
    disa_stig:
      ubuntu_2204:
      - UBTU-22-411035
      ubuntu_2404:
      - UBTU-24-200260
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -E '^INACTIVE=35' /etc/default/useradd
      expected_output: 0
    fix:
      shell: sudo useradd -D -f 35
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: awk -F= '$1=="INACTIVE" && $2+0>=1 && $2+0<=35 {exit 0} END {exit 1}'
        /etc/default/useradd
      expected_output: 0
    fix:
      shell: sudo useradd -D -f 35
tags:
- testing
