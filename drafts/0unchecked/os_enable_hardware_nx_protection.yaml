id: os_enable_hardware_nx_protection
title: Ubuntu 22.04 LTS must implement nonexecutable data to protect its memory from
  unauthorized code execution.
discussion: "Adversaries may try to run code in non\u2011executable or protected memory\
  \ areas, such as via buffer overflow attacks. Defenses like data execution prevention\
  \ (hardware\u2011 or software\u2011enforced) and address space layout randomization\
  \ help block such exploits."
references:
  nist:
    800-53r5:
    - SI-16
  disa:
    cci:
    - CCI-002824
    srg:
    - SRG-OS-000433-GPOS-00192
    disa_stig:
      ubuntu_2204:
      - UBTU-22-213025
      ubuntu_2404:
      - UBTU-24-700300
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: 'sudo dmesg | grep -iq "execute disable.*protection: active" || grep
        -q nx /proc/cpuinfo'
      expected_output: 0
    fix:
      shell: grep -i nx /proc/cpuinfo
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo dmesg | grep -qi "execute disable" && exit 0 || { grep -w nx /proc/cpuinfo
        && exit 0 || exit 1; }
      expected_output: 0
    fix:
      shell: sudo sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="\(.*\)"/GRUB_CMDLINE_LINUX_DEFAULT="\1
        nx"/' /etc/default/grub && sudo update-grub
tags:
- testing
