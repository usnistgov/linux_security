id: os_enable_hardware_nx_protection
title: Ubuntu 22.04 LTS must implement nonexecutable data to protect its memory from
  unauthorized code execution.
discussion: "Adversaries may try to run code in non-executable or protected memory\
  \ areas, such as via buffer overflow attacks. Defenses like data execution prevention\
  \ (hardware- or software-enforced) and address space layout randomization\
  \ help block such exploits."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-16
  disa:
    cci:
    - CCI-002824
    srg:
    - SRG-OS-000433-GPOS-00192
    disa_stig:
      ubuntu_22:
      - UBTU-22-213025
      ubuntu_24:
      - UBTU-24-700300
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: 'sudo dmesg | grep -iq "execute disable.*protection: active" || grep
            -q nx /proc/cpuinfo'
          result:
            integer: 0
        fix:
          shell: grep -i nx /proc/cpuinfo
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo dmesg | grep -qi "execute disable" && exit 0 || { grep -w nx
            /proc/cpuinfo && exit 0 || exit 1; }
          result:
            integer: 0
        fix:
          shell: sudo sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="\(.*\)"/GRUB_CMDLINE_LINUX_DEFAULT="\1
            nx"/' /etc/default/grub && sudo update-grub
tags:
- 800-53r5_moderate
- 800-53r5_high
