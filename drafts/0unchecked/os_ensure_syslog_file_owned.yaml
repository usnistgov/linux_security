id: os_ensure_syslog_file_owned
title: Ubuntu 24.04 LTS must configure /var/log/syslog file to be owned by syslog.
discussion: Only authorized personnel should receive error details, and error messages
  must not expose PII or operational information. The design and content of error
  messages must align with organizational policies and operational requirements.
references:
  nist:
    800-53r5:
    - SI-11 b
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_2404:
      - UBTU-24-700140
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: stat -c "%U" /var/log/syslog | grep -q syslog
      expected_output: 0
    fix:
      shell: sudo chown syslog /var/log/syslog
tags:
- testing
