id: os_libdirs_must_be_group_root
title: Ubuntu 24.04 LTS library directories must be group-owned by root.
discussion: "Allowing any user to modify software libraries could lead to untested\
  \ changes that bypass proper change\u2011management testing and approvals. Only\
  \ qualified, authorized individuals should be permitted to access and modify these\
  \ components, including privileged programs."
references:
  nist:
    800-53r5:
    - CM-5 (6)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_2404:
      - UBTU-24-300010
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /lib /usr/lib /lib64 ! -group root -type d -exec stat -c "%n
        %G" '{}' \;
      expected_output: 0
    fix:
      shell: sudo find /lib /usr/lib /lib64 ! -group root -type d -exec chgrp root
        '{}' \;
tags:
- testing
