id: os_system_commands_groupowned_rootV-270703
title: Ubuntu 24.04 LTS must have system commands group-owned by root or a system
  account.
discussion: "Allowing any user to modify software libraries in Ubuntu 24.04 LTS could\
  \ lead to untested changes that bypass proper change\u2011management testing and\
  \ approvals. Only qualified and authorized individuals should be permitted to access\
  \ and alter these components."
references:
  nist:
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_2404:
      - UBTU-24-300013
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: output=$(find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
        -type f -perm -u=x -exec stat --format="%n %G" {} + | awk '$2 != "root" &&
        $2 != "daemon" && $2 != "adm" && $2 != "shadow" && $2 != "mail" && $2 != "crontab"
        && $2 != "_ssh"'); if [ -z "$output" ]; then exit 0; else echo "$output";
        exit 1; fi
      expected_output: 0
    fix:
      shell: sudo chgrp [SYSTEMACCOUNT] [FILE]
tags:
- testing
