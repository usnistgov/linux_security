id: os_encrypt_data_at_rest
title: Ubuntu 22.04 LTS must implement cryptographic mechanisms to prevent unauthorized
  disclosure and modification of all information that requires protection at rest.
discussion: "Operating systems must use cryptographic mechanisms to protect data at\
  \ rest, selecting mechanisms based on the information's security category and integrity\
  \ needs, with options for full-disk or selective encryption. This satisfies\
  \ SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-\
  00183, and SRG-OS-000405-GPOS-00184."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - SC-28(01)
    - SC-28
  disa:
    cci:
    - CCI-002475
    - CCI-002476
    - CCI-001199
    srg:
    - SRG-OS-000185-GPOS-00079
    disa_stig:
      ubuntu_22:
      - UBTU-22-231010
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo fdisk -l | awk '$6=="Linux"{print $1}' | grep -vE '^/dev/sda1$'
            | while read dev; do if ! grep -q "^$dev[[:space:]]" /etc/crypttab; then
            echo "Missing $dev"; exit 1; fi; done; exit 0
          result:
            integer: 0
        fix:
          shell: '</think>

            </think>

            (No command provided in the description)'
tags:
- 800-53r5_moderate
- 800-53r5_high
