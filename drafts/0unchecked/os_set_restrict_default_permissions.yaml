id: os_set_restrict_default_permissions
title: Ubuntu 22.04 LTS default filesystem permissions must be defined in such a way
  that all authenticated users can read and modify only their own files.
discussion: Setting the most restrictive default permissions prevents new accounts
  from gaining unnecessary access.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00228
    disa_stig:
      ubuntu_22:
      - UBTU-22-412035
      ubuntu_24:
      - UBTU-24-300030
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -E '^\s*UMASK\s+077' /etc/login.defs
          result:
            integer: 0
        fix:
          shell: sudo sed -i 's/^UMASK.*/UMASK 077/' /etc/login.defs
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -iq '^\s*umask\s\+077' /etc/login.defs
          result:
            integer: 0
        fix:
          shell: sed -i 's/^UMASK.*/UMASK 077/' /etc/login.defs
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
