id: services_disable_rsh_server_package
title: Ubuntu 24.04 LTS must not have the rsh-server package installed.
discussion: Operating systems should not install unnecessary default functionality,
  as unneeded services increase the attack surface and risk. Examples include games,
  demo software, and extra tools that cannot be disabled.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-07
  disa:
    cci:
    - CCI-000381
    srg:
    - SRG-OS-000095-GPOS-00049
    disa_stig:
      ubuntu_24:
      - UBTU-24-100040
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
      enforcement_info:
        check:
          shell: dpkg -l | grep -q rsh-server
          result:
            integer: 0
        fix:
          shell: sudo apt remove rsh-server
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
