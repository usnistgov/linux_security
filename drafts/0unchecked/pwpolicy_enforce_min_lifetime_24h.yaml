id: pwpolicy_enforce_min_lifetime_24h
title: Ubuntu 22.04 LTS must enforce 24 hours/one day as the minimum password lifetime.
  Passwords for new users must have a 24 hours/one day minimum password lifetime restriction.
discussion: Enforcing a minimum password lifetime prevents users from changing passwords
  too frequently to bypass reuse or history policies. It stops rapid successive changes
  that could defeat password reuse controls.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-000198
    - CCI-004066
    srg:
    - SRG-OS-000075-GPOS-00043
    disa_stig:
      ubuntu_22:
      - UBTU-22-411025
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: awk '/^\s*PASS_MIN_DAYS\s+[0-9]+/ {found=1; if ($2 >= 1) exit 0;
            else exit 1} END {if (!found) exit 1}' /etc/login.defs
          result:
            integer: 0
        fix:
          shell: echo "PASS_MIN_DAYS    1" | sudo tee -a /etc/login.defs
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
