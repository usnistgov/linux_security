id: os_library_group_owned_root
title: Ubuntu 24.04 LTS library files must be group-owned by root or a system account.
discussion: "Allowing any user to modify software libraries could introduce untested\
  \ changes that bypass proper change\u2011management controls. Only authorized personnel\
  \ should be permitted to access and alter libraries, including privileged programs."
references:
  nist:
    800-53r5:
    - CM-5 (6)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_2404:
      - UBTU-24-300009
platforms:
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -group
        root -exec stat -c "%n %G" {} + | grep -q . && false || true
      expected_output: 0
    fix:
      shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -group
        root -exec chown :root {} +
tags:
- testing
