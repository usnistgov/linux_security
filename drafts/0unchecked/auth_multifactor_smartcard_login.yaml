id: auth_multifactor_smartcard_login
title: Ubuntu 22.04 LTS must implement smart card logins for multifactor authentication
  for local and network access to privileged and nonprivileged accounts.
discussion: "Without multifactor authentication, access to privileged functions is\
  \ significantly easier; MFA requires two or more factors\u2014something you know,\
  \ have, or are\u2014and is exemplified by the DOD CAC with PKI."
references:
  nist:
    800-53r5:
    - IA-2 (6) (b)
    - IA-2 (2)
    - IA-2 (1)
  disa:
    cci:
    - CCI-000766
    - CCI-004047
    - CCI-000765
    - CCI-000767
    - CCI-000768
    srg:
    - SRG-OS-000105-GPOS-00052
    disa_stig:
      ubuntu_2204:
      - UBTU-22-612020
      ubuntu_2404:
      - UBTU-24-400020
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: 'grep -E ''^[^#]*pam_pkcs11\.so'' /etc/pam.d/common-auth >/dev/null


        grep -E ''^[[:space:]]*PubkeyAuthentication[[:space:]]+yes'' /etc/ssh/sshd_config
        >/dev/null'
      expected_output: 0
    fix:
      shell: 'echo ''auth     [success=3 default=ignore]     pam_pkcs11.so'' | sudo
        tee -a /etc/pam.d/common-auth

        echo ''PubkeyAuthentication yes'' | sudo tee -a /etc/ssh/sshd_config'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: grep -E '^\s*auth.*pam_pkcs11\.so' /etc/pam.d/common-auth
      expected_output: 0
    fix:
      shell: sudo bash -c 'if grep -q "^auth.*pam_pkcs11.so" /etc/pam.d/common-auth;
        then sed -i '\''s/^auth.*pam_pkcs11.so.*/auth    [success=2 default=ignore]
        pam_pkcs11.so/'\'' /etc/pam.d/common-auth; else echo "auth    [success=2 default=ignore]
        pam_pkcs11.so" >> /etc/pam.d/common-auth; fi'
tags:
- testing
