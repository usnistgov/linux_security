id: pwpolicy_require_pwquality_on_change
title: Ubuntu 22.04 LTS must be configured so that when passwords are changed or new
  passwords are established, pwquality must be used.
discussion: "Complex passwords increase the time and resources needed to crack them,\
  \ and pwquality enforces strong password construction while limiting brute\u2011\
  force attacks on the system."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00225
    disa_stig:
      ubuntu_22:
      - UBTU-22-611045
      ubuntu_24:
      - UBTU-24-300016
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: 'grep -i enforcing /etc/security/pwquality.conf


            grep -E ''^\s*password\s+requisite\s+pam_pwquality\.so'' /etc/pam.d/common-password'
          result:
            string: enforcing = 1
        fix:
          shell: sudo sed -i '/^enforcing/d' /etc/security/pwquality.conf && sudo
            sh -c 'echo "enforcing = 1" >> /etc/security/pwquality.conf' && sudo sed
            -i '/^password requisite pam_pwquality.so/d' /etc/pam.d/common-password
            && sudo sh -c 'echo "password requisite pam_pwquality.so retry=3" >> /etc/pam.d/common-password'
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -q -i '^enforcing\s*=\s*1' /etc/security/pwquality.conf && grep
            -q 'requisite.*pam_pwquality' /etc/pam.d/common-password && grep -q 'retry\s*=\s*[1-3]'
            /etc/pam.d/common-password
          result:
            integer: 0
        fix:
          shell: 'echo "enforcing = 1" >> /etc/security/pwquality.conf

            echo "password requisite pam_pwquality.so retry=3" >> /etc/pam.d/common-password'
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
