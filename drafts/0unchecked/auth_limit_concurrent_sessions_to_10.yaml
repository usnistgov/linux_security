id: auth_limit_concurrent_sessions_to_10
title: Ubuntu 24.04 LTS must limit the number of concurrent sessions to 10 for all
  accounts and/or account types.
discussion: "Ubuntu 24.04 LTS allows limiting the number of users and concurrent sessions\
  \ per user to help reduce denial\u2011of\u2011service risks. The maximum concurrent\
  \ sessions per account should be defined based on mission needs and the operational\
  \ environment."
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-10
  disa:
    cci:
    - CCI-000054
    srg:
    - SRG-OS-000027-GPOS-00008
    disa_stig:
      ubuntu_24:
      - UBTU-24-200000
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
      enforcement_info:
        check:
          shell: awk '/^[[:space:]]*[^#]*maxlogins/ {val=$NF; if(val+0 <= 10) {found=1;
            exit}} END {exit (found?0:1)}' /etc/security/limits.conf /etc/security/limits.d/*.conf
          result:
            integer: 0
        fix:
          shell: echo '* hard maxlogins 10' >> /etc/security/limits.conf
tags:
- 800-53r5_high
