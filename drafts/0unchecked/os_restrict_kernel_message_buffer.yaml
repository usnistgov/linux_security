id: os_restrict_kernel_message_buffer
title: Ubuntu 22.04 LTS must restrict access to the kernel message buffer.
discussion: "Restricting kernel message buffer access to root prevents non\u2011privileged\
  \ users from obtaining sensitive system information."
references:
  nist:
    800-53r5:
    - SC-04
  disa:
    cci:
    - CCI-001090
    srg:
    - SRG-OS-000138-GPOS-00069
    disa_stig:
      ubuntu_2204:
      - UBTU-22-213010
      ubuntu_2404:
      - UBTU-24-600140
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: sysctl kernel.dmesg_restrict | grep -q '= 1$'
      expected_output: 0
    fix:
      shell: sudo sysctl --system
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: low
  enforcement_info:
    check:
      shell: value=$(sysctl -n kernel.dmesg_restrict 2>/dev/null); [ "$value" = "1"
        ] || exit 1; grep -r '^\s*kernel\.dmesg_restrict\s*=' /run/sysctl.d/* /etc/sysctl.d/*
        /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/* /etc/sysctl.conf
        2>/dev/null | grep -v '= 1' | grep -q '.' && exit 1 || exit 0
      expected_output: 0
    fix:
      shell: sudo sysctl --system
tags:
- 800-53r5_moderate
- 800-53r5_high
