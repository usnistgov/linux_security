id: os_library_files_group_root
title: Ubuntu 22.04 LTS library files must be group-owned by "root".
discussion: "Allowing any user to modify software libraries could bypass required\
  \ testing and approval, so only qualified, authorized personnel should be permitted\
  \ to access and change these components, including privileged programs and interpreted\u2011\
  language libraries."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_22:
      - UBTU-22-232075
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' !
            -group root -exec stat -c "%n %G" {} + | grep -q . && exit 1 || exit 0
          result:
            integer: 0
        fix:
          shell: sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' !
            -group root -exec chown :root {} +
tags:
- testing
