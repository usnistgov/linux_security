id: os_session_lock_after_10min_inactivity
title: Ubuntu 22.04 LTS must initiate a graphical session lock after 10 minutes of
  inactivity.
discussion: A session lock temporarily secures an Ubuntu 22.04 LTS session when the
  user steps away, requiring reauthentication to unlock and allowing no other activity
  to bypass it.
references:
  nist:
    800-53r5:
    - AC-11
  disa:
    cci:
    - CCI-000057
    srg:
    - SRG-OS-000029-GPOS-00010
    disa_stig:
      ubuntu_2204:
      - UBTU-22-271025
      ubuntu_2404:
      - UBTU-24-200020
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: gsettings get org.gnome.desktop.screensaver lock-enabled | grep -q '^true$'
        && gsettings get org.gnome.desktop.screensaver lock-delay | grep -q '^uint32
        0$' && gsettings get org.gnome.desktop.session idle-delay | grep -q '^uint32
        600$'
      expected_output: 0
    fix:
      shell: 'sudo tee /etc/dconf/db/local.d/00-screensaver > /dev/null <<''EOF''

        [org/gnome/desktop/screensaver]

        lock-enabled=true

        lock-delay=0


        [org/gnome/desktop/session]

        idle-delay=600

        EOF'
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    check:
      shell: if [ "$(gsettings get org.gnome.desktop.screensaver lock-enabled)" =
        "true" ] && [ "$(gsettings get org.gnome.desktop.screensaver lock-delay)"
        = "uint32 0" ] && [ "$(gsettings get org.gnome.desktop.session idle-delay)"
        = "uint32 600" ]; then exit 0; else exit 1; fi
      expected_output: 0
    fix:
      shell: sudo dconf update
tags:
- 800-53r5_moderate
- 800-53r5_high
