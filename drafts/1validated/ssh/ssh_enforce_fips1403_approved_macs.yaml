id: ssh_enforce_fips1403_approved_macs
title: Ubuntu must configure the SSH daemon to use Message Authentication
  Codes (MACs) employing FIPS 140-3-approved cryptographic hashes to prevent the unauthorized
  disclosure of information and/or detect changes to information during transmission.
discussion: Without cryptographic integrity protections, information can be altered
  by unauthorized users without detection, particularly during remote access, nonlocal
  or local maintenance, and transmission. Encrypting data and using cryptographic
  mechanisms such as hash functions (for digital signatures, checksums, and MACs)
  safeguards against unauthorized disclosure and modification.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-17(02)
    - MA-04(06)
    - SC-08(01)
  disa:
    cci:
    - CCI-002890
    - CCI-001453
    - CCI-002421
    srg:
    - SRG-OS-000250-GPOS-00093
    disa_stig:
      ubuntu_22:
      - UBTU-22-255055
      ubuntu_24:
      - UBTU-24-100830
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: sshd -T 2> /dev/null | grep "macs" | awk '{print $2}'
        result:
          string: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
      fix:
        shell: echo "MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256" >> /etc/ssh/sshd_config && systemctl restart ssh
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
