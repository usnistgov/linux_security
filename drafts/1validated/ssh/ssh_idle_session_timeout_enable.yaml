id: ssh_idle_session_timeout_enable
title: Ubuntu must be configured so that all network connections associated
  with SSH traffic terminate after becoming unresponsive.
discussion: Terminating unresponsive SSH sessions quickly limits the window for attackers
  to hijack an unattended console session and frees up system resources. It ends only
  the idle session, releasing its TCP/IP and application resources without affecting
  other connections.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-10
  disa:
    cci:
    - CCI-001133
    srg:
    - SRG-OS-000126-GPOS-00066
    - SRG-OS-000163-GPOS-00072
    disa_stig:
      ubuntu_22:
      - UBTU-22-255030
      ubuntu_24:
      - UBTU-24-600000
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: sshd -T 2> /dev/null | grep "clientalivecountmax" | awk '{print $2}'
        result:
          integer: 1
      fix:
        shell: echo "ClientAliveCountMax 1" >> /etc/ssh/sshd_config && systemctl restart ssh
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
