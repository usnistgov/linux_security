id: ssh_smartcard_mfa_enforcement_policy
title: Ubuntu must implement smart card logins for multifactor authentication
  for local and network access to privileged and nonprivileged accounts over SSH.
discussion: Without multifactor authentication, privileged accounts are far easier
  to compromise; MFA requires two or more factors-something you know, have,
  or are-and is exemplified by the DOD CAC with PKI.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-02(02)
    - IA-02(01)
  disa:
    cci:
    - CCI-000766
    - CCI-000765
    srg:
    - SRG-OS-000105-GPOS-00052
    disa_stig:
      ubuntu_24:
      - UBTU-24-400030
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: sshd -T 2> /dev/null | grep "pubkeyauthentication" | awk '{print $2}'
        result:
          string: "yes"
      fix:
        shell: echo "PubkeyAuthentication yes" >> /etc/ssh/sshd_config && systemctl restart ssh
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
