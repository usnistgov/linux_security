id: ssh_prevent_remote_proxy_display
title: Ubuntu SSH daemon must prevent remote hosts from connecting to the
  proxy display.
discussion: Enabling X11 forwarding can expose displays if sshd listens on the wildcard
  address; by default it binds to the loopback address and sets DISPLAY to localhost,
  preventing remote connections.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-255045
      ubuntu_24:
      - UBTU-24-300023
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: sshd -T 2> /dev/null | grep "x11uselocalhost" | awk '{print $2}'
        result:
          string: "yes"
      fix:
        shell: echo "X11UseLocalHost yes" >> /etc/ssh/sshd_config && systemctl restart ssh
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
