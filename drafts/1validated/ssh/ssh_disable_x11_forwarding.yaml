id: ssh_disable_x11_forwarding
title: Ubuntu must be configured so that remote X connections are disabled,
  unless to fulfill documented and validated mission requirements.
discussion: X11 forwarding can expose the client's display to attack, allowing unauthorized
  access and possible keystroke monitoring if trusted forwarding is enabled, so it
  should be used cautiously or disabled when not required.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-255040
      ubuntu_24:
      - UBTU-24-300022
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: sshd -T | grep -q "x11forwarding no"
        result:
          exit_code: 0
      fix:
        shell: echo "X11Forwarding no" >> /etc/ssh/sshd_config && systemctl restart ssh
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
