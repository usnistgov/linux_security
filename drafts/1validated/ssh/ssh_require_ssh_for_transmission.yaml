id: ssh_require_ssh_for_transmission
title: Ubuntu must use SSH to protect the confidentiality and integrity
  of transmitted information.
discussion: Without protection, transmitted information can be intercepted and altered,
  compromising confidentiality and integrity. This applies to all internal and external
  network communications and can be safeguarded via physical or cryptographic means.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-08(02)
    - SC-08
  disa:
    cci:
    - CCI-002418
    - CCI-002422
    - CCI-002420
    srg:
    - SRG-OS-000423-GPOS-00187
    disa_stig:
      ubuntu_22:
      - UBTU-22-255015
      ubuntu_24:
      - UBTU-24-100810
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: systemctl is-enabled ssh && systemctl is-active ssh
        result:
          exit_code: 0
      fix:
        shell: systemctl enable --now ssh
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_moderate
- 800-53r5_high
