id: ssh_use_issue_net
title: SSH Must Use The /etc/issue.net File For The Banner
discussion: |
  The system must display a Standard Mandatory Notice and Consent Banner before granting access to via an SSH logon.

  A standardized, approved use notification must be displayed before granting access to a publicly accessible operating system to ensure privacy and security, consistent with federal laws and DOD policy, and is required only for human logon interfaces. The banner uses either the full 1300-character text or the abbreviated version for systems with severe character limits.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-8
  disa:
    cci:
    - CCI-001388
    - CCI-001384
    - CCI-000048
    - CCI-001387
    - CCI-001385
    - CCI-001386
    srg:
    - SRG-OS-000023-GPOS-00006
    disa_stig:
      ubuntu_22:
      - UBTU-22-255020
      ubuntu_24:
      - UBTU-24-200640
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: sshd -T | grep -q "^banner /etc/issue.net"
        result:
          exit_code: 0
      fix:
        shell: sed -i "s/Banner.*//g" /etc/ssh/sshd_config && echo "Banner /etc/issue.net" >> /etc/ssh/sshd_config && systemctl reset-failed ssh && systemctl restart ssh
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
