id: ssh_disable_unattended_login
title: Ubuntu must not allow unattended or automatic login via SSH.
discussion: Not restricting system access to authenticated users weakens Ubuntu 22.04
  LTS security.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00229
    disa_stig:
      ubuntu_22:
      - UBTU-22-255025
      ubuntu_24:
      - UBTU-24-300031
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: sshd -T 2> /dev/null | grep -e "permitemptypasswords no" -e "permituserenvironment no" | wc -l
        result:
          integer: 2
      fix:
        shell: echo -e "PermitEmptyPasswords no\nPermitUserEnvironment no" >> /etc/ssh/sshd_config && systemctl restart ssh
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
