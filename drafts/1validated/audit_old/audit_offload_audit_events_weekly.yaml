id: audit_offload_audit_events_weekly
title: Audit Offload Audit Events Weekly
discussion: |
  The system must have a crontab script running weekly to offload audit events of standalone systems.

  Storing information in a single location makes it susceptible to accidental or incidental deletion or alteration, especially when offloading is used to manage limited audit storage capacity.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-4(1)
  disa:
    cci:
    - CCI-001851
    srg:
    - SRG-OS-000479-GPOS-00224
    disa_stig:
      ubuntu_22:
      - UBTU-22-651035
      ubuntu_24:
      - UBTU-24-900950
platforms:
  ubuntu:
    enforcement_info:
      check:
        additional_info: IF a script file does not exist and run with cron at least weekly to offload audit logs, this is a finding.
      fix:
        additional_info: Ensure that a script is located in the /etc/cron.weekly directory to offload audit logs.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
tags:
- testing
- manual
