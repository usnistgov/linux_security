id: audit_log_file_access_control
title: Audit Log File Access Control
discussion: |
  The system must be configured so that audit log files are not read or write-accessible by unauthorized users.

  Unauthorized disclosure of audit records can expose system and configuration data, compromising confidentiality. Audit information-including records, settings, and reports-is essential for auditing operating system activity.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-9
  disa:
    cci:
    - CCI-000163
    - CCI-000162
    srg:
    - SRG-OS-000057-GPOS-00027
    disa_stig:
      ubuntu_22:
      - UBTU-22-653045
      ubuntu_24:
      - UBTU-24-901300
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -L -c "%n %a" $(dirname $(grep "^log_file = " /etc/audit/auditd.conf | awk -F" = " '{print $2}'))/* | perl -ane 'chomp; $mode = (oct($F[1]) & 0777); print "$F[0]\n" if ($mode & ~0600) != 0'
        result:
          string: ""
      fix:
        shell: chmod 600 $(dirname $(grep "^log_file = " /etc/audit/auditd.conf | awk -F" = " \'{print $2}\'))/*
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
