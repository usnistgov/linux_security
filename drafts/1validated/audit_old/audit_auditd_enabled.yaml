id: audit_capture_event_details_real_time
title: Audit Events with Details
discussion: |
  The system must produce audit records and reports containing information to establish when, where, what type, the source, and the outcome for all defined auditable events and actions in near real time.

  Without detailed audit records-including timestamps, source/destination addresses, user/process IDs, event descriptions, success/failure indicators, filenames, and
  invoked rules-it is difficult to establish, correlate, and investigate events leading to outages or attacks, hindering forensic analysis and incident response. Associating event types with the system's audit logs enables attack investigation, resource-usage monitoring, and detection of misconfigurations.
