id: audit_prevent_unauthorized_rule_changes
title: Ubuntu audit system must protect auditing rules from unauthorized
  change.
discussion: Unauthorized disclosure of audit records can expose system and configuration
  data, compromising confidentiality. In immutable mode, users cannot alter audit
  settings to hide malicious activity, and any reboot would be noticeable for investigation.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-000163
    srg:
    - SRG-OS-000058-GPOS-00028
    disa_stig:
      ubuntu_24:
      - UBTU-24-909000
platforms:
  ubuntu:
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        check:
          shell: grep -q "^-e 2" /etc/audit/audit.rules
          result:
            exit_code: 0
        fix:
          shell: echo "-e 2" >> /etc/audit/rules.d/stig.rules && augenrules --load
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
