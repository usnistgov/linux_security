id: audit_tools_group_owner_root
title: Ubuntu must configure the audit tools to be group owned by root.
discussion: >
  Protecting audit information requires securing the tools used to view
  and manipulate logs, ensuring only authorized users can access them via permissions
  and roles. Audit tools include vendor-provided, open-source, custom
  queries, and report generators.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-001494
    - CCI-001493
    srg:
    - SRG-OS-000257-GPOS-00098
    disa_stig:
      ubuntu_24:
      - UBTU-24-901250
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: ls -l /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/audispd* /sbin/augenrules | awk '{print $4}' | grep -qv "root"
        result:
          exit_code: 1
      fix:
        shell: chown :root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/audispd* /sbin/augenrules
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
