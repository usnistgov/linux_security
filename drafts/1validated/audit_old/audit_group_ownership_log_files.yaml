id: audit_group_ownership_log_files
title: Audit Group Ownership of Log Files
discussion: |
  The system must permit only authorized groups ownership of the audit log files.

  Unauthorized disclosure of audit records can expose system and configuration data to attackers, compromising confidentiality. Audit information-including records, settings, and reports-is required to audit operating system activity.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-9
  disa:
    cci:
    - CCI-000163
    - CCI-000162
    - CCI-000164
    srg:
    - SRG-OS-000057-GPOS-00027
    disa_stig:
      ubuntu_22:
      - UBTU-22-653055
      ubuntu_24:
      - UBTU-24-901350
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "^log_group" /etc/audit/auditd.conf | grep -q "root"
        result:
          exit_code: 0
      fix:
        shell: sed -i "s/^log_group.*//g" /etc/audit/auditd.conf && echo "log_group = root" >> /etc/audit/auditd.conf && systemctl restart auditd
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
