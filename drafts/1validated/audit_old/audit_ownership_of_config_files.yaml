id: audit_ownership_of_config_files
title: Ubuntu must permit only authorized accounts to own the audit configuration
  files.
discussion: Without restricting who can select audited events, unauthorized users
  could block critical event logging, and misconfigured audits could overload logs
  and hinder incident investigation.
references:
  nist:
    800-53r5:
    - AU-12 b
  disa:
    cci:
    - CCI-000171
    srg:
    - SRG-OS-000063-GPOS-00032
    disa_stig:
      ubuntu_2204:
      - UBTU-22-653070
      ubuntu_2404:
      - UBTU-24-900050
enforcement_info:
  enforcement_type: full
  check:
    shell: ls -l /etc/audit/audit.rules /etc/audit/auditd.conf /etc/audit/rules.d/* | awk '{print $3}' | grep -q -v "root"
    status_code: 1
  fix:
    shell: chown -R root /etc/audit/audit.rules /etc/audit/auditd.conf /etc/audit/rules.d/*
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
tags:
- testing
