id: audit_allocate_one_week_storage
title: Ubuntu must allocate audit record storage capacity to store at least
  one week's worth of audit records, when audit records are not immediately sent to
  a central audit record storage facility.
discussion: Operating systems must allocate sufficient storage for audit logs, a task
  typically performed during the initial installation of Ubuntu 24.04 LTS.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-04
  disa:
    cci:
    - CCI-001849
    srg:
    - SRG-OS-000341-GPOS-00132
    disa_stig:
      ubuntu_22:
      - UBTU-22-653035
      ubuntu_24:
      - UBTU-24-900920
platforms:
  ubuntu:
    enforcement_info:
      check:
        additional_info: If the audit log file cannot capture a week's worth of audit records based on the activity level of the system, this is a finding.
      fix:
        additional_info: Increase the partition size where the log file is located to successfully capture a week's worth of activity without issue.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
- manual
