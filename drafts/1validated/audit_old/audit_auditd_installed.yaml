id: audit_auditd_installed
title: Auditd Package Must Be Installed
discussion: |
  The system must have the "auditd" package installed.
  
  Audit records must include sufficient detail, such as timestamps, source/destination addresses, user/process IDs, event descriptions, success/failure indicators, filenames, and applied rules to enable correlation, investigation, and forensic analysis of incidents. Without this information, establishing the cause of outages or attacks and responding effectively is impaired.
