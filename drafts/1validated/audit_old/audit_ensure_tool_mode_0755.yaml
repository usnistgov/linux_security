id: audit_ensure_tool_mode_0755
title: Ensure Audit Tools Have Correct Permissions
discussion: |
  The system must configure audit tools with a mode of "0755" or less permissive.

  Protecting audit information requires securing the tools used to view and manipulate logs, ensuring only authorized users can access them via permissions
  and roles. Audit tools include vendor-provided, open-source, custom queries, and report generators.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-9
  disa:
    cci:
    - CCI-001494
    - CCI-001493
    srg:
    - SRG-OS-000257-GPOS-00098
    disa_stig:
      ubuntu_22:
      - UBTU-22-232035
      ubuntu_24:
      - UBTU-24-901230
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -L -c "%n %a" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/audispd* /sbin/augenrules 2> /dev/null | perl -ane 'chomp; $mode = (oct($F[1]) & 0777); print "$F[0]\n" if ($mode & ~0755) != 0'
        result:
          string: ""
      fix:
        shell: chmod 755 /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/audispd* /sbin/augenrules
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
