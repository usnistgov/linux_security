id: audit_ensure_tool_mode_0755
title: Ubuntu must configure audit tools with a mode of "0755" or less permissive.
discussion: >
  Protecting audit information requires securing the tools used to view
  and manipulate logs, ensuring only authorized users can access them via permissions
  and roles. Audit tools include vendor-provided, open-source, custom
  queries, and report generators.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-001494
    - CCI-001493
    srg:
    - SRG-OS-000257-GPOS-00098
    disa_stig:
      ubuntu_22:
      - UBTU-22-232035
      ubuntu_24:
      - UBTU-24-901230
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%a' /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/audispd* /sbin/augenrules | gawk '{mode=strtonum("0"$1); if (and(mode, compl(0755)) != 0) print $1 }' | wc -l
        result:
          integer: 0
      fix:
        shell: chmod 755 /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/audispd* /sbin/augenrules
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
