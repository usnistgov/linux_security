id: audit_authorized_user_ownership_logs
title: Authorized User Ownership of Audit Logs
discussion: |
  The system must be configured to permit only authorized users ownership of the audit log files.

  Unauthorized disclosure of audit records can expose system and configuration data to attackers, compromising confidentiality. Audit information, including records, settings, and reports, is required to audit operating system activity.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-9
  disa:
    cci:
    - CCI-000163
    - CCI-000162
    - CCI-000164
    srg:
    - SRG-OS-000057-GPOS-00027
    disa_stig:
      ubuntu_22:
      - UBTU-22-653050
      ubuntu_24:
      - UBTU-24-901310
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c "%U" $(grep "^log_file" /etc/audit/auditd.conf | awk -F" = " '{print $2}')* | grep -q -v "^root$"
        result:
          exit_code: 1
      fix:
        shell: chown root $(grep "^log_file" /etc/audit/auditd.conf | awk -F" = " '{print $2}')*
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
