id: audit_audit_tools_owned_by_root
title: Configure Audit Tools to be Owned by Root
discussion: |
  The system must configure audit tools to be owned by root.

  Protecting audit information requires securing the tools used to view and manipulate logs, ensuring only authorized users with appropriate permissions can access them.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-9
  disa:
    cci:
    - CCI-001494
    - CCI-001493
    srg:
    - SRG-OS-000256-GPOS-00097
    disa_stig:
      ubuntu_22:
      - UBTU-22-232110
      ubuntu_24:
      - UBTU-24-901240
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c "%U" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/audisp* /sbin/augenrules | grep -q -v "^root$"
        result:
          exit_code: 1
      fix:
        shell: chown root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/audisp* /sbin/augenrules
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
