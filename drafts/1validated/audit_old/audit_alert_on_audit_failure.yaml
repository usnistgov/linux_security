id: audit_alert_on_audit_failure
title: Alert Audit Processing Failure
discussion: |
  The system must alert the information system security officer (ISSO) and system administrator (SA) in the event of an audit processing failure.

  Personnel must be notified when audit processing may fail due to software/hardware errors, capture mechanism failures, or storage capacity limits, to prevent unawareness of impending audit capability loss. This requirement applies to each audit data storage repository, the organization's centralized audit storage, or both.
