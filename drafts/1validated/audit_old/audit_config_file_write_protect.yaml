id: audit_config_file_write_protect
title: Audit Configuration Files Must Not Be Write-Accessible by Unauthorized Users
discussion: |
  The system must be configured so that audit configuration files are not write-accessible by unauthorized users.
  
  Without restricting who can select audited events, unauthorized users could block critical event logging, and misconfigured audits could overload logs and hinder incident investigation.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000171
    srg:
    - SRG-OS-000063-GPOS-00032
    disa_stig:
      ubuntu_22:
      - UBTU-22-653065
      ubuntu_24:
      - UBTU-24-900040
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -L -c "%n %a" /etc/audit/audit.rules /etc/audit/auditd.conf /etc/audit/rules.d/* | perl -ane 'chomp; $mode = (oct($F[1]) & 0777); print "$F[0]\n" if ($mode & ~0640) != 0'
        result:
          string: ""
      fix:
        shell: chmod -R 640 /etc/audit/audit.rules /etc/audit/auditd.conf /etc/audit/rules.d/*
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
