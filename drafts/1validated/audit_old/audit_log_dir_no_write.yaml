id: audit_log_dir_no_write
title: Ubuntu must be configured so that the audit log directory is not
  write-accessible by unauthorized users.
discussion: If audit information is compromised, forensic analysis cannot determine
  the true source of malicious system activity. Therefore, the operating system must
  protect audit records, settings, and reports from unauthorized deletion.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-000164
    srg:
    - SRG-OS-000059-GPOS-00029
    disa_stig:
      ubuntu_22:
      - UBTU-22-653060
      ubuntu_24:
      - UBTU-24-901380
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%a' $(dirname $(grep "^log_file = " /etc/audit/auditd.conf | awk -F" = " '{print $2}')) | gawk '{mode=strtonum("0"$1); if (and(mode, compl(0755)) != 0) print $1 }' | wc -l
        result:
          integer: 0
      fix: 
        shell: chmod 750 $(dirname $(grep "^log_file = " /etc/audit/auditd.conf | awk -F" = " '{print $2}'))
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
