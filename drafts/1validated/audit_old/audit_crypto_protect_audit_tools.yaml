id: audit_crypto_protect_audit_tools
title: Audit Tools Must Be Cryptographically Protected
discussion: |
  The system must use cryptographic mechanisms to protect the integrity of audit tools.

  Protecting audit tool integrity is essential to ensure audit information remains trustworthy, as attackers may replace or tamper with tools to hide or erase system activity. Therefore, audit tools must be cryptographically signed (e.g., via checksum hashes) to detect any modifications, manipulation, or replacement.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-9(3)
  disa:
    cci:
    - CCI-001496
    srg:
    - SRG-OS-000278-GPOS-00108
    disa_stig:
      ubuntu_22:
      - UBTU-22-651030
      ubuntu_24:
      - UBTU-24-909890
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -E "(\/sbin\/(audit|au))" /etc/aide/aide.conf | grep "p+i+n+u+g+s+b+acl+xattrs+sha512" | wc -l
        result:
          integer: 6
      fix:
        shell: printf "%s\\n" "# Audit Tools" "/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512" "/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512" "/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512" "/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512" "/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512" "/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512" >> /etc/aide/aide.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_high
