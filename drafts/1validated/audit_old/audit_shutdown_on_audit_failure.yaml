id: audit_shutdown_on_audit_failure
title: Ubuntu must shut down by default upon audit failure.
discussion: If the OS risks failing to process audit logs, it must mitigate failures
  by overwriting the oldest records when storage is full and queuing records locally
  when a central server is unreachable, then synchronizing once the connection is
  restored.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - AU-05
  disa:
    cci:
    - CCI-000140
    srg:
    - SRG-OS-000047-GPOS-00023
    disa_stig:
      ubuntu_22:
      - UBTU-22-653030
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -Eq "^disk_full_action.*(HALT|SYSLOG|SINGLE)" /etc/audit/auditd.conf
        result:
          exit_code: 0
      fix:
        shell: sed -i "s/^disk_full_action.*//g" /etc/audit/auditd.conf && echo "disk_full_action = HALT" >> /etc/audit/auditd.conf && systemctl restart auditd
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
