id: os_var_log_directory_permissions
title: Ubuntu must configure the /var/log directory to have mode "0755"
  or less permissive.
discussion: Only authorized personnel should receive error details, as messages can
  reveal the operating system, PII, or operational state. Error message content must
  be carefully designed per organizational policy to prevent unauthorized disclosure.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232025
      ubuntu_24:
      - UBTU-24-700120
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -L -c "%n %a" /var/log | stat -L -c "%n %a" /bin /bin/* /sbin /sbin/* /usr/bin /usr/bin/* /usr/sbin /usr/sbin/* /usr/local/bin /usr/local/bin/* /usr/local/sbin /usr/local/sbin/* 2> /dev/null | perl -ane 'chomp; $mode = (oct($F[1]) & 0777); print "$F[0]\n" if ($mode & ~0755) != 0'
        result:
          string: ""
      fix:
        shell: chmod 755 /var/log
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
