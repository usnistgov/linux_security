id: os_journal_no_sensitive_info
title: Ubuntu must generate system journal entries without revealing information
  that could be exploited by adversaries.
discussion: >
  Operating systems that disclose excessive information in error messages
  risk exposing sensitive data, so organizations must carefully control error message
  content. This includes avoiding the release of credentials, personal information,
  or mission-critical details that adversaries could exploit.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001312
    srg:
    - SRG-OS-000205-GPOS-00083
    disa_stig:
      ubuntu_22:
      - UBTU-22-232027
      ubuntu_24:
      - UBTU-24-700020
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -L -c "%n %a" /run/log/journal /run/log/journal/**/* /var/log/journal /var/log/journal/**/* 2> /dev/null | perl -ane 'chomp; $mode = (oct($F[1]) & 0777); print "$F[0] $F[1]\n" if ($mode & ~0640) != 0' | grep -v "2755"
        result:
          string: ""
      fix:
        shell: printf "%s\\n" "z /run/log/journal 2750 root systemd-journal - -" "Z /run/log/journal/%m ~2750 root systemd-journal - -" "z /var/log/journal 2750 root systemd-journal - -" "z /var/log/journal/%m 2750 root systemd-journal - -" "z /var/log/journal/%m/system.journal 0640 root systemd-journal - -" >> /etc/tmpfiles.d/zzz-systemd-stig.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
- reboot_required
