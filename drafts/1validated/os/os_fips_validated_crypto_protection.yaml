id: os_fips_validated_crypto_protection
title: NIST FIPS-validated cryptography must be in use.
discussion: Using weak or untested encryption algorithms undermines data protection;
  the operating system must employ government-approved cryptographic modules
  that have been tested and validated.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-13
  disa:
    cci:
    - CCI-002450
    srg:
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000478-GPOS-00223
    disa_stig:
      ubuntu_22:
      - UBTU-22-671010
      ubuntu_24:
      - UBTU-24-600030
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: cat /proc/sys/crypto/fips_enabled
        result:
          integer: 1
      fix:
        additional_info: Enable FIPS-updates through Ubuntu Pro, and reboot the system.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
