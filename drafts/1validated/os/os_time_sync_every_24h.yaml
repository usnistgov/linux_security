id: os_time_sync_every_24h
title: Ubuntu must compare internal information system clocks at least every
  24 hours with an authoritative time server.
discussion: Accurate time stamps are essential for correlating events and conducting
  forensic analysis; unsynchronized clocks can drift and produce inaccurate timestamps.
  Synchronizing internal system clocks ensures uniformity across networked systems,
  particularly for endpoints that lack regular access to an authoritative time server.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-45
    - SC-45(01)
  disa:
    cci:
    - CCI-004923
    - CCI-004922
    - CCI-001891
    srg:
    - SRG-OS-000355-GPOS-00143
    - SRG-OS-000785-GPOS-00250
    disa_stig:
      ubuntu_22:
      - UBTU-22-252010
      ubuntu_24:
      - UBTU-24-600160
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -rh "maxpoll" /etc/chrony* | awk '{if ($4 <= 16) print "passed" }' | uniq
        result:
          string: passed
        additional_info: Ensure the configured time server is set to a valid server.
      fix:
        additional_info: Add "maxpoll 16" to all time servers.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
tags:
- testing
