id: os_system_commands_root_owned
title: Ubuntu must have system commands owned by root or a system account.
discussion: >
  Allowing any user to modify software libraries in Ubuntu 24.04 LTS could
  lead to untested changes that bypass proper change-management testing and
  approvals. Only qualified, authorized individuals should be permitted to access
  and modify these components, including privileged programs and interpreted-
  language libraries.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_22:
      - UBTU-22-232050
      ubuntu_24:
      - UBTU-24-300012
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%U' /bin/* /sbin/* /usr/bin/* /usr/sbin/* /usr/local/bin/* /usr/local/sbin/* 2> /dev/null | sort | uniq
        result:
          string: root
      fix:
        shell: stat -c \'%n %U\' /bin/* /sbin/* /usr/bin/* /usr/sbin/* /usr/local/bin/* /usr/local/sbin/* 2> /dev/null | awk \'{ if ($2 != "root") print $1 }\' | xargs chown root
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- testing
