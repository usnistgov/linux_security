id: os_use_apparmor
title: Ubuntu must be configured to use AppArmor.
discussion: Control of program execution prevents unauthorized programs from running,
  particularly when default OS functions exceed mission requirements or cannot be
  removed. Compliance is achieved by restricting execution based on environments,
  privileges, subnets, sandboxing, or roles.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-07(02)
    - CM-07(05)
    - AC-06(10)
  disa:
    cci:
    - CCI-002235
    - CCI-001764
    - CCI-001774
    srg:
    - SRG-OS-000368-GPOS-00154
    disa_stig:
      ubuntu_22:
      - UBTU-22-431015
      ubuntu_24:
      - UBTU-24-100510
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: apparmor_status | grep "profiles are in enforce mode." | awk '{ if ($1 > 0) print "passed" }'
        result:
          string: passed
      fix:
        shell: systemctl enable apparmor.service --now
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
