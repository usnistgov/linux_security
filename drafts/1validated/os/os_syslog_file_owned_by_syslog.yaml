id: os_syslog_file_owned_by_syslog
title: Ubuntu must configure "/var/log/syslog" file to be owned by "syslog".
discussion: Only authorized personnel should see error details, as messages can reveal
  an organization's operational state, OS/platform, PII, or other sensitive information.
  Error message content must be designed according to organizational policy to limit
  disclosure and ensure proper handling.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232130
      ubuntu_24:
      - UBTU-24-700140
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%U' /var/log/syslog
        result:
          string: syslog
      fix:
        shell: chwon syslog /var/log/syslog
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
