id: os_vendor_supported_release_check
title: Ubuntu must be a vendor-supported release.
discussion: >
  An OS release is considered supported only while the vendor provides
  security patches; unsupported releases cannot receive fixes for discovered vulnerabilities.
  For Ubuntu 22.04, standard support ends April 2027, and Extended Security
  Maintenance (available via an Ubuntu Pro subscription) extends support to April
  2032."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-211000
      ubuntu_24:
      - UBTU-24-700400
platforms:
  ubuntu:
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
