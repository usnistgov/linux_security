id: os_syslog_file_mode_640
title: Ubuntu must configure "/var/log/syslog" file with mode "640" or less
  permissive.
discussion: Only authorized personnel should see error details, as messages can reveal
  an organization's operational state, OS/platform, PII, or other sensitive information.
  Error message content must be carefully designed according to organizational policy
  to prevent unauthorized disclosure.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232030
      ubuntu_24:
      - UBTU-24-700150
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%a' /var/log/syslog | gawk '{mode=strtonum("0"$1); if (and(mode, compl(0640)) == 0) print "passed" }'
        result:
          string: passed
      fix:
        shell: chmod 640 /var/log/syslog
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
