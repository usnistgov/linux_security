id: os_require_auth_for_single_user
title: Ubuntu, when booted, must require authentication upon booting into
  single-user and maintenance modes.
discussion: >
  DOD systems must be configured so that possessing a DOD-approved
  PKI certificate alone does not grant access; after authentication, entities must
  be authorized through identity-, role-, or attribute-based access
  controls enforced by mechanisms such as access control lists, matrices, or cryptography.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-03
  disa:
    cci:
    - CCI-000213
    srg:
    - SRG-OS-000080-GPOS-00048
    disa_stig:
      ubuntu_22:
      - UBTU-22-212010
      ubuntu_24:
      - UBTU-24-102000
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -q "password" /boot/grub/grub.cfg
        result:
          exit_code: 0
      fix:
        additional_info: Use "grub-mkpasswd" to generate an encrypted password for root while in single-user mode.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
