id: os_syslog_file_group_adm
title: Ubuntu must configure the /var/log/syslog file to be group-owned
  by adm.
discussion: Only authorized personnel should receive error details, as messages can
  reveal the operating system, platform, or PII. Error message content must be carefully
  designed per organizational policy to avoid exposing sensitive or operational information.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232135
      ubuntu_24:
      - UBTU-24-700130
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%G' /var/log/syslog
        result:
          string: adm
      fix:
        shell: chown :adm /var/log/syslog
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium

tags:
- 800-53r5_moderate
- 800-53r5_high
