id: os_library_dirs_owned_root
title: Ubuntu library directories must be owned by "root".
discussion: >
  Allowing any user to modify software libraries could bypass required
  testing and approval, weakening change-management controls. Only qualified,
  authorized individuals should be permitted to access and alter these components,
  including privileged programs."
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-05(06)
  disa:
    cci:
    - CCI-001499
    srg:
    - SRG-OS-000259-GPOS-00100
    disa_stig:
      ubuntu_22:
      - UBTU-22-232060
      - UBTU-22-232070
      ubuntu_24:
      - UBTU-24-300008
      - UBTU-24-300007
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%U' /lib /lib/**/*.so /usr/lib /usr/lib/**/*.so /lib64 /lib64/**/*.so 2> /dev/null | sort | uniq
        result:
          string: root
      fix:
        shell: stat -c "%n %U" /lib /lib/**/*.so /usr/lib /usr/lib/**/*.so /lib64 /lib64/**/*.so 2> /dev/null | awk \'{ if ($2 != "root") print $1 }\' | xargs chown root
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- testing
