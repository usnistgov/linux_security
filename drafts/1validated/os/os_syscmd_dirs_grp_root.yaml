id: os_syscmd_dirs_grp_root
title: Ubuntu must have directories that contain system commands group-owned
  by "root".
discussion: >
  Protecting audit information requires securing the tools used to view
  and manipulate logs, as unauthorized access could compromise audit data. Operating
  systems enforce this by using user permissions and roles to control access to
  audit tools, which include vendor-provided, open-source, custom queries,
  and report generators.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-09
  disa:
    cci:
    - CCI-001495
    srg:
    - SRG-OS-000258-GPOS-00099
    disa_stig:
      ubuntu_22:
      - UBTU-22-232045
      - UBTU-22-232055
      ubuntu_24:
      - UBTU-24-901280
      - UBTU-24-300013
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%n %G' /bin /bin/* /sbin /sbin/* /usr/bin /usr/bin/* /usr/sbin /usr/sbin/* /usr/local/bin /usr/local/bin/* /usr/local/sbin /usr/local/sbin/* 2> /dev/null | awk '{ if ($2 != "root") print $1}' | wc -l
        result:
          integer: 0
      fix:
        shell: stat -c '%n %G' /bin /bin/* /sbin /sbin/* /usr/bin /usr/bin/* /usr/sbin /usr/sbin/* /usr/local/bin /usr/local/bin/* /usr/local/sbin /usr/local/sbin/* 2> /dev/null | awk '{ if ($2 != "root") print $1}' | xargs chown :root
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
