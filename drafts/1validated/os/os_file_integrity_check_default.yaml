id: os_file_integrity_check_default
title: Ubuntu must be configured so that the script which runs each 30 days
  or less to check file integrity is the default one.
discussion: >
  Without verification, security functions-hardware, software, or
  firmware that enforce policy, manage accounts, access, auditing, intrusion detection,
  and provide alerts-may fail unnoticed. This requirement applies to Ubuntu
   and any system needing security-function verification/testing.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-06
  disa:
    cci:
    - CCI-002699
    srg:
    - SRG-OS-000446-GPOS-00200
    disa_stig:
      ubuntu_22:
      - UBTU-22-651025
      ubuntu_24:
      - UBTU-24-100120
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: '[[ "$(</etc/cron.daily/aide md5sum)" == "$(</usr/share/aide/config/cron.daily/aide md5sum)" ]]'
        result:
          exit_code: 0
      fix:
        shell: cp /usr/share/aide/config/cron.daily/aide /etc/cron.daily/aide
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_high
