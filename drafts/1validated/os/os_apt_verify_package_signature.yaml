id: os_apt_verify_package_signature
title: Apt Must Verify Package Signatures
discussion: |
  The system must be configured so that the Advance Package Tool (APT) prevents the installation of patches, service packs, device drivers, or operating system components without verification they have been digitally signed using a certificate that is recognized and approved by the organization.

  Software components must be signed with an organization-approved certificate to confirm they are untampered and from a trusted vendor;self-signed certificates are not permitted.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-14
  disa:
    cci:
    - CCI-001749
    - CCI-003992
    srg:
    - SRG-OS-000366-GPOS-00153
    disa_stig:
      ubuntu_22:
      - UBTU-22-214010
      ubuntu_24:
      - UBTU-24-300001
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: apt-config dump | grep -q "APT::Get::AllowUnauthenticated \"false\";"
        result:
          exit_code: 0
      fix:
        shell: echo "APT::Get::AllowUnauthenticated \"false\";" >> /etc/apt/apt.conf.d/99stig-rules
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
tags:
- testing
