id: os_apparmor_package_installed
title: Ubuntu must have the "apparmor" package installed.
discussion: Control of program execution prevents unauthorized programs from running,
  especially when default OS functions exceed mission needs or are unnecessary. This
  is achieved by restricting execution based on environment, privileges, subnets,
  sandboxing, or roles.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-03(04)
    - CM-07(02)
    - CM-07(05)
  disa:
    cci:
    - CCI-002165
    - CCI-001764
    - CCI-001774
    srg:
    - SRG-OS-000312-GPOS-00124
    disa_stig:
      ubuntu_22:
      - UBTU-22-431010
      ubuntu_24:
      - UBTU-24-100500
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: dpkg -l apparmor
        result:
          exit_code: 0
      fix:
        shell: apt install -y apparmor
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
