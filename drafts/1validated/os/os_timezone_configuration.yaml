id: os_timezone_configuration
title: Ensure System Timezone Is Set Appropriately
discussion: |
  The system must record time stamps mapped in accordance to policy.

  Without consistent timestamps and a common time reference, forensic analysis becomes difficult, as operating-system timestamps include date and time typically expressed in UTC or local time with a UTC offset.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-8
  disa:
    cci:
    - CCI-001890
    srg:
    - SRG-OS-000359-GPOS-00146
    disa_stig:
      ubuntu_22:
      - UBTU-22-252020
      ubuntu_24:
      - UBTU-24-901220
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: timedatectl show --property=Timezone | awk -F"=" '{print $2}'
        result:
          string: $ODV
      fix:
        shell: timedatectl set-timezone $ODV
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low

odv:
  hint:
    datatype: string
    description: System timezone
  recommended: Etc/UTC
  disa_stig: Etc/UTC

tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
