id: os_var_log_directory_group_syslog
title: Ubuntu must configure the "/var/log" directory to be group-owned
  by "syslog".
discussion: Only authorized personnel should see error details, as messages can reveal
  operational state, OS/platform, PII, or other sensitive information. Error message
  design must align with organizational policy and operational requirements.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232125
      ubuntu_24:
      - UBTU-24-700100
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%G' /var/log
        result:
          string: syslog
      fix:
        shell: chown :syslog /var/log
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
