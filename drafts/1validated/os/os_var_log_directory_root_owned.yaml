id: os_var_log_directory_root_owned
title: Ubuntu must configure the "/var/log" directory to be owned by "root".
discussion: Only authorized personnel should see error details, as messages can reveal
  an organization's operational state, OS/platform, PII, or other sensitive information.
  Error message content must be carefully designed according to organizational policy
  to prevent unauthorized disclosure.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232120
      ubuntu_24:
      - UBTU-24-700110
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%U' /var/log
        result:
          string: root
      fix:
        shell: chown root /var/log
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
