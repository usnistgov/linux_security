id: os_disable_kernel_core_dumps
title: Ubuntu must disable kernel core dumps so that it can fail to a secure
  state if system initialization fails, shutdown fails or aborts fail.
discussion: Kernel core dumps can capture the entire system memory at crash, potentially
  consuming large amounts of disk space and causing denial of service by exhausting
  the file system.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-24
  disa:
    cci:
    - CCI-001190
    srg:
    - SRG-OS-000184-GPOS-00078
    disa_stig:
      ubuntu_22:
      - UBTU-22-213015
      ubuntu_24:
      - UBTU-24-600070
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: systemctl show kdump-tools.service | grep -q -e "NoSuchUnit" -e "UnitFileState=masked"
        result:
          exit_code: 0
      fix:
        shell: systemctl mask kdump-tools.service --now
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium

tags:
- 800-53r5_high
