id: os_remove_ntp_package_installed
title: Ubuntu must not have the "ntp" package installed.
discussion: Inaccurate timestamps hinder event correlation and forensic analysis,
  especially when sources drift beyond allowed limits. Organizations must account
  for endpoints lacking regular access to authoritative time servers.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-215025
      ubuntu_24:
      - UBTU-24-100020
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: dpkg -l ntp
        result:
          exit_code: 1
      fix:
        shell: apt purge -y ntp
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
