id: os_disable_ctrl_alt_delete
title: Ubuntu must disable the x86 Ctrl-Alt-Delete key sequence.
discussion: >
  Pressing Ctrl-Alt-Delete at the console can reboot the system,
  and an accidental press may cause unintended loss of availability.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-211015
      ubuntu_24:
      - UBTU-24-300026
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: systemctl show ctrl-alt-del.target | grep -q "UnitFileState=masked"
        result:
          exit_code: 0
      fix:
        shell: systemctl disable ctrl-alt-del.target && systemctl mask ctrl-alt-del.target && systemctl daemon-reload
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
