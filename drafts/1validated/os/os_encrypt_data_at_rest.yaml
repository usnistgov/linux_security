id: os_encrypt_data_at_rest
title: Ubuntu must implement cryptographic mechanisms to prevent unauthorized
  disclosure and modification of all information that requires protection at rest.
discussion: >
  Operating systems must use cryptographic mechanisms to protect data at
  rest, selecting mechanisms based on the information's security category and integrity
  needs, with options for full-disk or selective encryption.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-28(01)
    - SC-28
    - SC-28(03)
  disa:
    cci:
    - CCI-002475
    - CCI-004910
    - CCI-002476
    - CCI-001199
    srg:
    - SRG-OS-000185-GPOS-00079
    disa_stig:
      ubuntu_22:
      - UBTU-22-231010
      ubuntu_24:
      - UBTU-24-600090
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: cat /etc/crypttab | grep -q "luks"
        result:
          exit_code: 0
      fix:
        additional_info: Use LUKS to encrypt the drive(s) on the system.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
