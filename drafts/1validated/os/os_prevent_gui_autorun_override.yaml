id: os_prevent_gui_autorun_override
title: Ubuntu must prevent a user from overriding the disabling of the graphical
  user interface autorun function.
discussion: >
  Addressing this involves using nonce-based or challenge-response
  protocols (e.g., TLS, WS-Security) and time-synchronous or challenge-
  response one-time authenticators.
references:
  nist:
    cce:
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-03
  disa:
    cci:
    - CCI-000778
    - CCI-001958
    srg:
    - SRG-OS-000114-GPOS-00059
    disa_stig:
      ubuntu_24:
      - UBTU-24-200041
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: gsettings writable org.gnome.desktop.media-handling autorun-never
        result:
          bool: false
      fix:
        shell: mkdir -p /etc/dconf/db/local.d/locks && echo "/org/gnome/desktop/media-handling/autorun-never" >> /etc/dconf/db/local.d/locks/00-security-settings-lock && dconf update
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
