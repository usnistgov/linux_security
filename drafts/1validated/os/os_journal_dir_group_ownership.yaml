id: os_journal_dir_group_ownership
title: Ubuntu must configure the directories used by the system journal
  to be group-owned by "systemd-journal".
discussion: Only authorized personnel should see error details, as messages can reveal
  operational state, OS/platform, PII, or other sensitive information. Error message
  content must be carefully designed per organizational policy to prevent unauthorized
  disclosure.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SI-11
  disa:
    cci:
    - CCI-001314
    srg:
    - SRG-OS-000206-GPOS-00084
    disa_stig:
      ubuntu_22:
      - UBTU-22-232085
      - UBTU-22-232095
      ubuntu_24:
      - UBTU-24-700060
      - UBTU-24-700070
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: stat -c '%G' /run/log/journal /run/log/journal/**/* /var/log/journal /var/log/journal/**/* 2> /dev/null | sort | uniq
        result:
          string: systemd-journal
      fix:
        shell: echo -e "z /var/log/journal/%m/system.journal 0640 root systemd-journal - -\nz /run/log/journal 2750 root systemd-journal - -\nz /var/log/journal 2750 root systemd-journal - -\nz /var/log/journal/%m 2750 root systemd-journal - -" >> /etc/tmpfiles.d/zzz-systemd-stig.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
- reboot_required
