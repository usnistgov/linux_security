id: pwpolicy_no_dict_words
title: Ubuntu must prevent the use of dictionary words for passwords.
discussion: >
  Allowing dictionary-based passwords in Ubuntu raises the risk
  of compromise by making passwords easier to guess or brute-force.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00225
    - SRG-OS-000710-GPOS-00160
    disa_stig:
      ubuntu_22:
      - UBTU-22-611030
      ubuntu_24:
      - UBTU-24-300014
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "^dictcheck" /etc/security/pwquality.conf | awk -F" = " '{print $2}'
        result:
          integer: 1
      fix:
        shell: echo "dictcheck = 1" >> /etc/security/pwquality.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
