id: pwpolicy_max_password_lifetime_60days
title: Ubuntu must enforce a 60-day maximum password lifetime restriction.
  Passwords for new users must have a 60-day maximum password lifetime restriction.
discussion: Passwords can eventually be cracked, so they must be changed periodically;
  without enforced password lifetime limits, the operating system risks password compromise.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-004066
    - CCI-000199
    srg:
    - SRG-OS-000076-GPOS-00044
    disa_stig:
      ubuntu_22:
      - UBTU-22-411030
      ubuntu_24:
      - UBTU-24-400310
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "^PASS_MAX_DAYS" /etc/login.defs | awk '{print $2}'
        result:
          integer: 60
      fix:
        shell: echo "PASS_MAX_DAYS 60" >> /etc/login.defs
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
