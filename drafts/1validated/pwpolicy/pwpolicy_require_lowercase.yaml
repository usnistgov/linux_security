id: pwpolicy_require_lowercase
title: Ubuntu must enforce password complexity by requiring at least one
  lowercase character be used.
discussion: >
  A complex password increases the time and resources needed to crack it
  by raising the number of possible combinations. Password complexity thus measures
  resistance to guessing and brute-force attacks.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-004065
    - CCI-004066
    - CCI-000193
    srg:
    - SRG-OS-000070-GPOS-00038
    disa_stig:
      ubuntu_22:
      - UBTU-22-611015
      ubuntu_24:
      - UBTU-24-400270
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "^lcredit" /etc/security/pwquality.conf | awk -F" = " '{print $2}'
        result:
          integer: -1
      fix:
        shell: echo "lcredit = -1" >> /etc/security/pwquality.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
