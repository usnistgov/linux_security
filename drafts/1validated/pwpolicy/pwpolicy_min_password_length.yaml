id: pwpolicy_min_password_length
title: Enforce Minimum Password Length of $ODV Characters
discussion: |
  Ubuntu must enforce a minimum $ODV character password length.

  The shorter a password, the fewer combinations an attacker must test to compromise it. Increasing password length and complexity exponentially raises the time and resources required for a brute-force attack.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-5(1)
  disa:
    cci:
    - CCI-000205
    - CCI-004066
    srg:
    - SRG-OS-000078-GPOS-00046
    disa_stig:
      ubuntu_22:
      - UBTU-22-611035
      ubuntu_24:
      - UBTU-24-400320
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "^minlen" /etc/security/pwquality.conf | awk -F" = " '{print $2}'
        result:
          integer: $ODV
      fix:
        shell: echo "minlen = $ODV" >> /etc/security/pwquality.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
odv:
  hint:
    datatype: number
    description: Minimum password length in characters, e.g. 15
    validation:
      min: 1
  recommended: 15
  disa_stig: 15        
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
