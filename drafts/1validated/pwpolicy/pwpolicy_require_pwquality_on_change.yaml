id: pwpolicy_require_pwquality_on_change
title: Ubuntu must be configured so that when passwords are changed or new
  passwords are established, pwquality must be used.
discussion: >
  Complex passwords increase the time and resources needed to crack them,
  and pwquality enforces strong password construction while limiting brute-
  force attacks on the system.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00225
    disa_stig:
      ubuntu_22:
      - UBTU-22-611045
      ubuntu_24:
      - UBTU-24-300016
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: '[[ "$(grep "pam_pwquality.so" /etc/pam.d/common-password | grep -E "retry=(1|2|3)" | wc -l)" == "1" && "$(grep "^enforcing" /etc/security/pwquality.conf | awk -F" = " "{print $2}")" == 1 ]]'
        result:
          exit_code: 0
      fix:
        shell: sed -i "1i password requisite pam_pwquality.so retry=3" /etc/pam.d/common-password && echo "enforcing = 1" >> /etc/security/pwquality.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
