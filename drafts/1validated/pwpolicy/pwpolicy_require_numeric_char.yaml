id: pwpolicy_require_numeric_char
title: Require Numeric Characters in Passwords
discussion: |
  The system must enforce password complexity by requiring that at least $ODV numeric character be used.

  A complex password increases the time and resources needed to crack it by raising the number of possible combinations. Password complexity thus measures resistance to guessing and brute-force attacks.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-5(1)
  disa:
    cci:
    - CCI-004066
    - CCI-000194
    srg:
    - SRG-OS-000071-GPOS-00039
    disa_stig:
      ubuntu_22:
      - UBTU-22-611020
      ubuntu_24:
      - UBTU-24-400280
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "^dcredit" /etc/security/pwquality.conf | awk -F" = " '{print $2}'
        result:
          integer: -$ODV
      fix:
        shell: echo "dcredit = -$ODV" >> /etc/security/pwquality.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
odv:
  hint:
    datatype: number
    description: Minimum number of numeric characters that must be used in a password, e.g. 1
    validation:
      min: 0
  recommended: 0
  disa_stig: 1
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
