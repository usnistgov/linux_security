id: pwpolicy_require_special_char
title: Ubuntu must enforce password complexity by requiring that at least
  one special character be used.
discussion: >
  A complex password, particularly one that includes special characters,
  increases the time and resources required to crack it by expanding the number
  of possible combinations. Password complexity thus measures its resistance to
  guessing and brute-force attacks.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-004066
    - CCI-001619
    srg:
    - SRG-OS-000266-GPOS-00101
    disa_stig:
      ubuntu_22:
      - UBTU-22-611025
      ubuntu_24:
      - UBTU-24-400330
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "^ocredit" /etc/security/pwquality.conf | awk -F" = " '{print $2}'
        result:
          integer: -1
      fix:
        shell: echo "ocredit = 1" >> /etc/security/pwquality.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
