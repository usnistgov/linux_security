id: pwpolicy_no_blank_passwords
title: Ubuntu must not allow accounts configured with blank or null passwords.
discussion: An account with an empty password allows anyone to log in and execute
  commands with that account's privileges. Such accounts must not be used in operational
  environments.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-611060
      ubuntu_24:
      - UBTU-24-300028
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -v "^#" /etc/pam.d/common-auth /etc/pam.d/common-password | grep "nullok" | wc -l
        result:
          integer: 0
      fix:
        shell: sed -iE "s/(nullok|nullok_secure)//g" /etc/pam.d/common-auth
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
