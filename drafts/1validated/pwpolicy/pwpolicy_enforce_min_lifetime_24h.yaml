id: pwpolicy_enforce_min_lifetime_24h
title: Ubuntu must enforce 24 hours/one day as the minimum password lifetime.
  Passwords for new users must have a 24 hours/one day minimum password lifetime restriction.
discussion: Enforcing a minimum password lifetime prevents users from changing passwords
  too frequently to bypass reuse or history policies. It stops rapid successive changes
  that could defeat password reuse controls.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-000198
    - CCI-004065
    - CCI-004066
    srg:
    - SRG-OS-000075-GPOS-00043
    disa_stig:
      ubuntu_22:
      - UBTU-22-411025
      ubuntu_24:
      - UBTU-24-400300
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "^PASS_MIN_DAYS" /etc/login.defs | awk '{print $2}'
        result:
          integer: 1
      fix:
        shell: echo "PASS_MIN_DAYS 1" >> /etc/login.defs
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
