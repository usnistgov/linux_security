id: pwpolicy_store_only_encrypted_passwords
title: Ubuntu must store only encrypted representations of passwords.
discussion: >
  Password complexity measures how well a password resists guessing and
  brute-force attacks. Allowing consecutive reuse after its lifetime defeats
  policy-required password changes.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-000196
    - CCI-004062
    srg:
    - SRG-OS-000073-GPOS-00041
    disa_stig:
      ubuntu_22:
      - UBTU-22-611055
      ubuntu_24:
      - UBTU-24-400220
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep "pam_unix.so" /etc/pam.d/common-password | grep "sha512" | grep -q "rounds=100000"
        result:
          exit_code: 0
      fix:
        shell: echo "password [success=1 default=ignore] pam_unix.so obscure sha512 shadow rounds=100000" >> /etc/pam.d/common-password
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
