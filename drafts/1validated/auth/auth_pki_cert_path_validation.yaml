id: auth_pki_cert_path_validation
title: Ubuntu , for PKI-based authentication, must validate certificates
  by constructing a certification path (which includes status information) to an accepted
  trust anchor.
discussion: This requirement ensures that certificate validation uses a certification
  path to an accepted trust anchor and includes status information (such as CRL or
  OCSP), allowing the relying party to make an informed trust decision for certificates
  not already explicitly trusted.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-17
    - IA-05(02)
  disa:
    cci:
    - CCI-004909
    - CCI-000185
    srg:
    - SRG-OS-000066-GPOS-00034
    disa_stig:
      ubuntu_22:
      - UBTU-22-612030
      ubuntu_24:
      - UBTU-24-400375
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep use_pkcs11_module /etc/pam_pkcs11/pam_pkcs11.conf | awk '/pkcs11_module opensc {/,/}/' /etc/pam_pkcs11/pam_pkcs11.conf | grep cert_policy | grep -q ca
        result:
          exit_code: 0
      fix:
        additional_info: Ensure all cert_policy lines contain "ca" verification to an accepted trust anchor.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_moderate
- 800-53r5_high
