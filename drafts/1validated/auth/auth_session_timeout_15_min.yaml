id: auth_session_timeout_15_min
title: Ubuntu must automatically exit interactive command shell user sessions
  after 15 minutes of inactivity.
discussion: Ending idle interactive shell sessions quickly limits the time unauthorized
  users could hijack an unattended terminal or console.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-12
  disa:
    cci:
    - CCI-002361
    srg:
    - SRG-OS-000279-GPOS-00109
    disa_stig:
      ubuntu_22:
      - UBTU-22-412030
      ubuntu_24:
      - UBTU-24-200060
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -rh "TMOUT=" /etc/bash.bashrc /etc/profile.d/* | awk -F"=" '{ if ($2 <= 900) print "pass" }'
        result:
          string: pass
      fix:
        shell: echo TMOUT=900 >> /etc/profile.d/99-terminal_tmout.sh
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
      enforcement_info:
        fix:
          shell: echo TMOUT=600 >> /etc/profile.d/99-terminal_tmout.sh
tags:
- 800-53r5_moderate
- 800-53r5_high
