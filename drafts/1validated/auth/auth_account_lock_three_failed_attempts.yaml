id: auth_account_lock_three_failed_attempts
title: Ubuntu must automatically lock an account until the locked account
  is released by an administrator when three unsuccessful logon attempts have been
  made.
discussion: >
  Limiting failed logon attempts reduces the risk of brute-force attacks
  by locking accounts after too many failures.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-07
    - AC-07
  disa:
    cci:
    - CCI-002238
    - CCI-000044
    srg:
    - SRG-OS-000021-GPOS-00005
    disa_stig:
      ubuntu_22:
      - UBTU-22-411045
      ubuntu_24:
      - UBTU-24-200610
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: '[[ "$(grep "faillock" /etc/pam.d/common-auth)" && "$(grep -Ew "^(silent|audit|deny.*3|fail_interval|unlock_time)" /etc/security/faillock.conf | wc -l)" == "5" ]]'
        result:
          exit_code: 1
      fix:
        shell: echo -e "audit\nsilent\ndeny = 3\nfail_interval = 900\nunlock_time = 0" >> /etc/security/faillock.conf
        additional_info: You must manually configure /etc/pam.d/common-auth to load faillock, if not doing that already.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
