id: auth_configure_sssd_for_mfa
title: Ubuntu must use the "SSSD" package for multifactor authentication
  services.
discussion: >
  Without multifactor authentication, privileged accounts are more easily
  accessed, increasing security risk. MFA requires two or more factors-something
  you know, have, or are-and is exemplified by the DOD CAC with PKI.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-02(06)
    - IA-02(02)
    - IA-02(06)
    - IA-02(01)
  disa:
    cci:
    - CCI-004046
    - CCI-000766
    - CCI-004047
    - CCI-000765
    srg:
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000705-GPOS-00150
    disa_stig:
      ubuntu_22:
      - UBTU-22-254015
      ubuntu_24:
      - UBTU-24-100660
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: '[[ "$(systemctl is-enabled sssd)" == "enabled" && "$(systemctl is-active sssd)" == "active" ]]'
        result:
          exit_code: 0
      fix:
        shell: systemctl enable --now sssd
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
