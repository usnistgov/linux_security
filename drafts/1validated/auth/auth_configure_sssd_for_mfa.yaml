id: auth_configure_sssd_for_mfa
title: Configure SSSD for Multifactor Authentication
discussion: |
  The system must use the "SSSD" package for multifactor authentication services.
  
  Without multifactor authentication, privileged accounts are more easily accessed, increasing security risk. MFA requires two or more factors-something you know, have, or are-and is exemplified by the DOD CAC with PKI.
