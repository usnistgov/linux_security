    enforcement_info:
      check:
      check:
        shell: |
          if test "$(systemctl is-active sssd.service)" = "active" && test "$(systemctl is-enabled sssd.service)" = "enabled"; then
            echo "passed"
          else
            echo "failed"
          fi
        result:
          string: passed
      fix:
        additional_info: Ensure SSSD is configured appropriately for the environment, then enable with systemctl enable --now sssd.
