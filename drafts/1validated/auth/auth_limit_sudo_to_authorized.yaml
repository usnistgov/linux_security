id: auth_limit_sudo_to_authorized
title: Ubuntu must restrict privilege elevation to authorized personnel.
discussion: An incorrectly configured sudoers file allows any system user to perform
  privileged actions.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-11
    - SC-11
  disa:
    cci:
    - CCI-002038
    - CCI-004895
    srg:
    - SRG-OS-000373-GPOS-00156
    - SRG-OS-000396-GPOS-00176
    disa_stig:
      ubuntu_22:
      - UBTU-22-654224
      ubuntu_24:
      - UBTU-24-300019
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -Rhq "^ALL" /etc/sudoers /etc/sudoers.d/*
        result:
          exit_code: 0
      fix:
        shell: sed -i 's/^ALL.*//g' /etc/sudoers && sed -i 's/^ALL.*//g' /etc/sudoers.d/*
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
