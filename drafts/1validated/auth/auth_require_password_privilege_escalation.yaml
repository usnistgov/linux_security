id: auth_require_password_privilege_escalation
title: Ubuntu must require users to provide a password for privilege escalation.
discussion: Without reauthentication, users could access unauthorized resources or
  perform privileged tasks; therefore, when an operating system allows functional
  capability escalation, it must require the user to reauthenticate.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-11
    - SC-11
  disa:
    cci:
    - CCI-002038
    - CCI-004895
    srg:
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-432011
      ubuntu_24:
      - UBTU-24-300020
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -Rhq "NOPASSWD" /etc/sudoers /etc/sudoers.d/*
        result:
          exit_code: 1
      fix:
        shell: sed -i 's/NOPASSWD//g' /etc/sudoers && sed -i 's/NOPASSWD//g' /etc/sudoers.d/*
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
