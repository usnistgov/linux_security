id: auth_verify_piv_credentials
title: Ubuntu must electronically verify personal identity verification
  (PIV) credentials.
discussion: >
  PIV credentials, such as the DoD-mandated CAC, standardize identity
  management and authentication under HSPD 12, reducing unauthorized-
  access risk and serving as a key layer of protection for national security systems.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-02(12)
  disa:
    cci:
    - CCI-001954
    srg:
    - SRG-OS-000377-GPOS-00162
    disa_stig:
      ubuntu_22:
      - UBTU-22-612025
      ubuntu_24:
      - UBTU-24-400060
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep use_pkcs11_module /etc/pam_pkcs11/pam_pkcs11.conf | awk '/pkcs11_module opensc {/,/}/' /etc/pam_pkcs11/pam_pkcs11.conf | grep cert_policy | grep -q ocsp_on
        result:
          exit_code: 0
      fix:
        additional_info: Ensure all "cert_policy" lines contain "oscp_on". 
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
