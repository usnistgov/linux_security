id: auth_disable_root_login
title: Ubuntu must prevent direct login to the root account.
discussion: Organizational users must be individually identified and authenticated
  before using any group authenticator (e.g., root, Administrator, sa, helpdesk) to
  ensure accountability and traceability. Exceptions are only those accesses explicitly
  documented by the organization as not requiring identification or authentication.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-02(05)
  disa:
    cci:
    - CCI-000770
    - CCI-004045
    srg:
    - SRG-OS-000109-GPOS-00056
    disa_stig:
      ubuntu_22:
      - UBTU-22-411010
      ubuntu_24:
      - UBTU-24-400110
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: passwd -S root | awk '{ if ($2 == "L") print "pass" }'
        result:
          string: pass
      fix:
        shell: passwd -l root
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_high
