id: auth_sudo_group_access_control
title: Ubuntu must ensure only users who need access to security functions
  are part of sudo group.
discussion: >
  An isolation boundary enforces access control to protect the integrity
  of the hardware, software, and firmware that perform security functions, which
  enforce the system security policy and isolate code and data. Ubuntu 22.04
  LTS restricts access to these functions through access-control mechanisms and
  least-privilege capabilities, leveraging kernel separation, file-system
  and address-space protections, and disciplined development practices.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-03
  disa:
    cci:
    - CCI-001084
    srg:
    - SRG-OS-000134-GPOS-00068
    disa_stig:
      ubuntu_22:
      - UBTU-22-432015
      ubuntu_24:
      - UBTU-24-600130
platforms:
  ubuntu:
    enforcement_info:
      check:
        additional_info: Use the command "grep sudo /etc/group". If anyone in that group is not supposed to have sudo permissions, this is a finding.
      fix:
        additional_info: Members can be removed with gpasswd -d sudo.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_high
- manual
