id: auth_accept_piv_credentials_via_pam
title: Ubuntu must accept Personal Identity Verification (PIV) credentials managed through the Privileged Access Management (PAM) framework.
discussion: >
  PIV credentials, such as the DoD-mandated Common Access Card (CAC),
  standardize authentication and reduce unauthorized-access risk while supporting
  HSPD 12 identity management and serving as a key layer of protection for
  national security systems.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-02(12)
    - IA-02(02)
    - IA-02(06)
    - IA-02(01)
  disa:
    cci:
    - CCI-000766
    - CCI-004046
    - CCI-004047
    - CCI-000765
    - CCI-000767
    - CCI-000768
    - CCI-001948
    - CCI-001953
    srg:
    - SRG-OS-000375-GPOS-00160
    - SRG-OS-000376-GPOS-00161
    disa_stig:
      ubuntu_22:
      - UBTU-22-612010
      ubuntu_24:
      - UBTU-24-100910
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: dpkg -l | grep -q "libpam-pkcs11"
        result:
          exit_code: 0
      fix:
        shell: apt install -y libpam-pkcs11
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
