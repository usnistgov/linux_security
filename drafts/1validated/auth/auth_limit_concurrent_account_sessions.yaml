id: auth_limit_concurrent_account_sessions
title: Limit Concurrent Account Sessions
discussion: |
  The system must limit the number of concurrent sessions to $ODV for all accounts and/or account types.

  The system allows administrators to limit the number of users and concurrent sessions per user to mitigate denial-of-service risks. The maximum concurrent sessions for information system accounts should be set according to mission requirements and the operation environment, without restricting multiple accounts used by a single user.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-10
  disa:
    cci:
    - CCI-000054
    srg:
    - SRG-OS-000027-GPOS-00008
    disa_stig:
      ubuntu_22:
      - UBTU-22-412020
      ubuntu_24:
      - UBTU-24-200000
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -rh "\* hard maxlogins" /etc/security/limits.conf /etc/security/limits.d/* | awk '{ if ($4 <= $ODV) print "pass" }'
        result:
          string: pass
      fix:
        shell: sed -i "1i \* hard maxlogins $ODV" /etc/security/limits.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
odv:
  hint:
    datatype: number
    description: Maximum concurrent login sessions
    validation:
      min: 0
  recommended: 10
  disa_stig: 10
tags:
- 800-53r5_high
