id: auth_limit_concurrent_account_sessions
title: Ubuntu must limit the number of concurrent sessions to ten for all
  accounts and/or account types.
discussion: >
  Ubuntu allows administrators to limit the number of users and
  concurrent sessions per user to mitigate denial-of-service risks. The
  maximum concurrent sessions for information system accounts should be set according
  to mission requirements and the operational environment, without restricting multiple
  accounts used by a single user.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-10
  disa:
    cci:
    - CCI-000054
    srg:
    - SRG-OS-000027-GPOS-00008
    disa_stig:
      ubuntu_22:
      - UBTU-22-412020
    disa_stig:
      ubuntu_24:
      - UBTU-24-200000
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -rh "\* hard maxlogins" /etc/security/limits.conf /etc/security/limits.d/* | awk '{ if ($4 <= 10) print "pass" }'
        result:
          string: pass
      fix:
        shell: sed -i '1i * hard maxlogins 10' /etc/security/limits.conf
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
tags:
- 800-53r5_high
