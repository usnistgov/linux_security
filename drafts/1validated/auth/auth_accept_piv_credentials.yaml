id: auth_accept_piv_credentials
title: Ubuntu must accept personal identity verification (PIV) credentials.
discussion: >
  PIV credentials, such as the DoD-mandated Common Access Card (CAC),
  standardize identity management and authentication under HSPD 12, reducing
  unauthorized-access risk and serving as a key layer of protection for national
  security systems.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-02(12)
  disa:
    cci:
    - CCI-001953
    srg:
    - SRG-OS-000376-GPOS-00161
    disa_stig:
      ubuntu_22:
      - UBTU-22-612015
      ubuntu_24:
      - UBTU-24-100900
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: dpkg -l opensc-pkcs11
        result:
          exit_code: 0
      fix:
        shell: apt install -y opensc-pkcs11
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
