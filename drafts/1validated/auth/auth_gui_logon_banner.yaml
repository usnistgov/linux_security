id: auth_gui_logon_banner
title: Ubuntu must enable the graphical user logon banner to display the
  Standard Mandatory DOD Notice and Consent Banner before granting local access to
  the system via a graphical user logon.
discussion: Ubuntu must display a standardized use notification before granting
  access, consistent with federal laws and DOD policy, for human logon interfaces
  only; the full banner text is required when space allows, otherwise a shortened
  version may be used.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-08
  disa:
    cci:
    - CCI-000048
    srg:
    - SRG-OS-000023-GPOS-00006
    disa_stig:
      ubuntu_22:
      - UBTU-22-271010
      ubuntu_24:
      - UBTU-24-200650
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: grep -q "^banner-message-enable=true" /etc/gdm3/greeter.dconf-defaults
        result:
          exit_code: 0
      fix:
        shell: sed -i '/\[org\/gnome\/login-screen\]/a \banner-message-enable=true' /etc/gdm3/greeter.dconf-defaults
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
