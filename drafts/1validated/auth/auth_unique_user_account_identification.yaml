id: auth_unique_user_account_identification
title: Ubuntu must uniquely identify interactive users.
discussion: Organizational users must be uniquely identified and authenticated for
  all system accesses, except for documented exceptions or authorized group authenticator
  use where individual authentication may not be required.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-02
    - IA-08
  disa:
    cci:
    - CCI-000764
    - CCI-000804
    srg:
    - SRG-OS-000104-GPOS-00051
    disa_stig:
      ubuntu_22:
      - UBTU-22-411015
      ubuntu_24:
      - UBTU-24-400000
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: awk -F ":" 'list[$3]++{print $1, $3}' /etc/passwd
        result:
          string: ""
      fix:
        additional_info: Edit /etc/passwd to remove offenders.
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
