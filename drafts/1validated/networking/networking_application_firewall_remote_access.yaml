id: networking_application_firewall_remote_access
title: Ubuntu must have an application firewall installed in order to control
  remote access methods.
discussion: >
  Remote access services lacking automated controls increase risk and complicate
  access management, so Ubuntu (e.g., RDP) must enforce actions
  on unauthorized activity, and automated session controls ensure ongoing compliance
  by enforcing connection rules across servers, workstations, notebooks, smartphones,
  and tablets.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-17(01)
    - CM-06
  disa:
    cci:
    - CCI-002314
    srg:
    - SRG-OS-000297-GPOS-00115
    disa_stig:
      ubuntu_22:
      - UBTU-22-251010
      ubuntu_24:
      - UBTU-24-100300
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: dpkg -l ufw
        result:
          exit_code: 0
      fix:
        shell: apt install -y ufw
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
