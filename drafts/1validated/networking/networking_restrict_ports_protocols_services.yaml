id: networking_restrict_ports_protocols_services
title: Restrict Ports, Protocols, and Services
discussion: 
  The system must be configured to prohibit or restrict the use of functions, ports, protocols, and/or services, as defined in the Ports, Protocols, and Services Management\xC2\_Category Assurance List (PPSM CAL) and vulnerability assessments.

  To prevent unauthorized device connections, data transfers, or tunneling, Ubuntu must disable or restrict unused physical and logical ports/protocols, providing only essential services and limiting functionality to authorized, required capabilities.
