id: networking_enable_ufw
title: Ubuntu must enable and run the Uncomplicated Firewall (ufw).
discussion: Remote access services without automated controls increase risk and complicate
  user access management. Ubuntu 22.04 LTS must enforce actions on detected unauthorized
  activity to ensure compliance with remote access policies.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
    - AC-17(01)
  disa:
    cci:
    - CCI-002314
    - CCI-000366
    srg:
    - SRG-OS-000297-GPOS-00115
    - SRG-OS-000480-GPOS-00232
    disa_stig:
      ubuntu_22:
      - UBTU-22-251015
      - UBTU-22-251020
      ubuntu_24:
      - UBTU-24-100310
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: 'ufw status | grep -q "Status: active"'
        result:
          exit_code: 0
      fix:
        shell: yes | ufw enable
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
