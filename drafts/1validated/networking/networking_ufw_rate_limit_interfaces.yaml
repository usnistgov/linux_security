id: networking_ufw_rate_limit_interfaces
title: Ubuntu 22.04 LTS must configure the Uncomplicated Firewall (ufw) to rate-limit
  impacted network interfaces.
discussion: Denial of service (DoS) makes resources unavailable to legitimate users,
  impairing mission capability. This requirement mandates configuring the OS to mitigate
  ongoing or past DoS attacks by identifying threats and applying solutions such as
  process limits, memory partitions, increased capacity, bandwidth, and service redundancy.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - SC-05
  disa:
    cci:
    - CCI-002385
    srg:
    - SRG-OS-000420-GPOS-00186
    disa_stig:
      ubuntu_22:
      - UBTU-22-251025
      ubuntu_24:
      - UBTU-24-600200
platforms:
  ubuntu:
    enforcement_info:
      check:
        additional_info: Check sockets configured for "LISTEN", and ensure "LIMIT" is set as an action in UFW.
      fix:
        additional_info: Set rate limiting with "ufw limit".
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
