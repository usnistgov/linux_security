id: audit_userhelper_command
title: Authorized userhelper Command Execution Events
discussion: |
  The system must generate audit records for successful/unsuccessful uses of the userhelper command.

  Without audit records tailored to the organization's security and mission needs, it is difficult to establish, correlate, investigate incidents, or identify responsible parties. These records can be generated from various system components, such as modules or policy filters.
references:
  nist:
    cce:
      redhat_9:
      - CCE-XXXXX-X
    800-53r5:
    - AU-3
    - AU-12
    - MA-4
  disa:
    cci:
    - CCI-000130
    - CCI-000135
    - CCI-000169
    - CCI-000172
    - CCI-002884
    srg:
    - SRG-OS-000037-GPOS-00015
    disa_stig:
      redhat_9:
      - RHEL-09-654170
platforms:
  redhat:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-a always,exit -F path=/usr/sbin/userhelper -F perm=x -F auid>=1000 -F auid!=unset"
        result:
          exit_code: 0
      fix:
        shell: echo "-a always,exit -F path=/usr/sbin/userhelper -F perm=x -F auid>=1000 -F auid!=-1 -k privileged-unix-update" >> /etc/audit/rules.d/stig.rules && chmod 640 /etc/audit/rules.d/stig.rules && augenrules --load
    '9':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
