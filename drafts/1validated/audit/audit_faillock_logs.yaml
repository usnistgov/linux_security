id: audit_faillock_logs
title: Authorized Faillock File Use and Modification Events
discussion: |
  The system must generate audit records for the use and modification of faillock file.

  Generating audit records that meet the organization's security and mission requirements is necessary to establish, correlate, and investigate incidents and identify those responsible. These records can be produced by various system components (e.g., modules or policy filters).
references:
  nist:
    cce:
      redhat_9:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    - CCI-002884
    srg:
    - SRG-OS-000037-GPOS-00015
    disa_stig:
      redhat_9:
      - RHEL-09-654210
platforms:
  redhat:
    enforcement_info:
      check:
        shell: auditctl -l | grep "/var/log/faillock" | wc -l
        result:
          integer: 2
      fix:
        shell: printf "%s\n" "-a always,exit -F arch=b32 -F path=/var/log/faillock -F auid>=1000 -F auid!=unset -k privileged-umount" "-a always,exit -F arch=b64 -F path=/var/log/faillock -F auid>=1000 -F auid!=unset -k privileged-umount" >> /etc/audit/rules.d/stig.rules && chmod 640 /etc/audit/rules.d/stig.rules && augenrules --load
    '9':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
