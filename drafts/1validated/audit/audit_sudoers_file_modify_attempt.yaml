id: audit_sudoers_file_modify_attempt
title: Audit Records for Modifying /etc/sudoers File
discussion: |
  The system must generate audit records when successful/unsuccessful attempts to modify the /etc/sudoers file occur.

  Without audit records tailored to the organization's security and mission needs, it is difficult to establish, correlate, investigate incidents, or identify
  responsible parties. Audit records can be generated from various system components, such as modules or policy filters.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000466-GPOS-00210
    disa_stig:
      ubuntu_22:
      - UBTU-22-654220
      ubuntu_24:
      - UBTU-24-900510
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /etc/sudoers -p wa"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /etc/sudoers -p wa -k privilege_modification" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
