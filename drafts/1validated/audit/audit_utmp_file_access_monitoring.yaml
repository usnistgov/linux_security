id: audit_utmp_file_access_monitoring
title: Ubuntu must generate audit records for the /var/run/utmp file.
discussion: Without audit records tailored to the organization's security and mission
  needs, it is difficult to establish, correlate, investigate incidents, or identify
  responsible parties. Audit records can be generated from various system components,
  such as modules or policy filters.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000472-GPOS-00217
    disa_stig:
      ubuntu_20:
      - UBTU-20-010278
      ubuntu_22:
      - UBTU-22-654205
      ubuntu_24:
      - UBTU-24-900600
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /var/run/utmp -p wa"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /var/run/utmp -p wa -k logins" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
