id: audit_lastlog_file_use_modify
title: Audit Records for Lastlog File Use and Modification
discussion: |
  The system must generate audit records for the use and modification of the lastlog file.

  Generating audit records specific to the organization's security and mission needs is necessary to establish, correlate, and investigate incidents and identify responsible parties; these records can be produced by various system components (e.g., modules or policy filters). 
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_20:
      - UBTU-20-010171
      ubuntu_22:
      - UBTU-22-654215
      ubuntu_24:
      - UBTU-24-900260
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /var/log/lastlog -p wa"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /var/log/lastlog -p wa -k logins" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
