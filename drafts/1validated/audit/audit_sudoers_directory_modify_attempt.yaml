id: audit_sudoers_directory_modify_attempt
title: Ubuntu must generate audit records when successful/unsuccessful attempts
  to modify the /etc/sudoers.d directory occur.
discussion: Without audit records tailored to the organization's security and mission
  needs, it is difficult to establish, correlate, investigate incidents, or identify
  responsible parties. Audit records can be generated from various system components,
  such as modules or policy filters.
references:
  nist:
    800-53r5:
    - AU-12 c
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000466-GPOS-00210
    disa_stig:
      ubuntu_2204:
        - UBTU-22-654225
      ubuntu_2404:
        - UBTU-24-900520
enforcement_info:
  enforcement_type: full
  check:
    shell: auditctl -l | grep -q "\-w /etc/sudoers.d -p wa"
    status_code: 0
  fix:
    shell: echo "-w /etc/sudoers.d -p wa -k privilege_modification" >> /etc/audit/rules.d/stig.rules && augenrules --load
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
tags:
- testing
