id: audit_kmod_command
title: Audit Records for kmod Command Usage
discussion: |
  The system must generate audit records for successful/unsuccessful attempts to use the kmod command.

  Without organization-specific audit records, it is difficult to establish, correlate, investigate incidents, or identify responsible parties. Audit records can be generated from various system components, such as modules or policy filters.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000477-GPOS-00222
    disa_stig:
      ubuntu_20:
      - UBTU-20-010297
      ubuntu_22:
      - UBTU-22-654055
      ubuntu_24:
      - UBTU-24-900740
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /bin/kmod -p x"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /bin/kmod -p x -k module" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
