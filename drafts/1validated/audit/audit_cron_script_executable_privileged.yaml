id: audit_cron_script_executable_privileged
title: Ubuntu must audit any script or executable called by cron as root
  or by any privileged user.
discussion: >
  Scripts or executables run by cron as root or any privileged user must
  be owned by that user, have permissions 755 or stricter, and must not grant
  non-privileged users the ability to modify them.
references:
  nist:
    800-53r5:
    - AU-12 c
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000471-GPOS-00215
    disa_stig:
      ubuntu_2004:
      - UBTU-20-010105
      ubuntu_2204:
      - UBTU-22-654041
      ubuntu_2404:
      - UBTU-24-200270
enforcement_info:
  enforcement_type: full
  check:
    shell: auditctl -l | grep -e "\-w /etc/cron.d -p wa" -e "\-w /var/spool/cron -p wa" | wc -l
    standard_output: "2"
  fix:
    shell: echo -e "-w /etc/cron.d/ -p wa -k cronjobs\n-w /var/spool/cron/ -p wa -k cronjobs" >> /etc/audit/rules.d/stig.rules && augenrules --load
platforms:
- name: ubuntu_2004
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
tags:
- testing
