id: audit_privileged_nonlocal_maintenance_diagnostic
title: Audit Records for Access
discussion: |
  The system must generate audit records for privileged activities, nonlocal maintenance, diagnostic sessions, and other system-level access.

  Failure to log events from nonlocal administrative access or diagnostic sessions removes a critical audit capability for detecting and investigating attacks. This requirement mandates logging of such activities for external or internal network-based maintenance tools, excluding built-in system utilities like ping, ls, ipconfig, or Ethernet switch monitoring ports.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - MA-4(1)
    - AU-12
  disa:
    cci:
    - CCI-000172
    - CCI-002884
    srg:
    - SRG-OS-000392-GPOS-00172
    disa_stig:
      ubuntu_20:
      - UBTU-20-010244
      ubuntu_22:
      - UBTU-22-654235
      ubuntu_24:
      - UBTU-24-500010
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /var/log/sudo.log -p wa"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /var/log/sudo.log -p wa -k maintenance" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
