id: audit_setxattr_extended_attributes_syscalls
title: Audit Records for setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, and lremovexattr System Calls
discussion: |
  The system must generate audit records for any use of the setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, and lremovexattr system calls.

  Generating organization-specific audit records is essential for incident investigation and accountability, and they can be produced from various system components. System call rules should be used sparingly and combined when possible to minimize performance impact.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_20:
      - UBTU-20-010142
      ubuntu_22:
      - UBTU-22-654180
      ubuntu_24:
      - UBTU-24-900130
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -F "setxattr" | grep -F "fsetxattr" | grep -F "lsetxattr" | grep -F "removexattr" | grep -F "fremovexattr" | grep -F "lremovexattr" | grep -E "\-a always,exit -F arch=\S* -S .* -F auid(>=1000|=0) (-F auid!=-1 -F|-k)" | wc -l
        result:
          integer: 4
      fix:
        shell: echo -e "-a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid>=1000 -F auid!=unset -k perm_mod\n-a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0 -k perm_mod\n-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid>=1000 -F auid!=unset -k perm_mod\n-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0 -k perm_mod" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
