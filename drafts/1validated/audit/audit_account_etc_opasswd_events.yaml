id: audit_account_etc_opasswd_events
title: Authorized Account Management Events
discussion: |
  Ubuntu must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/opasswd.
  
  Attackers often create accounts to maintain persistent access, and auditing these account-creation events provides essential forensic logs. Integrating
  the OS with enterprise-level authentication, access, and auditing mechanisms helps meet or exceed access-control policy requirements.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-02(04)
    - AU-12
  disa:
    cci:
    - CCI-001403
    - CCI-000172
    - CCI-000018
    - CCI-002130
    - CCI-001404
    - CCI-001405
    srg:
    - SRG-OS-000004-GPOS-00004
    disa_stig:
      ubuntu_20:
      - UBTU-20-010104
      ubuntu_22:
      - UBTU-22-654140
      ubuntu_24:
      - UBTU-24-200320
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /etc/security/opasswd -p wa"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /etc/security/opasswd -p wa -k usergroup_modification" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
