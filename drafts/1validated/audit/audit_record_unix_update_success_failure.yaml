id: audit_record_unix_update_success_failure
title: Ubuntu must generate audit records for successful/unsuccessful uses of the
  unix_update command.
discussion: Without audit records tailored to the organization's security and mission
  needs, it is difficult to establish, correlate, investigate incidents, or identify
  responsible parties. These records can be generated from various system components,
  such as modules or policy filters.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_20:
      - UBTU-20-010173
      ubuntu_22:
      - UBTU-22-654120
      ubuntu_24:
      - UBTU-24-900280
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-a always,exit -S all -F path=/sbin/unix_update -F perm=x -F auid>=1000 -F auid!=-1"
        result:
          exit_code: 0
      fix:
        shell: echo "-a always,exit -F path=/sbin/unix_update -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
