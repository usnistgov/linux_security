id: audit_account_modifications_events_passwd
title: Authorized Account Management Events
discussion: |
  The system must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/passwd.

  Attackers often create accounts to maintain persistent access after compromising a system; auditing these account-creation events provides essential forensic logs. Operating systems can be linked to enterprise authentication, access, and auditing solutions that satisfy or exceed access-control policy requirements.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AC-02(04)
    - AU-12
  disa:
    cci:
    - CCI-001403
    - CCI-000172
    - CCI-000018
    - CCI-002130
    - CCI-001404
    - CCI-001405
    srg:
    - SRG-OS-000004-GPOS-00004
    disa_stig:
      ubuntu_20:
      - UBTU-20-010100
      ubuntu_22:
      - UBTU-22-654145
      ubuntu_24:
      - UBTU-24-200280
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /etc/passwd -p wa"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /etc/passwd -p wa -k usergroup_modification" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
