id: audit_fdisk_command_execution_monitoring
title: Fdisk Command Execution Events
discussion: |
  The system must generate audit records for successful/unsuccessful attempts to use the fdisk command.

  Without organization-specific audit records, it is difficult to trace, correlate, and investigate incidents or identify responsible parties. Audit records can be generated from various system components, such as modules or policy filters.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000477-GPOS-00222
    disa_stig:
      ubuntu_20:
      - UBTU-20-010298
      ubuntu_22:
      - UBTU-22-654045
      ubuntu_24:
      - UBTU-24-900750
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /usr/sbin/fdisk -p x"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /usr/sbin/fdisk -p x -k fdisk" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
