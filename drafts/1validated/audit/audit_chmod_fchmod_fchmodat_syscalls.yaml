id: audit_chmod_fchmod_fchmodat_syscalls
title: Authorized chmod, fchmod, and fchmodat System Call Execution Events
discussion: |
  The system must generate audit records for successful/unsuccessful uses of the chmod, fchmod, and fchmodat system calls.

  Audit records tailored to organizational security and mission needs are essential for establishing, correlating, and investigating incidents; they can
  be produced from various system components, including syscall\u2011matching rules. Because each syscall rule impacts performance, they should be used only when necessary and combined whenever possible to minimize overhead.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_22:
      - UBTU-22-654155
      ubuntu_24:
      - UBTU-24-900150
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -F "chmod" | grep -F "fchmod" | grep -F "fchmodat" | grep "\-a always,exit -F arch=\S* -S .* -F auid>=1000 -F auid!=-1 -F key" | wc -l
        result:
          integer: 2
      fix:
        shell: echo -e "-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_chng\n-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_chng" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
