id: audit_chmod_fchmod_fchmodat_syscalls
title: Ubuntu must generate audit records for successful/unsuccessful uses
  of the chmod, fchmod, and fchmodat system calls.
discussion: >
  Audit records tailored to organizational security and mission needs are
  essential for establishing, correlating, and investigating incidents; they can
  be produced from various system components, including syscall\u2011matching rules.
  Because each syscall rule impacts performance, they should be used only when necessary
  and combined whenever possible to minimize overhead.
references:
  nist:
    800-53r5:
    - AU-12 c
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_2204:
      - UBTU-22-654155
      ubuntu_2404:
      - UBTU-24-900150
enforcement_info:
  enforcement_type: full
  check:
    shell: auditctl -l | grep "\-a always,exit -F arch=b.* -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=-1 -F key" | wc -l
    standard_output: "2"
  fix:
    shell: echo -e "-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_chng\n-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_chng" >> /etc/audit/rules.d/stig.rules && augenrules --load
platforms:
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
tags:
- testing
