id: audit_init_module_finit_module
title: Audit Records for init_module and finit_module Syscall Execution
discussion: |
  The system must generate audit records for successful/unsuccessful uses of the init_module and finit_module syscalls.

  Generating audit records tailored to the organization's security and mission needs is essential for establishing, correlating, and investigating incidents and identifying responsible parties. System call rules should be used only when necessary and combined whenever possible to minimize performance impact.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_22:
      - UBTU-22-654175
      ubuntu_24:
      - UBTU-24-900340
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -F "init_module" | grep -F "finit_module" | grep "\-a always,exit -F arch=\S* -S .* -F auid>=1000 -F auid!=-1" | wc -l
        result:
          integer: 2
      fix:
        shell: echo -e "-a always,exit -F arch=b32 -S init_module,finit_module -F auid>=1000 -F auid!=unset -k module_chng\n-a always,exit -F arch=b64 -S init_module,finit_module -F auid>=1000 -F auid!=unset -k module_chng" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
