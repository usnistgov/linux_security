id: audit_faillog_file_use_modification
title: Authorized Faillog File Use and Modification Events
discussion: |
  The system must generate audit records for the use and modification of faillog file.

  Generating audit records that meet the organization's security and mission requirements is necessary to establish, correlate, and investigate incidents and identify those responsible. These records can be produced by various system components (e.g., modules or policy filters) and satisfy SRG-OS-000064-GPOS-00033, SRG-OS-000470-GPOS-00214, and SRG-OS-000473-GPOS-00218.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_20:
      - UBTU-20-010170
      ubuntu_22:
      - UBTU-22-654210
      ubuntu_24:
      - UBTU-24-900250
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-w /var/log/faillog -p wa"
        result:
          exit_code: 0
      fix:
        shell: echo "-w /var/log/faillog -p wa -k logins" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
