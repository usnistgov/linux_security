id: audit_modprobe_usage
title: Audit Records for modprobe Command Usage
discussion: |
  The system must generate audit records for successful/unsuccessful attempts to use modprobe command.

  Without organization-specific audit records, it is difficult to trace, correlate, and investigate incidents or identify responsible parties. Audit records can be generated from various system components, such as modules or policy filters.
references:
  nist:
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000477-GPOS-00222
    disa_stig:
      ubuntu_2004:
      - UBTU-20-010296
      ubuntu_2204:
      - UBTU-22-654060
      ubuntu_2404:
      - UBTU-24-900730
enforcement_info:
  enforcement_type: full
  check:
    shell: auditctl -l | grep -q "\-w /sbin/modprobe -p x"
    status_code: 0
  fix:
    shell: echo "-w /sbin/modprobe -p x -k modules" >> /etc/audit/rules.d/stig.rules && augenrules --load
platforms:
- name: ubuntu_2004
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
