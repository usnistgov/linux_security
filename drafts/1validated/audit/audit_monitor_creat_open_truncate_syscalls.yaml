id: audit_monitor_creat_open_truncate_syscalls
title: Audit Records for creat, open, openat, open_by_handle_at, truncate, and ftruncate System Calls
discussion: |
  TThe system must generate audit records for successful/unsuccessful uses of the creat, open, openat, open_by_handle_at, truncate, and ftruncate system calls.

  Audit records tailored to organizational security and mission needs are essential for incident investigation and attribution, and can be produced from various system components such as modules or policy filters. Because system call rules affect performance, they should be used only when necessary and combined whenever possible to minimize the performance impact.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_20:
      - UBTU-20-010155
      ubuntu_22:
      - UBTU-22-654165
      ubuntu_24:
      - UBTU-24-900160
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | auditctl -l | grep -F "creat" | grep -F "open" | grep -F "openat" | grep -F "open_by_handle_at" | grep -F "truncate" | grep -F "ftruncate" | grep -E "\-a always,exit -F arch=\S* -S .* -F exit=-(EPERM|EACCES) -F auid>=1000 -F auid!=-1 -F" | wc -l
        result:
          integer: 4
      fix:
        shell: echo -e "-a always,exit -F arch=b32 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=-1 -F key=perm_access\n-a always,exit -F arch=b32 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=-1 -F key=perm_access\n-a always,exit -F arch=b64 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=-1 -F key=perm_access\n-a always,exit -F arch=b64 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=-1 -F key=perm_access" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
