id: audit_monitor_creat_open_truncate_syscalls
title: Ubuntu must generate audit records for successful/unsuccessful uses
  of the creat, open, openat, open_by_handle_at, truncate, and ftruncate system calls.
discussion: >
  Audit records tailored to organizational security and mission needs are
  essential for incident investigation and attribution, and can be produced from
  various system components such as modules or policy filters. Because system-
  call rules affect performance, they should be used only when necessary and combined
  whenever possible to minimize the performance impact.
references:
  nist:
    800-53r5:
    - AU-12 c
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_2004:
      - UBTU-20-010155
      ubuntu_2204:
      - UBTU-22-654165
      ubuntu_2404:
      - UBTU-24-900160
enforcement_info:
  enforcement_type: full
  check:
    shell: auditctl -l | grep -E "\-a always,exit -F arch=\S* -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-(EPERM|EACCES) -F auid>=1000 -F auid!=-1 -F" | wc -l
    standard_output: "4"
  fix:
    shell: echo -e "-a always,exit -F arch=b32 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=-1 -F key=perm_access\n-a always,exit -F arch=b32 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=-1 -F key=perm_access\n-a always,exit -F arch=b64 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=-1 -F key=perm_access\n-a always,exit -F arch=b64 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=-1 -F key=perm_access" >> /etc/audit/rules.d/stig.rules && augenrules --load
platforms:
- name: ubuntu_2004
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
tags:
- testing
