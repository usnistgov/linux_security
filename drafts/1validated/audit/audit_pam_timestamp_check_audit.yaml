id: audit_pam_timestamp_check_audit
title: Ubuntu must generate audit records for successful/unsuccessful uses
  of the pam_timestamp_check command.
discussion: Without audit records tailored to the organization's security and mission
  needs, it is difficult to establish, correlate, and investigate incidents or identify
  responsible parties. Audit records can be generated from various system components
  such as modules or policy filters.
references:
  nist:
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_2004:
      - UBTU-20-010178
      ubuntu_2204:
      - UBTU-22-654075
      ubuntu_2404:
      - UBTU-24-900330
enforcement_info:
  enforcement_type: full
  check:
    shell: auditctl -l | grep -q "\-a always,exit -S all -F path=/usr/sbin/pam_timestamp_check -F perm=x -F auid>=1000 -F auid!=-1"
    status_code: 0
  fix:
    shell: echo "-a always,exit -F path=/usr/sbin/pam_timestamp_check -F perm=x -F auid>=1000 -F auid!=unset -k privileged-pam_timestamp_check" >> /etc/audit/rules.d/stig.rules && augenrules --load
platforms:
- name: ubuntu_2004
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2204
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
- name: ubuntu_2404
  benchmarks:
  - name: disa_stig
    severity: medium
  enforcement_info:
    enforcement_type: inherit
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
