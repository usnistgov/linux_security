id: audit_chcon_command
title: Authorized chcon Command Execution Events
discussion: 
  The system must generate audit records for successful/unsuccessful uses of the chcon command.

  Without audit records tailored to the organization's security and mission needs, it is difficult to establish, correlate, investigate incidents, or identify responsible parties. These records can be generated from various system components, such as modules or policy filters.
references:
  nist:
    cce:
      ubuntu_20:
      - CCE-XXXXX-X
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - AU-12
  disa:
    cci:
    - CCI-000172
    srg:
    - SRG-OS-000064-GPOS-00033
    disa_stig:
      ubuntu_20:
      - UBTU-20-010175
      ubuntu_22:
      - UBTU-22-654025
      ubuntu_24:
      - UBTU-24-900210
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: auditctl -l | grep -q "\-a always,exit -S all -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F auid!=-1"
        result:
          exit_code: 0
      fix:
        shell: echo "-a always,exit -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng" >> /etc/audit/rules.d/stig.rules && augenrules --load
    '20.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: medium
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
