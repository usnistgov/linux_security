id: services_remove_systemd_timesyncd_package
title: Ubuntu must not have the "systemd-timesyncd" package installed.
discussion: Inaccurate timestamps hinder event correlation and analysis, making correct
  time determination essential for forensic investigations. Organizations must account
  for endpoints lacking regular access to authoritative time servers, such as mobile
  or tactical devices.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-06
  disa:
    cci:
    - CCI-000366
    srg:
    - SRG-OS-000480-GPOS-00227
    disa_stig:
      ubuntu_22:
      - UBTU-22-215020
      ubuntu_24:
      - UBTU-24-100010
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: dpkg -l systemd-timesyncd
        result:
          exit_code: 1
      fix:
        shell: apt purge -y systemd-timesyncd
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: low
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: low
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
