id: services_ensure_telnet_not_installed
title: Ubuntu must not have the "telnet" package installed.
discussion: >
  Unnecessary default services expand the attack surface, and Telnet-
  an unencrypted remote access protocol-can expose passwords and session data
  if enabled. Removing the telnetd package lowers the risk of accidental or intentional
  Telnet activation.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - IA-05(01)
  disa:
    cci:
    - CCI-000197
    srg:
    - SRG-OS-000074-GPOS-00042
    disa_stig:
      ubuntu_22:
      - UBTU-22-215035
      ubuntu_24:
      - UBTU-24-100030
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: dpkg -l telnetd
        result:
          exit_code: 1
      fix:
        shell: apt purge -y telnetd
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: high
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
