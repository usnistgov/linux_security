id: services_disable_unnecessary_nfs_server
title: Ubuntu must not have the nfs-kernel-server package installed.
discussion: Operating systems should not install unnecessary default functionality,
  as unneeded services increase the attack surface and risk. Examples include games,
  tools, and demo software not required for mission objectives.
references:
  nist:
    cce:
      ubuntu_22:
      - CCE-XXXXX-X
      ubuntu_24:
      - CCE-XXXXX-X
    800-53r5:
    - CM-07
  disa:
    cci:
    - CCI-000381
    srg:
    - SRG-OS-000095-GPOS-00049
    disa_stig:
      ubuntu_22:
      - UBTU-22-215040
      ubuntu_24:
      - UBTU-24-100050
platforms:
  ubuntu:
    enforcement_info:
      check:
        shell: dpkg -l nfs-kernel-server
        result:
          exit_code: 1
      fix:
        shell: apt purge -y nfs-kernel-server
    '22.04':
      benchmarks:
      - name: disa_stig
        severity: medium
    '24.04':
      benchmarks:
      - name: disa_stig
        severity: high
tags:
- 800-53r5_low
- 800-53r5_moderate
- 800-53r5_high
