id: services_package_openldap_servers_removed
title: Uninstall openldap-servers Package
discussion: |
  Unnecessary packages should not be installed to decrease the attack
  surface of the system.  While this software is clearly essential on an LDAP
  server, it is not necessary on typical desktop or workstation systems.
references:
  disa:
    cci:
      - CCI-000366
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      'rhel_8':
        - CCE-82415-1
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove openldap-servers
        #      from the system, and may remove any packages
        #      that depend on openldap-servers. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "openldap-servers" ; then
        yum remove -y "openldap-servers"
        fi

        ---
    '9':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove openldap-servers
        #      from the system, and may remove any packages
        #      that depend on openldap-servers. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "openldap-servers" ; then
        dnf remove -y --noautoremove "openldap-servers"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove slapd
        #      from the system, and may remove any packages
        #      that depend on slapd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "slapd"

        ---
    '2204':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove slapd
        #      from the system, and may remove any packages
        #      that depend on slapd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "slapd"

        ---
    '2404':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove slapd
        #      from the system, and may remove any packages
        #      that depend on slapd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "slapd"

        ---
