id: services_package_vsftpd_removed
title: Uninstall vsftpd Package
discussion: |
  Removing the vsftpd package decreases the risk of its
  accidental activation.
references:
  disa:
    cci:
      - CCI-000197
      - CCI-000366
      - CCI-000381
    srg:
      - SRG-OS-000074-GPOS-00042
      - SRG-OS-000095-GPOS-00049
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '8':
        - RHEL-08-040360
      '9':
        - RHEL-09-215015
  nist:
    800-53r4:
      - CM-6
      - CM-7
      - CM-7.1
      - IA-5
    cce:
      '10':
        - CCE-88674-7
      '8':
        - CCE-82414-4
      '9':
        - CCE-84159-3
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove vsftpd
        #      from the system, and may remove any packages
        #      that depend on vsftpd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "vsftpd" ; then
        dnf remove -y --noautoremove "vsftpd"
        fi

        ---
    '8':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove vsftpd
        #      from the system, and may remove any packages
        #      that depend on vsftpd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "vsftpd" ; then
        yum remove -y "vsftpd"
        fi

        ---
    '9':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove vsftpd
        #      from the system, and may remove any packages
        #      that depend on vsftpd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "vsftpd" ; then
        dnf remove -y --noautoremove "vsftpd"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove vsftpd
        #      from the system, and may remove any packages
        #      that depend on vsftpd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "vsftpd"

        ---
    '2204':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
