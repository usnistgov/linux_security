id: services_chronyd_specify_remote_server
title: A remote time server for Chrony is configured
discussion: |
  If chrony is in use on the system proper configuration is vital to ensuring time synchronization is working properly.
references:
  disa:
    cci:
      - CCI-001890
      - CCI-004923
      - CCI-004926
    srg:
      - SRG-OS-000355-GPOS-00143
    disa_stig:
      'rhel_8':
        - RHEL-08-030740
      'rhel_9':
        - RHEL-09-252020
  nist:
    800-53r5:
      - AU-8
      - AU-12(1)
      - SC-45(1)
    cce:
      'rhel_10':
        - CCE-86811-7
      'rhel_8':
        - CCE-82873-1
      'rhel_9':
        - CCE-84218-7
os_specifics:
  rhel:
    enforcement_info:
      check: ---- NEEDS CHECK ----
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel && { rpm --quiet -q chrony; }; then

        var_multiple_time_servers=''


        config_file="/etc/chrony.conf"

        if ! grep -q '^[[:space:]]*\(server\|pool\)[[:space:]]\+[[:graph:]]\+' "$config_file" ; then
          if ! grep -q '#[[:space:]]*server' "$config_file" ; then
            for server in $(echo "$var_multiple_time_servers" | tr ',' '\n') ; do
              printf '\nserver %s' "$server" >> "$config_file"
            done
          else
            sed -i 's/#[ \t]*server/server/g' "$config_file"
          fi
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---    
    '10':
      benchmarks:
        - name: disa_stig
          severity: medium
    '8':
      benchmarks:
        - name: disa_stig
          severity: medium
    '9':
      benchmarks:
        - name: disa_stig
          severity: medium
  ubuntu:
    enforcement_info:
      check: --- NEEDS CHECK ----
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed && { dpkg-query --show --showformat='${db:Status-Status}\n' 'chrony' 2>/dev/null | grep -q '^installed'; }; then

        var_multiple_time_servers=''


        config_file="/etc/chrony/chrony.conf"

        if ! grep -q '^[[:space:]]*\(server\|pool\)[[:space:]]\+[[:graph:]]\+' "$config_file" ; then
          if ! grep -q '#[[:space:]]*server' "$config_file" ; then
            for server in $(echo "$var_multiple_time_servers" | tr ',' '\n') ; do
              printf '\nserver %s' "$server" >> "$config_file"
            done
          else
            sed -i 's/#[ \t]*server/server/g' "$config_file"
          fi
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2004':
      benchmarks:
        - name: disa_stig
          severity: medium
    '2204':
      benchmarks:
        - name: disa_stig
          severity: medium
tags:
  - 800-53r5_high
  - 800-53r5_low
  - 800-53r5_moderate
