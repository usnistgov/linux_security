id: services_package_dhcp_removed
title: Uninstall DHCP Server Package
discussion: |
  Removing the DHCP server ensures that it cannot be easily or
  accidentally reactivated and disrupt network operation.
references:
  disa:
    cci:
      - CCI-000366
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      'rhel_8':
        - CCE-83385-5
      'rhel_9':
        - CCE-84240-1
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove dhcp-server
        #      from the system, and may remove any packages
        #      that depend on dhcp-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "dhcp-server" ; then
        yum remove -y "dhcp-server"
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove dhcp-server
        #      from the system, and may remove any packages
        #      that depend on dhcp-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "dhcp-server" ; then
        dnf remove -y --noautoremove "dhcp-server"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove isc-dhcp-server
        #      from the system, and may remove any packages
        #      that depend on isc-dhcp-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "isc-dhcp-server"

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove isc-dhcp-server
        #      from the system, and may remove any packages
        #      that depend on isc-dhcp-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "isc-dhcp-server"

        ---
    '2404':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove isc-dhcp-server
        #      from the system, and may remove any packages
        #      that depend on isc-dhcp-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "isc-dhcp-server"

        ---
