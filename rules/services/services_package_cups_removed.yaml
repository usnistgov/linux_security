id: services_package_cups_removed
title: Uninstall CUPS Package
discussion: |
  If the system does not need to print jobs or accept print jobs from other systems, it is
  recommended that CUPS be removed to reduce the potential attack surface.
references:
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      '8':
        - CCE-86299-5
      '9':
        - CCE-86300-1
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cups
        #      from the system, and may remove any packages
        #      that depend on cups. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "cups" ; then
        yum remove -y "cups"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cups
        #      from the system, and may remove any packages
        #      that depend on cups. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "cups" ; then
        dnf remove -y --noautoremove "cups"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cups
        #      from the system, and may remove any packages
        #      that depend on cups. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "cups"

        ---
    '2204':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cups
        #      from the system, and may remove any packages
        #      that depend on cups. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "cups"

        ---
    '2404':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cups
        #      from the system, and may remove any packages
