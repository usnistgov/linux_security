id: services_package_avahi_removed
title: Uninstall avahi Server Package
discussion: |
  Automatic discovery of network services is not normally required for
  system functionality. It is recommended to remove this package to reduce
  the potential attack surface.
references:
  disa:
    cci:
      - CCI-000366
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      'rhel_8':
        - CCE-86512-1
      'rhel_9':
        - CCE-86513-9
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove avahi
        #      from the system, and may remove any packages
        #      that depend on avahi. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "avahi" ; then
        yum remove -y "avahi"
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove avahi
        #      from the system, and may remove any packages
        #      that depend on avahi. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "avahi" ; then
        dnf remove -y --noautoremove "avahi"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove avahi-daemon
        #      from the system, and may remove any packages
        #      that depend on avahi-daemon. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "avahi-daemon"

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove avahi-daemon
        #      from the system, and may remove any packages
        #      that depend on avahi-daemon. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "avahi-daemon"

        ---
    '2404':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove avahi-daemon
        #      from the system, and may remove any packages
        #      that depend on avahi-daemon. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "avahi-daemon"

        ---
