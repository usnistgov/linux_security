id: services_package_nginx_removed
title: Uninstall nginx Package
discussion: |
  If there is no need to make the web server software available,
  removing it provides a safeguard against its activation.
references:
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      'rhel_10':
        - CCE-89648-0
      'rhel_8':
        - CCE-88034-4
      'rhel_9':
        - CCE-88035-1
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove nginx
        #      from the system, and may remove any packages
        #      that depend on nginx. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "nginx" ; then
        dnf remove -y --noautoremove "nginx"
        fi

        ---
    '8':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove nginx
        #      from the system, and may remove any packages
        #      that depend on nginx. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "nginx" ; then
        yum remove -y "nginx"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove nginx
        #      from the system, and may remove any packages
        #      that depend on nginx. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "nginx" ; then
        dnf remove -y --noautoremove "nginx"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove nginx
        #      from the system, and may remove any packages
        #      that depend on nginx. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "nginx"

        ---
    '2204':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
