id: services_package_talk_removed
title: Uninstall talk Package
discussion: |
  The talk software presents a security risk as it uses unencrypted protocols
  for communications. Removing the talk package decreases the
  risk of the accidental (or intentional) activation of talk client program.
references:
  nist:
    cce:
      'rhel_8':
        - CCE-80848-5
      'rhel_9':
        - CCE-84157-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove talk
        #      from the system, and may remove any packages
        #      that depend on talk. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "talk" ; then
        yum remove -y "talk"
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove talk
        #      from the system, and may remove any packages
        #      that depend on talk. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "talk" ; then
        dnf remove -y --noautoremove "talk"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove talk
        #      from the system, and may remove any packages
        #      that depend on talk. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "talk"

        ---
    '2204':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove talk
        #      from the system, and may remove any packages
        #      that depend on talk. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "talk"

        ---
    '2404':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove talk
        #      from the system, and may remove any packages
        #      that depend on talk. Execute this
        #      remediation AFTER testing on a non-production
