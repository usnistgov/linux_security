id: services_package_chrony_installed
title: The Chrony package is installed
discussion: |
  Time synchronization is important to support time sensitive security mechanisms like
  Kerberos and also ensures log files have consistent time records across the enterprise,
  which aids in forensic investigations.
references:
  disa:
    cci:
      - CCI-004923
    srg:
      - SRG-OS-000355-GPOS-00143
    disa_stig:
      'rhel_9':
        - RHEL-09-252010
      'ubuntu_2004':
        - UBTU-20-010435
      'ubuntu_2204':
        - UBTU-22-215015
  nist:
    cce:
      'rhel_10':
        - CCE-89591-2
      'rhel_8':
        - CCE-82874-9
      'rhel_9':
        - CCE-84215-3
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "chrony" ; then
            dnf install -y "chrony"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '8':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "chrony" ; then
            yum install -y "chrony"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "chrony" ; then
            dnf install -y "chrony"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "chrony"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "chrony"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2404':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        var_timesync_service=''



          if [ $var_timesync_service == chronyd ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y "chrony"
          fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
