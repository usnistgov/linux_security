id: services_package_cyrus_imapd_removed
title: Uninstall cyrus-imapd Package
discussion: |
  If there is no need to make the cyrus-imapd software available,
  removing it provides a safeguard against its activation.
references:
  nist:
    cce:
      '10':
        - CCE-90156-1
      '8':
        - CCE-88119-3
      '9':
        - CCE-88120-1
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cyrus-imapd
        #      from the system, and may remove any packages
        #      that depend on cyrus-imapd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "cyrus-imapd" ; then
        dnf remove -y --noautoremove "cyrus-imapd"
        fi

        ---
    '8':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cyrus-imapd
        #      from the system, and may remove any packages
        #      that depend on cyrus-imapd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "cyrus-imapd" ; then
        yum remove -y "cyrus-imapd"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cyrus-imapd
        #      from the system, and may remove any packages
        #      that depend on cyrus-imapd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "cyrus-imapd" ; then
        dnf remove -y --noautoremove "cyrus-imapd"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cyrus-imapd
        #      from the system, and may remove any packages
        #      that depend on cyrus-imapd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "cyrus-imapd"

        ---
    '2204':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove cyrus-imapd
        #      from the system, and may remove any packages
        #      that depend on cyrus-imapd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "cyrus-imapd"

        ---
