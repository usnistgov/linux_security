id: services_package_telnetd_removed
title: Uninstall the telnet server
discussion: |
  telnet allows clear text communications, and does not protect
  any data transmission between client and server. Any confidential data
  can be listened and no integrity checking is made.'
references:
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      'rhel_8':
        - CCE-83302-0
  disa:
    disa_stig:
      'ubuntu_2004':
        - UBTU-20-010405
      'ubuntu_2204':
        - UBTU-22-215035
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: high
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove telnetd
        #      from the system, and may remove any packages
        #      that depend on telnetd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "telnetd" ; then
        yum remove -y "telnetd"
        fi

        ---
    '9':
      severity: high
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove telnetd
        #      from the system, and may remove any packages
        #      that depend on telnetd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "telnetd" ; then
        dnf remove -y --noautoremove "telnetd"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove telnetd
        #      from the system, and may remove any packages
        #      that depend on telnetd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "telnetd"

        ---
    '2204':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove telnetd
        #      from the system, and may remove any packages
        #      that depend on telnetd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "telnetd"

        ---
tags:
  - 800-53r4_high
  - 800-53r4_low
  - 800-53r4_moderate
