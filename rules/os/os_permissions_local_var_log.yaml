id: os_permissions_local_var_log
title: Verify permissions of log files
discussion: |
  The Ubuntu 20.04 must generate error messages that provide information
  necessary for corrective actions without revealing information that could
  be exploited by adversaries.
references:
  disa:
    cci:
      - CCI-001312
    srg:
      - SRG-OS-000205-GPOS-00083
    disa_stig:
      'ubuntu_2004':
        - UBTU-20-010416
      'ubuntu_2204':
        - UBTU-22-232026
  nist:
    800-53r4:
      - SI-11
      - SI-11.1
os_specifics:
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        find  /var/log/  -perm /u+xs,g+xws,o+xwrt ! -name 'history.log' ! -name 'eipp.log.xz' ! -name '*[bw]tmp' ! -name '*lastlog' -type f -regextype posix-extended -regex '.*' -exec chmod u-xs,g-xws,o-xwrt {} \;

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        find  /var/log/  -perm /u+xs,g+xws,o+xwrt ! -name 'history.log' ! -name 'eipp.log.xz' ! -name '*[bw]tmp' ! -name '*lastlog' -type f -regextype posix-extended -regex '.*' -exec chmod u-xs,g-xws,o-xwrt {} \;

        ---
tags:
  - 800-53r4_high
  - 800-53r4_moderate
