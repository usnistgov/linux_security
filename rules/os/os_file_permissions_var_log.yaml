id: os_file_permissions_var_log
title: Verify Permissions on /var/log Directory
discussion: |
  The /var/log directory contains files with logs of error
  messages in the system and should only be accessed by authorized
  personnel.
references:
  disa:
    cci:
      - CCI-001314
    srg:
      - SRG-OS-000206-GPOS-00084
    disa_stig:
      '8':
        - RHEL-08-010240
      '9':
        - RHEL-09-232025
      '2004':
        - UBTU-20-010419
      '2204':
        - UBTU-22-232025
  nist:
    cce:
      '10':
        - CCE-89801-5
      '8':
        - CCE-83663-5
      '9':
        - CCE-83917-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        find -H /var/log/ -maxdepth 1 -perm /u+s,g+ws,o+wt -type d -exec chmod u-s,g-ws,o-wt {} \;

        ---
    '8':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        find -H /var/log/ -maxdepth 1 -perm /u+s,g+ws,o+wt -type d -exec chmod u-s,g-ws,o-wt {} \;

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        find -H /var/log/ -maxdepth 1 -perm /u+s,g+ws,o+wt -type d -exec chmod u-s,g-ws,o-wt {} \;

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        chmod 0755 /var/log/

        if grep -q "^z \/var\/log " /usr/lib/tmpfiles.d/00rsyslog.conf; then
            sed -i --follow-symlinks "s/\(^z[[:space:]]\+\/var\/log[[:space:]]\+\)\(\([[:digit:]]\+\)[^ $]*\)/\10755/" /usr/lib/tmpfiles.d/00rsyslog.conf
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        chmod 0755 /var/log/

        if grep -q "^z \/var\/log " /usr/lib/tmpfiles.d/00rsyslog.conf; then
            sed -i --follow-symlinks "s/\(^z[[:space:]]\+\/var\/log[[:space:]]\+\)\(\([[:digit:]]\+\)[^ $]*\)/\10755/" /usr/lib/tmpfiles.d/00rsyslog.conf
        fi

        ---
