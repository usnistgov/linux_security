id: os_file_permissions_backup_etc_passwd
title: Verify Permissions on Backup passwd File
discussion: |
  The /etc/passwd- file is a backup file of /etc/passwd, and as such,
  it contains information about the users that are configured on the system.
  Protection of this file is critical for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232080
  nist:
    800-53r4:
      - 'AC-6 '
    cce:
      '10':
        - CCE-86854-7
      '8':
        - CCE-83332-7
      '9':
        - CCE-83940-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        chmod u-xs,g-xws,o-xwt /etc/passwd-

        ---
