id: os_file_permissions_cron_d
title: Verify Permissions on cron.d
discussion: |
  Service configuration files enable or disable features of their respective services that if configured incorrectly
  can lead to insecure and vulnerable configurations. Therefore, service configuration files should have the
  correct access rights to prevent unauthorized changes.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      'rhel_9':
        - RHEL-09-232040
  nist:
    800-53r4:
      - AC-6
      - CM-6
    cce:
      'rhel_10':
        - CCE-86651-7
      'rhel_8':
        - CCE-82277-5
      'rhel_9':
        - CCE-84183-3
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        find -H /etc/cron.d/ -maxdepth 1 -perm /u+s,g+xwrs,o+xwrt -type d -exec chmod u-s,g-xwrs,o-xwrt {} \;

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
