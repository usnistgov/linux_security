id: os_file_owner_etc_passwd
title: Verify User Who Owns passwd File
discussion: |
  The /etc/passwd file contains information about the users that are configured on
  the system. Protection of this file is critical for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      'rhel_9':
        - RHEL-09-232130
  nist:
    800-53r4:
      - AC-6
      - CM-6
    cce:
      'rhel_10':
        - CCE-87827-2
      'rhel_8':
        - CCE-80803-0
      'rhel_9':
        - CCE-83943-1
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        chown 0 /etc/passwd

        ---
    '8':
      severity: medium
      benchmarks:
        - disa_stig
