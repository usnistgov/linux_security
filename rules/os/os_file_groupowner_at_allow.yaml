id: os_file_groupowner_at_allow
title: Verify Group Who Owns /etc/at.allow file
discussion: |
  If the owner of the at.allow file is not set to root, the possibility exists for an
  unauthorized user to view or edit sensitive information.
references:
  nist:
    cce:
      'rhel_10':
        - CCE-90598-4
      'rhel_8':
        - CCE-87102-0
      'rhel_9':
        - CCE-87103-8
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        chgrp 0 /etc/at.allow

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
