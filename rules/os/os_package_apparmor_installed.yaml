id: os_package_apparmor_installed
title: Ensure AppArmor is installed
discussion: |
  Without a Mandatory Access Control system installed only the default
  Discretionary Access Control system will be available.
references:
  disa:
    cci:
      - CCI-001764
      - CCI-001774
      - CCI-002165
      - CCI-002235
    srg:
      - SRG-OS-000312-GPOS-00122
      - SRG-OS-000312-GPOS-00123
      - SRG-OS-000312-GPOS-00124
      - SRG-OS-000324-GPOS-00125
      - SRG-OS-000368-GPOS-00154
      - SRG-OS-000370-GPOS-00155
    disa_stig:
      'ubuntu_2004':
        - UBTU-20-010439
      'ubuntu_2204':
        - UBTU-22-431010
os_specifics:
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if [ ! -f /.dockerenv ] && [ ! -f /run/.containerenv ]; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "apparmor"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if [ ! -f /.dockerenv ] && [ ! -f /run/.containerenv ]; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "apparmor"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2404':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if [ ! -f /.dockerenv ] && [ ! -f /run/.containerenv ]; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "apparmor"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
