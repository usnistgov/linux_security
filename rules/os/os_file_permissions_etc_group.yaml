id: os_file_permissions_etc_group
title: Verify Permissions on group File
discussion: |
  The /etc/group file contains information regarding groups that are configured
  on the system. Protection of this file is important for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232055
  nist:
    800-53r4:
      - AC-6
      - CM-6
    cce:
      '10':
        - CCE-88868-5
      '8':
        - CCE-80810-5
      '9':
        - CCE-83934-0
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        chmod u-xs,g-xws,o-xwt /etc/group

        ---
