id: os_kernel_module_sctp_disabled
title: Disable SCTP Support
discussion: |
  Disabling SCTP protects
  the system against exploitation of any flaws in its implementation.
references:
  disa:
    cci:
      - CCI-000381
    srg:
      - SRG-OS-000095-GPOS-00049
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      'rhel_8':
        - RHEL-08-040023
      'rhel_9':
        - RHEL-09-213060
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      'rhel_10':
        - CCE-90489-6
      'rhel_8':
        - CCE-80834-5
      'rhel_9':
        - CCE-84139-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if LC_ALL=C grep -q -m 1 "^install sctp" /etc/modprobe.d/sctp.conf ; then

           sed -i 's#^install sctp.*#install sctp /bin/false#g' /etc/modprobe.d/sctp.conf
        else
           echo -e "\n# Disable per security requirements" >> /etc/modprobe.d/sctp.conf
           echo "install sctp /bin/false" >> /etc/modprobe.d/sctp.conf
        fi

        if ! LC_ALL=C grep -q -m 1 "^blacklist sctp$" /etc/modprobe.d/sctp.conf ; then
           echo "blacklist sctp" >> /etc/modprobe.d/sctp.conf
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
