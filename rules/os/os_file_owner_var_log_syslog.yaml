id: os_file_owner_var_log_syslog
title: Verify User Who Owns /var/log/syslog File
discussion: |
  The /var/log/syslog file contains logs of error messages in
  the system and should only be accessed by authorized personnel.
references:
  disa:
    cci:
      - CCI-001314
    srg:
      - SRG-OS-000206-GPOS-00084
    disa_stig:
      '2004':
        - UBTU-20-010421
      '2204':
        - UBTU-22-232130
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        chown 104 /var/log/syslog

        ---
