id: os_disable_users_coredumps
title: Disable Core Dumps for All Users
discussion: |
  A core dump includes a memory image taken at the time the operating system
  terminates an application. The memory image could contain sensitive data and is generally useful
  only for developers trying to debug problems.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      'rhel_8':
        - RHEL-08-010673
      'rhel_9':
        - RHEL-09-213095
  nist:
    800-53r4:
      - CM-6
      - SC-7
    cce:
      'rhel_10':
        - CCE-88330-6
      'rhel_8':
        - CCE-81038-2
      'rhel_9':
        - CCE-83980-3
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q pam; then

        SECURITY_LIMITS_FILE="/etc/security/limits.conf"

        if grep -qE '^\s*\*\s+hard\s+core' $SECURITY_LIMITS_FILE; then
                sed -ri 's/(hard\s+core\s+)[[:digit:]]+/\1 0/' $SECURITY_LIMITS_FILE
        else
                echo "*     hard   core    0" >> $SECURITY_LIMITS_FILE
        fi

        if ls /etc/security/limits.d/*.conf > /dev/null; then
                sed -ri '/^\s*\*\s+hard\s+core/d' /etc/security/limits.d/*.conf
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

