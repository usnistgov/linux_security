id: os_package_gdm_removed
title: Remove the GDM Package Group
discussion: |
  Unnecessary service packages must not be installed to decrease the attack surface of the system.
  A graphical environment is unnecessary for certain types of systems including a virtualization
  hypervisor.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      'rhel_10':
        - CCE-88880-0
      'rhel_8':
        - CCE-82367-4
      'rhel_9':
        - CCE-83549-6
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q gdm; then

        # CAUTION: This remediation script will remove gdm
        #      from the system, and may remove any packages
        #      that depend on gdm. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "gdm" ; then
        dnf remove -y --noautoremove "gdm"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '8':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q gdm; then

        # CAUTION: This remediation script will remove gdm
        #      from the system, and may remove any packages
        #      that depend on gdm. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "gdm" ; then
        yum remove -y "gdm"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q gdm; then

        # CAUTION: This remediation script will remove gdm
        #      from the system, and may remove any packages
        #      that depend on gdm. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "gdm" ; then
        dnf remove -y --noautoremove "gdm"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}\n' 'gdm3' 2>/dev/null | grep -q '^installed'; then

        # CAUTION: This remediation script will remove gdm3
        #      from the system, and may remove any packages
        #      that depend on gdm3. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "gdm3"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
