id: os_file_groupowner_backup_etc_gshadow
title: Verify Group Who Owns Backup gshadow File
discussion: |
  The /etc/gshadow- file is a backup of /etc/gshadow, and as such,
  it contains group password hashes. Protection of this file is critical for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232125
  nist:
    800-53r4:
      - 'AC-6 '
    cce:
      '10':
        - CCE-88453-6
      '8':
        - CCE-83535-5
      '9':
        - CCE-83951-4
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        chgrp 0 /etc/gshadow-

        ---
