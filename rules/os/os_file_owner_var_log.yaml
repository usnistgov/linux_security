id: os_file_owner_var_log
title: Verify User Who Owns /var/log Directory
discussion: |
  The /var/log directory contains files with logs of error
  messages in the system and should only be accessed by authorized
  personnel.
references:
  disa:
    cci:
      - CCI-001314
    srg:
      - SRG-OS-000206-GPOS-00084
    disa_stig:
      '8':
        - RHEL-08-010250
      '9':
        - RHEL-09-232170
      '2004':
        - UBTU-20-010418
      '2204':
        - UBTU-22-232120
  nist:
    cce:
      '10':
        - CCE-86705-1
      '8':
        - CCE-83661-9
      '9':
        - CCE-83914-2
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        find -H /var/log/ -maxdepth 1 -type d -exec chown -L 0 {} \;

        ---
