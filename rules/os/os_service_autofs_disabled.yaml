id: os_service_autofs_disabled
title: Disable the Automounter
discussion: |
  Disabling the automounter permits the administrator to
  statically control filesystem mounting through /etc/fstab.


  Additionally, automatically mounting filesystems permits easy introduction of
  unknown devices, thereby facilitating malicious activity.
references:
  disa:
    cci:
      - CCI-000366
      - CCI-000778
      - CCI-001958
    srg:
      - SRG-OS-000114-GPOS-00059
      - SRG-OS-000378-GPOS-00163
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      'rhel_8':
        - RHEL-08-040070
      'rhel_9':
        - RHEL-09-231040
  nist:
    800-53r4:
      - CM-6
      - CM-7
      - MP-7
    cce:
      'rhel_10':
        - CCE-88947-7
      'rhel_8':
        - CCE-80873-3
      'rhel_9':
        - CCE-83850-8
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( rpm --quiet -q autofs && rpm --quiet -q kernel ); then

        SYSTEMCTL_EXEC='/usr/bin/systemctl'
        if [[ $("$SYSTEMCTL_EXEC" is-system-running) != "offline" ]]; then
          "$SYSTEMCTL_EXEC" stop 'autofs.service'
        fi
        "$SYSTEMCTL_EXEC" disable 'autofs.service'
        "$SYSTEMCTL_EXEC" mask 'autofs.service'
        # Disable socket activation if we have a unit file for it
        if "$SYSTEMCTL_EXEC" -q list-unit-files autofs.socket; then
            if [[ $("$SYSTEMCTL_EXEC" is-system-running) != "offline" ]]; then
              "$SYSTEMCTL_EXEC" stop 'autofs.socket'
            fi
            "$SYSTEMCTL_EXEC" mask 'autofs.socket'
        fi
        # The service may not be running because it has been started and failed,
        # so let's reset the state so OVAL checks pass.
        # Service should be 'inactive', not 'failed' after reboot though.
        "$SYSTEMCTL_EXEC" reset-failed 'autofs.service' || true

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

