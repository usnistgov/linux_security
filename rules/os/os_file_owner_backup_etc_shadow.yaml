id: os_file_owner_backup_etc_shadow
title: Verify Group Who Owns Backup shadow File
discussion: |
  The /etc/shadow- file is a backup file of /etc/shadow, and as such,
  it contains the list of local system accounts and password hashes.
  Protection of this file is critical for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      'rhel_9':
        - RHEL-09-232160
  nist:
    800-53r4:
      - 'AC-6 '
    cce:
      'rhel_10':
        - CCE-87502-1
      'rhel_8':
        - CCE-83413-5
      'rhel_9':
        - CCE-83949-8
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        chown 0 /etc/shadow-

