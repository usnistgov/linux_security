id: os_file_groupowner_var_log
title: Verify Group Who Owns /var/log Directory
discussion: |
  The /var/log directory contains files with logs of error
  messages in the system and should only be accessed by authorized
  personnel.
references:
  disa:
    cci:
      - CCI-001314
    srg:
      - SRG-OS-000206-GPOS-00084
    disa_stig:
      'rhel_8':
        - RHEL-08-010260
      'rhel_9':
        - RHEL-09-232175
      'ubuntu_2004':
        - UBTU-20-010417
      'ubuntu_2204':
        - UBTU-22-232125
  nist:
    cce:
      'rhel_10':
        - CCE-89035-0
      'rhel_8':
        - CCE-83659-3
      'rhel_9':
        - CCE-83912-6
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        find -H /var/log/ -maxdepth 1 -type d -exec chgrp -L 0 {} \;

        ---
    '8':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        find -H /var/log/ -maxdepth 1 -type d -exec chgrp -L 0 {} \;

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        find -H /var/log/ -maxdepth 1 -type d -exec chgrp -L 0 {} \;

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        find -H /var/log/ -maxdepth 1 -type d -exec chgrp -L 110 {} \;

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        find -H /var/log/ -maxdepth 1 -type d -exec chgrp -L syslog {} \;

        ---
tags:
