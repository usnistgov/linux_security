id: os_file_groupowner_etc_group
title: Verify Group Who Owns group File
discussion: |
  The /etc/group file contains information regarding groups that are configured
  on the system. Protection of this file is important for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      'rhel_9':
        - RHEL-09-232095
  nist:
    800-53r4:
      - AC-6
      - CM-6
    cce:
      'rhel_10':
        - CCE-90261-9
      'rhel_8':
        - CCE-80796-6
      'rhel_9':
        - CCE-83945-6
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        chgrp 0 /etc/group

        ---
