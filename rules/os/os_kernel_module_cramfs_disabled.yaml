id: os_kernel_module_cramfs_disabled
title: Disable Mounting of cramfs
discussion: |
  Removing support for unneeded filesystem types reduces the local attack surface
  of the server.
references:
  disa:
    cci:
      - CCI-000381
    srg:
      - SRG-OS-000095-GPOS-00049
    disa_stig:
      '8':
        - RHEL-08-040025
      '9':
        - RHEL-09-231195
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      '8':
        - CCE-81031-7
      '9':
        - CCE-83853-2
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if LC_ALL=C grep -q -m 1 "^install cramfs" /etc/modprobe.d/cramfs.conf ; then

           sed -i 's#^install cramfs.*#install cramfs /bin/false#g' /etc/modprobe.d/cramfs.conf
        else
           echo -e "\n# Disable per security requirements" >> /etc/modprobe.d/cramfs.conf
           echo "install cramfs /bin/false" >> /etc/modprobe.d/cramfs.conf
        fi

        if ! LC_ALL=C grep -q -m 1 "^blacklist cramfs$" /etc/modprobe.d/cramfs.conf ; then
           echo "blacklist cramfs" >> /etc/modprobe.d/cramfs.conf
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '9':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
