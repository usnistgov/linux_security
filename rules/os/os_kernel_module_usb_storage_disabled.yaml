id: os_kernel_module_usb_storage_disabled
title: Disable Modprobe Loading of USB Storage Driver
discussion: |
  USB storage devices such as thumb drives can be used to introduce
  malicious software.
references:
  disa:
    cci:
      - CCI-000778
      - CCI-001958
      - CCI-003959
    srg:
      - SRG-OS-000114-GPOS-00059
      - SRG-OS-000378-GPOS-00163
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '8':
        - RHEL-08-040080
      '9':
        - RHEL-09-291010
      '2004':
        - UBTU-20-010461
      '2204':
        - UBTU-22-291010
  nist:
    800-53r4:
      - CM-6
      - CM-7
      - MP-7
    cce:
      '10':
        - CCE-89301-6
      '8':
        - CCE-80835-2
      '9':
        - CCE-83851-6
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if LC_ALL=C grep -q -m 1 "^install usb-storage" /etc/modprobe.d/usb-storage.conf ; then

           sed -i 's#^install usb-storage.*#install usb-storage /bin/false#g' /etc/modprobe.d/usb-storage.conf
        else
           echo -e "\n# Disable per security requirements" >> /etc/modprobe.d/usb-storage.conf
           echo "install usb-storage /bin/false" >> /etc/modprobe.d/usb-storage.conf
        fi

        if ! LC_ALL=C grep -q -m 1 "^blacklist usb-storage$" /etc/modprobe.d/usb-storage.conf ; then
           echo "blacklist usb-storage" >> /etc/modprobe.d/usb-storage.conf
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
