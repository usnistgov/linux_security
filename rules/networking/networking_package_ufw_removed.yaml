id: networking_package_ufw_removed
title: Remove ufw Package
discussion: |
  Running iptables.persistent with ufw enabled may lead
  to conflict and unexpected results.
references: {}
os_specifics:
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        # CAUTION: This remediation script will remove ufw
        #      from the system, and may remove any packages
        #      that depend on ufw. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "ufw"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        # CAUTION: This remediation script will remove ufw
        #      from the system, and may remove any packages
        #      that depend on ufw. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "ufw"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2404':
      severity: medium
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        # CAUTION: This remediation script will remove ufw
        #      from the system, and may remove any packages
        #      that depend on ufw. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        var_network_filtering_service=''



          if [ $var_network_filtering_service != ufw ]; then
            DEBIAN_FRONTEND=noninteractive apt-get remove -y "ufw"
          fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
