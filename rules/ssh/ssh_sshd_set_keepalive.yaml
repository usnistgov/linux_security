id: ssh_sshd_set_keepalive
title: Set SSH Client Alive Count Max
discussion: |
  This ensures a user login will be terminated as soon as the ClientAliveInterval
  is reached.
references:
  disa:
    cci:
      - CCI-001133
      - CCI-002361
    srg:
      - SRG-OS-000163-GPOS-00072
      - SRG-OS-000279-GPOS-00109
    disa_stig:
      'rhel_8':
        - RHEL-08-010200
      'rhel_9':
        - RHEL-09-255095
      'ubuntu_2004':
        - UBTU-20-010036
      'ubuntu_2204':
        - UBTU-22-255030
      'ubuntu_2404':
        - UBTU-24-600000
  nist:
    800-53r5:
      - SC-10
    cce:
      'rhel_8':
        - CCE-80907-9
      'rhel_9':
        - CCE-90805-3
      'rhel_10':
        - CCE-86794-5
os_specifics:
  rhel:
    enforcement_info:
      check: sshd -T | grep -q "clientalivecountmax $ODV"; echo $?
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        var_sshd_set_keepalive='$ODV'


        mkdir -p /etc/ssh/sshd_config.d
        touch /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf
        chmod 0600 /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf

        LC_ALL=C sed -i "/^\s*ClientAliveCountMax\s\+/Id" "/etc/ssh/sshd_config"
        LC_ALL=C sed -i "/^\s*ClientAliveCountMax\s\+/Id" "/etc/ssh/sshd_config.d"/*.conf
        if [ -e "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" ] ; then

            LC_ALL=C sed -i "/^\s*ClientAliveCountMax\s\+/Id" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        else
            touch "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        fi
        # make sure file has newline at the end
        sed -i -e '$a\' "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"

        cp "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"
        # Insert at the beginning of the file
        printf '%s\n' "ClientAliveCountMax $var_sshd_set_keepalive" > "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        cat "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak" >> "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        # Clean up after ourselves.
        rm "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '8':
      benchmarks:
        - name: disa_stig         
          severity: medium
        - name: cis_lvl1
        - name: cis_lvl2
    '9':
      benchmarks:
        - name: disa_stig         
          severity: medium
        - name: cis_lvl1
        - name: cis_lvl2
    '10':      
      benchmarks:
        - name: disa_stig         
          severity: medium
        - name: cis_lvl1
        - name: cis_lvl2
  ubuntu:
    enforcement_info:
      check: sshd -T | grep -q "clientalivecountmax $ODV"; echo $?
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        var_sshd_set_keepalive='$ODV'


        mkdir -p /etc/ssh/sshd_config.d
        touch /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf
        chmod 0600 /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf

        LC_ALL=C sed -i "/^\s*ClientAliveCountMax\s\+/Id" "/etc/ssh/sshd_config"
        LC_ALL=C sed -i "/^\s*ClientAliveCountMax\s\+/Id" "/etc/ssh/sshd_config.d"/*.conf
        if [ -e "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" ] ; then

            LC_ALL=C sed -i "/^\s*ClientAliveCountMax\s\+/Id" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        else
            touch "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        fi
        # make sure file has newline at the end
        sed -i -e '$a\' "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"

        cp "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"
        # Insert at the beginning of the file
        printf '%s\n' "ClientAliveCountMax $var_sshd_set_keepalive" > "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        cat "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak" >> "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        # Clean up after ourselves.
        rm "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '2004':
      benchmarks:
        - name: disa_stig
          severity: medium
        - name: cis_lvl1
        - name: cis_lvl2
    '2204':
      benchmarks:
        - name: disa_stig
          severity: medium
        - name: cis_lvl1
        - name: cis_lvl2
    '2404':
      benchmarks:
        - name: disa_stig         
          severity: medium
        - name: cis_lvl1
        - name: cis_lvl2
odv:
  hint:
    datatype: number
    description: Number of seconds, e.g. 0
    validation:
      min: 0
  recommended: 0
  cis_lvl1: 0
  cis_lvl2: 0
  stig: 0
tags:
  - 800-53r5_low
  - 800-53r5_moderate
  - client
  - server
