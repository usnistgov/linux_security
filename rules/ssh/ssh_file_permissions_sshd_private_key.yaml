id: ssh_file_permissions_sshd_private_key
title: Verify Permissions on SSH Server Private *_key Key Files
discussion: |
  If an unauthorized user obtains the private SSH host key file, the host could be impersonated. 

  SSH server private keys _MUST_ be owned by the user root and group root.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '8':
        - RHEL-08-010490
      '9':
        - RHEL-09-255120
  nist:
    800-53r5:
      - AC-6
      - CM-6
    cce:
      '8':
        - CCE-82424-3
      '9':
        - CCE-90820-2
      '10':
        - CCE-88018-7
os_specifics:
  rhel: 
    enforcement_info:
      check: /usr/bin/find /etc/ssh -maxdepth 1 -name "*_key" -type f \( ! -user root -o ! -group root \) | wc -l
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        for keyfile in /etc/ssh/*_key; do
            test -f "$keyfile" || continue
            if test root:root = "$(stat -c "%U:%G" "$keyfile")"; then

           chmod u-xs,g-xwrs,o-xwrt "$keyfile"


            else
                echo "Key-like file '$keyfile' is owned by an unexpected user:group combination"
            fi
        done

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '8':
      benchmarks:
        - name: disa_stig
          severity: medium
    '9':
      benchmarks:
        - name: disa_stig
          severity: medium
    '10': {}
  ubuntu:
    enforcement_info:
      check: /usr/bin/find /etc/ssh -maxdepth 1 -name "*_key" -type f \( ! -user root -o ! -group root \) | wc -l
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        for keyfile in /etc/ssh/*_key; do
            test -f "$keyfile" || continue
            if test root:root = "$(stat -c "%U:%G" "$keyfile")"; then

           chmod u-xs,g-xwrs,o-xwrt "$keyfile"


            else
                echo "Key-like file '$keyfile' is owned by an unexpected user:group combination"
            fi
        done

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '2004': {}
    '2204': {}
    '2404': {}
tags:
  - 800-53r5_high
  - 800-53r5_low
  - 800-53r5_moderate
  - client
  - server
