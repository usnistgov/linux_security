id: ssh_package_openssh_server_installed
title: Install the OpenSSH Server Package
discussion: |
  Without protection of the transmitted information, confidentiality, and integrity may be compromised because unprotected communications can be intercepted and either read or altered.
references:
  disa:
    cci:
      - CCI-002418
      - CCI-002420
      - CCI-002421
      - CCI-002422
    srg:
      - SRG-OS-000423-GPOS-00187
      - SRG-OS-000424-GPOS-00188
      - SRG-OS-000425-GPOS-00189
      - SRG-OS-000426-GPOS-00190
    disa_stig:
      '8':
        - RHEL-08-040159
      '9':
        - RHEL-09-255010
      '2004':
        - UBTU-20-010042
      '2204':
        - UBTU-22-255010
      '2404':
        -	UBTU-24-100800
  nist:
    800-53r5:
      - CM-6
    cce:
      '8':
        - CCE-83303-8
      '9':
        - CCE-90823-6
      '10':
        - CCE-89241-4
os_specifics:
  rhel:
    enforcement_info:
      check: /usr/bin/rpm --quiet -q "openssh-server"; echo $?
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "openssh-server" ; then
            dnf install -y "openssh-server"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '8':
      benchmarks:
        - name: disa_stig
          severity: medium
    '9':
      benchmarks:
        - name: disa_stig
          severity: medium
    '10': {}
  ubuntu:
    enforcement_info:
      check: /usr/bin/dpkg-query -W --showformat='${db:Status-Status}' openssh-server
      result: 
        string: "installed"
      fix: |
          # Remediation is applicable only in certain platforms
          if dpkg-query --show --showformat='${db:Status-Status}
          ' 'linux-base' 2>/dev/null | grep -q ^installed; then

          DEBIAN_FRONTEND=noninteractive apt-get install -y "openssh-servelir"

          else
              >&2 echo 'Remediation is not applicable, nothing was done'
          fi
    '2004':
      benchmarks:
        - name: disa_stig
          severity: medium
    '2204':
      benchmarks:
        - name: disa_stig
          severity: medium
    '2404': 
      benchmarks:
        - name: disa_stig
          severity: medium
tags:
  - 800-53r5_high
  - 800-53r5_low
  - 800-53r5_moderate
