id: ssh_service_sshd_enabled
title: Enable the OpenSSH Service
discussion: |
  Remote access sessions _MUST_ use encrypted methods to protect unauthorized individuals from gaining access.
  Without protection of the transmitted information, confidentiality, and integrity may be compromised because unprotected communications can be intercepted and either read or altered.
references:
  disa:
    cci:
      - CCI-002418
      - CCI-002420
      - CCI-002421
      - CCI-002422
    srg:
      - SRG-OS-000423-GPOS-00187
      - SRG-OS-000424-GPOS-00188
      - SRG-OS-000425-GPOS-00189
      - SRG-OS-000426-GPOS-00190
    disa_stig:
      '8':
        - RHEL-08-040160
      '9':
        - RHEL-09-255015
      '2004':
        - UBTU-20-010042
      '2204':
        - UBTU-22-255015
  nist:
    800-53r5:
      - IA-2(8)
      - AC-3
      - AC-17
      - SC-8
    cce:
      '10':
        - CCE-88621-8
      '8':
        - CCE-82426-8
      '9':
        - CCE-90822-8
os_specifics:
  rhel:
    enforcement_info:
      check: /bin/systemctl is-enabled sshd
      result: 
        string: "enabled"
      fix: |
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        SYSTEMCTL_EXEC='/usr/bin/systemctl'
        "$SYSTEMCTL_EXEC" unmask 'sshd.service'
        if [[ $("$SYSTEMCTL_EXEC" is-system-running) != "offline" ]]; then
          "$SYSTEMCTL_EXEC" start 'sshd.service'
        fi
        "$SYSTEMCTL_EXEC" enable 'sshd.service'

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '10':
      severity: medium
      benchmarks:
        - disa_stig
    '8':
      severity: medium
      benchmarks:
        - disa_stig
    '9':
      severity: medium
      benchmarks:
        - disa_stig
  ubuntu:
    enforcement_info:
      check: /bin/systemctl is-enabled sshd
      result: 
        string: "enabled"
      fix: |
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        SYSTEMCTL_EXEC='/usr/bin/systemctl'
        "$SYSTEMCTL_EXEC" unmask 'ssh.service'
        if [[ $("$SYSTEMCTL_EXEC" is-system-running) != "offline" ]]; then
          "$SYSTEMCTL_EXEC" start 'ssh.service'
        fi
        "$SYSTEMCTL_EXEC" enable 'ssh.service'

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
tags:
  - 800-53r5_high
  - 800-53r5_low
  - 800-53r5_moderate
