id: ssh_sshd_set_maxstartups
title: Ensure SSH MaxStartups is configured
discussion: |
  To protect a system from denial of service due to a large number of pending authentication connection attempts, use the rate limiting function of MaxStartups to protect availability of sshd logins and prevent overwhelming the daemon.
references:
  nist:
    cce:
      'rhel_10':
        - CCE-89624-1
      'rhel_8':
        - CCE-90718-8
      'rhel_9':
        - CCE-87872-8
    800-53r5:
      - SC-05      
os_specifics:
  rhel:
    enforcement_info:
      check: /usr/sbin/sshd -T | /bin/grep -q "maxstartups $ODV"; echo $?
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        var_sshd_set_maxstartups='$ODV'


        mkdir -p /etc/ssh/sshd_config.d
        touch /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf
        chmod 0600 /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf

        LC_ALL=C sed -i "/^\s*MaxStartups\s\+/Id" "/etc/ssh/sshd_config"
        LC_ALL=C sed -i "/^\s*MaxStartups\s\+/Id" "/etc/ssh/sshd_config.d"/*.conf
        if [ -e "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" ] ; then

            LC_ALL=C sed -i "/^\s*MaxStartups\s\+/Id" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        else
            touch "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        fi
        # make sure file has newline at the end
        sed -i -e '$a\' "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"

        cp "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"
        # Insert at the beginning of the file
        printf '%s\n' "MaxStartups $var_sshd_set_maxstartups" > "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        cat "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak" >> "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        # Clean up after ourselves.
        rm "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '10': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
    '8': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2      
    '9': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
  ubuntu:
    enforcement_info:
      check: /usr/sbin/sshd -T | /bin/grep -q "maxstartups $ODV"; echo $?
      result: 
        integer: 0
      fix: | 
          # Remediation is applicable only in certain platforms
          if dpkg-query --show --showformat='${db:Status-Status}
          ' 'linux-base' 2>/dev/null | grep -q ^installed; then

          var_sshd_set_maxstartups='$ODV'


          mkdir -p /etc/ssh/sshd_config.d
          touch /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf
          chmod 0600 /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf

          LC_ALL=C sed -i "/^\s*MaxStartups\s\+/Id" "/etc/ssh/sshd_config"
          LC_ALL=C sed -i "/^\s*MaxStartups\s\+/Id" "/etc/ssh/sshd_config.d"/*.conf
          if [ -e "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" ] ; then

              LC_ALL=C sed -i "/^\s*MaxStartups\s\+/Id" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
          else
              touch "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
          fi
          # make sure file has newline at the end
          sed -i -e '$a\' "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"

          cp "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"
          # Insert at the beginning of the file
          printf '%s\n' "MaxStartups $var_sshd_set_maxstartups" > "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
          cat "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak" >> "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
          # Clean up after ourselves.
          rm "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"

          else
              >&2 echo 'Remediation is not applicable, nothing was done'
          fi
    '2004': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2      
    '2204': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
    '2404': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2      
odv:
  hint:
    datatype: string
    description: Ratio of when to start dropping connections (start), what percent to drop (rate), and the absolute max (full).
  recommended: "10:30:60"
  cis_lvl1: "10:30:60"
  cis_lvl2: "10:30:60"
tags:
  - 800-53r5_high
  - 800-53r5_low
  - 800-53r5_moderate
  - client
  - server
