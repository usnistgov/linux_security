id: ssh_sshd_enable_pubkey_auth
title: Enable Public Key Authentication
discussion: |
  Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased. Multifactor authentication requires using two or more factors to achieve authentication.
  
  A privileged account is defined as an information system account with authorizations of a privileged user.
  
  The DoD CAC with DoD-approved PKI is an example of multifactor authentication.
references:
  disa:
    cci:
      - CCI-000765
      - CCI-000766
    srg:
      - SRG-OS-000105-GPOS-00052
      - SRG-OS-000106-GPOS-00053
      - SRG-OS-000107-GPOS-00054
      - SRG-OS-000108-GPOS-00055
    disa_stig:
      '9':
        - RHEL-09-255035
      '2004':
        - UBTU-20-010033
      '2204':
        - UBTU-22-612020
      '2404':
        - UBTU-24-400030
  nist:
    cce:
      '9':
        - CCE-86138-5
      '10':
        - CCE-90625-5
    800-53r5:
      - IA-2(1)
      - IA-2(2)
os_specifics:
  rhel:
    enforcement_info:
      check: /usr/sbin/sshd -T | grep -q "pubkeyauthentication yes"; echo $?
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        mkdir -p /etc/ssh/sshd_config.d
        touch /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf
        chmod 0600 /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf

        LC_ALL=C sed -i "/^\s*PubkeyAuthentication\s\+/Id" "/etc/ssh/sshd_config"
        LC_ALL=C sed -i "/^\s*PubkeyAuthentication\s\+/Id" "/etc/ssh/sshd_config.d"/*.conf
        if [ -e "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" ] ; then

            LC_ALL=C sed -i "/^\s*PubkeyAuthentication\s\+/Id" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        else
            touch "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        fi
        # make sure file has newline at the end
        sed -i -e '$a\' "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"

        cp "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"
        # Insert at the beginning of the file
        printf '%s\n' "PubkeyAuthentication yes" > "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        cat "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak" >> "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        # Clean up after ourselves.
        rm "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '8': {}
    '9':
      benchmarks:
        - name: disa_stig
          severity: medium
    '10':{}
  ubuntu:
    enforcement_info:
      check: /usr/sbin/sshd -T | grep -q "pubkeyauthentication yes"; echo $?
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        mkdir -p /etc/ssh/sshd_config.d
        touch /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf
        chmod 0600 /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf

        LC_ALL=C sed -i "/^\s*PubkeyAuthentication\s\+/Id" "/etc/ssh/sshd_config"
        LC_ALL=C sed -i "/^\s*PubkeyAuthentication\s\+/Id" "/etc/ssh/sshd_config.d"/*.conf
        if [ -e "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" ] ; then

            LC_ALL=C sed -i "/^\s*PubkeyAuthentication\s\+/Id" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        else
            touch "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        fi
        # make sure file has newline at the end
        sed -i -e '$a\' "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"

        cp "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf" "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"
        # Insert at the beginning of the file
        printf '%s\n' "PubkeyAuthentication yes" > "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        cat "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak" >> "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf"
        # Clean up after ourselves.
        rm "/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf.bak"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '2004':
      benchmarks:
        - name: disa_stig
          severity: medium
    '2204':
