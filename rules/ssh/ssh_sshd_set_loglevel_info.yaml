id: ssh_sshd_set_loglevel_info
title: Set LogLevel to INFO
discussion: |
  SSH provides several logging levels with varying amounts of verbosity. DEBUG is specifically not recommended other than strictly for debugging SSH communications since it provides so much data that it is difficult to identify important security information. INFO level is the basic level that only records login activity of SSH users. In many situations, such as Incident
  
  Response, it is important to determine when a particular user was active on a system. The logout record can eliminate those users who disconnected, which helps narrow the field.
references:
  nist:
    800-53r5:
      - AU-2
      - CM-6
    cce:
      'rhel_8':
        - CCE-82282-5
      'rhel_9':
        - CCE-90813-7
      'rhel_10':
        - CCE-90121-5
os_specifics:
  rhel:
    enforcement_info:
      check: /usr/sbin/sshd -T | /bin/grep -q "loglevel $ODV"; echo $?
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        mkdir -p /etc/ssh/sshd_config.d
        touch /etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf
        chmod 0600 /etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf

        LC_ALL=C sed -i "/^\s*LogLevel\s\+/Id" "/etc/ssh/sshd_config"
        LC_ALL=C sed -i "/^\s*LogLevel\s\+/Id" "/etc/ssh/sshd_config.d"/*.conf
        if [ -e "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf" ] ; then

            LC_ALL=C sed -i "/^\s*LogLevel\s\+/Id" "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf"
        else
            touch "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf"
        fi
        # make sure file has newline at the end
        sed -i -e '$a\' "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf"

        cp "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf" "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf.bak"
        # Insert at the beginning of the file
        printf '%s\n' "LogLevel $ODV" > "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf"
        cat "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf.bak" >> "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf"
        # Clean up after ourselves.
        rm "/etc/ssh/sshd_config.d/01-complianceascode-reinforce-os-defaults.conf.bak"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '8': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
    '9': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
    '10': 
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
  ubuntu:
