id: ssh_file_permissions_sshd_pub_key
title: Verify Permissions on SSH Server Public *.pub Key Files
discussion: |
  If a public host key file is modified by an unauthorized user, the SSH service may be compromised.

  SSH server public keys _MUST_ be owned by the user root and group root.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '8':
        - RHEL-08-010480
      '9':
        - RHEL-09-255125
  nist:
    800-53r5:
      - AC-6
      - CM-6
    cce:
      '8':
        - CCE-82428-4
      '9':
        - CCE-90819-4
      '10':
        - CCE-87454-5
os_specifics:
  rhel:
    enforcement_info:
      check: /usr/bin/find /etc/ssh -maxdepth 1 -name "*_key.pub" -type f \( ! -user root -o ! -group root \) | wc -l
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        find -L /etc/ssh/ -maxdepth 1 -perm /u+xs,g+xws,o+xwt  -type f -regextype posix-extended -regex '^.*\.pub$' -exec chmod u-xs,g-xws,o-xwt {} \;

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '8':
      benchmarks:
        - name: disa_stig
          severity: medium 
    '9':
      benchmarks:
        - name: disa_stig
          severity: medium
    '10': {}
  ubuntu:
    enforcement_info:
      check: /usr/bin/find /etc/ssh -maxdepth 1 -name "*_key.pub" -type f \( ! -user root -o ! -group root \) | wc -l
      result: 
        integer: 0
      fix: |
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        find -L /etc/ssh/ -maxdepth 1 -perm /u+xs,g+xws,o+xwt  -type f -regextype posix-extended -regex '^.*\.pub$' -exec chmod u-xs,g-xws,o-xwt {} \;

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '2004': {}
    '2204': {}
    '2404': {}
tags:
  - 800-53r5_high
  - 800-53r5_low
  - 800-53r5_moderate
  - client
  - server
