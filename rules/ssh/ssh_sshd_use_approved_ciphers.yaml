id: ssh_sshd_use_approved_ciphers
title: Use Only FIPS 140-2 or FIPS-140-3 Validated Ciphers
discussion: |
  Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and therefore
  cannot be relied upon to provide confidentiality or integrity, and system data may be compromised.

  Operating systems utilizing encryption are required to use FIPS-compliant mechanisms for authenticating to
  cryptographic modules.

  FIPS 140-3 is the current standard for validating that mechanisms used to access cryptographic modules
  utilize authentication that meets industry and government requirements.
references:
  disa:
    cci:
      - CCI-000068
      - CCI-000366
      - CCI-000803
      - CCI-000877
      - CCI-002890
      - CCI-003123
    srg:
      - SRG-OS-000033-GPOS-00014
      - SRG-OS-000120-GPOS-00061
      - SRG-OS-000125-GPOS-00065
      - SRG-OS-000250-GPOS-00093
      - SRG-OS-000393-GPOS-00173
      - SRG-OS-000394-GPOS-00174
  nist:
    800-53r5:
      - AC-17(2)
      - IA-7
      - SC-8
      - SC-8(1)
      - SC-12
      - SC-13
    cce:
      'rhel_8':
        - CCE-81032-5
      'rhel_9':
        - CCE-86767-1
os_specifics:
  rhel:
    enforcement_info:
      check: /usr/sbin/sshd -T | /bin/grep -q "ciphers $ODV"; echo $?
      result: 
        integer: 0
      fix: | 
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        sshd_approved_ciphers='$ODV'


        # Strip any search characters in the key arg so that the key can be replaced without
        # adding any search characters to the config file.
        stripped_key=$(sed 's/[\^=\$,;+]*//g' <<< "^Ciphers")

        # shellcheck disable=SC2059
        printf -v formatted_output "%s %s" "$stripped_key" "$sshd_approved_ciphers"

        # If the key exists, change it. Otherwise, add it to the config_file.
        # We search for the key string followed by a word boundary (matched by \>),
        # so if we search for 'setting', 'setting2' won't match.
        if LC_ALL=C grep -q -m 1 -i -e "^Ciphers\\>" "/etc/ssh/sshd_config"; then
            escaped_formatted_output=$(sed -e 's|/|\\/|g' <<< "$formatted_output")
            LC_ALL=C sed -i --follow-symlinks "s/^Ciphers\\>.*/$escaped_formatted_output/gi" "/etc/ssh/sshd_config"
        else
            if [[ -s "/etc/ssh/sshd_config" ]] && [[ -n "$(tail -c 1 -- "/etc/ssh/sshd_config" || true)" ]]; then
                LC_ALL=C sed -i --follow-symlinks '$a'\\ "/etc/ssh/sshd_config"
            fi
            cce="CCE-81032-5"
            printf '# Per %s: Set %s in %s\n' "${cce}" "${formatted_output}" "/etc/ssh/sshd_config" >> "/etc/ssh/sshd_config"
            printf '%s\n' "$formatted_output" >> "/etc/ssh/sshd_config"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '8':
      benchmarks:
        - name: disa_stig
        - name: nist_800-53r4
          severity: medium
    '9':
      benchmarks:
        - name: disa_stig
        - name: nist_800-53r4
          severity: medium
    '10':
      benchmarks:
        - name: disa_stig
        - name: nist_800-53r4
          severity: medium
  ubuntu:
    enforcement_info:
      check: /usr/sbin/sshd -T | /bin/grep -q "ciphers $ODV"; echo $?
      result: 
        integer: 0
      fix: | 
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        sshd_approved_ciphers='$ODV'


        # Strip any search characters in the key arg so that the key can be replaced without
        # adding any search characters to the config file.
        stripped_key=$(sed 's/[\^=\$,;+]*//g' <<< "^Ciphers")

        # shellcheck disable=SC2059
        printf -v formatted_output "%s %s" "$stripped_key" "$sshd_approved_ciphers"

        # If the key exists, change it. Otherwise, add it to the config_file.
        # We search for the key string followed by a word boundary (matched by \>),
        # so if we search for 'setting', 'setting2' won't match.
        if LC_ALL=C grep -q -m 1 -i -e "^Ciphers\\>" "/etc/ssh/sshd_config"; then
            escaped_formatted_output=$(sed -e 's|/|\\/|g' <<< "$formatted_output")
            LC_ALL=C sed -i --follow-symlinks "s/^Ciphers\\>.*/$escaped_formatted_output/gi" "/etc/ssh/sshd_config"
        else
            if [[ -s "/etc/ssh/sshd_config" ]] && [[ -n "$(tail -c 1 -- "/etc/ssh/sshd_config" || true)" ]]; then
                LC_ALL=C sed -i --follow-symlinks '$a'\\ "/etc/ssh/sshd_config"
            fi
            printf '%s\n' "$formatted_output" >> "/etc/ssh/sshd_config"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi
    '2004':
      benchmarks:
        - name: disa_stig
          severity: medium
    '2204':
      benchmarks:
        - name: disa_stig
          severity: medium
    '2404':
      benchmarks:
        - name: disa_stig
          severity: medium
odv:
  hint:
    datatype: string
    description: List of approved ciphers to use for SSH connections. Order specific.
  recommended: aes256-ctr,aes192-ctr,aes128-ctr
  stig: aes256-ctr,aes192-ctr,aes128-ctr
tags:
  - 800-53r5_high
  - 800-53r5_low
  - 800-53r5_moderate
