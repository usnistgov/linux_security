id: os_directory_permissions_var_log_audit
title: System Audit Logs Must Have Mode 0750 or Less Permissive
discussion: If users can write to audit logs, audit trails can be modified or destroyed.
references:
  disa:
    cci:
      - CCI-000162
      - CCI-000163
      - CCI-000164
    srg:
      - SRG-OS-000057-GPOS-00027
      - SRG-OS-000058-GPOS-00028
      - SRG-OS-000059-GPOS-00029
    disa_stig:
      '8':
        - RHEL-08-030120
      '2004':
        - UBTU-20-010128
      '2204':
        - UBTU-22-653060
  nist:
    800-53r4:
      - AC-6
      - AU-9
      - CM-6
    cce:
      '10':
        - CCE-86750-7
      '8':
        - CCE-84048-8
      '9':
        - CCE-83734-4
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q audit && rpm --quiet -q kernel; then

        if LC_ALL=C grep -iw ^log_file /etc/audit/auditd.conf; then
          DIR=$(awk -F "=" '/^log_file/ {print $2}' /etc/audit/auditd.conf | tr -d ' ' | rev | cut -d"/" -f2- | rev)
        else
          DIR="/var/log/audit"
        fi


        if LC_ALL=C grep -m 1 -q ^log_group /etc/audit/auditd.conf; then
          GROUP=$(awk -F "=" '/log_group/ {print $2}' /etc/audit/auditd.conf | tr -d ' ')
          if ! [ "${GROUP}" == 'root' ] ; then
            chmod 0750 $DIR
          else
            chmod 0700 $DIR
          fi
        else
          chmod 0700 $DIR
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

