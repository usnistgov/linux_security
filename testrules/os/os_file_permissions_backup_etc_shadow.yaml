id: os_file_permissions_backup_etc_shadow
title: Verify Permissions on Backup shadow File
discussion: |
  The /etc/shadow- file is a backup file of /etc/shadow, and as such,
  it contains the list of local system accounts and password hashes.
  Protection of this file is critical for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232085
  nist:
    800-53r4:
      - 'AC-6 '
    cce:
      '10':
        - CCE-87423-0
      '8':
        - CCE-83417-6
      '9':
        - CCE-83935-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        chmod u-xwrs,g-xwrs,o-xwrt /etc/shadow-

        ---
