id: os_group_ownership_var_log_audit
title: System Audit Logs Must Be Group Owned By Root
discussion: |
  Unauthorized disclosure of audit records can reveal system and configuration data to
  attackers, thus compromising its confidentiality.
references:
  disa:
    cci:
      - CCI-000162
      - CCI-000163
      - CCI-000164
      - CCI-001314
    srg:
      - SRG-OS-000057-GPOS-00027
      - SRG-OS-000058-GPOS-00028
      - SRG-OS-000059-GPOS-00029
      - SRG-OS-000206-GPOS-00084
    disa_stig:
      '8':
        - RHEL-08-030090
      '2004':
        - UBTU-20-010124
      '2204':
        - UBTU-22-653055
  nist:
    800-53r4:
      - AC-6(1)
      - AU-9(4)
      - CM-6(a)
    cce:
      '10':
        - CCE-89126-7
      '8':
        - CCE-88227-4
      '9':
        - CCE-89603-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q audit && rpm --quiet -q kernel; then

        if LC_ALL=C grep -iw log_file /etc/audit/auditd.conf; then
          FILE=$(awk -F "=" '/^log_file/ {print $2}' /etc/audit/auditd.conf | tr -d ' ')
        else
          FILE="/var/log/audit/audit.log"
        fi


        if LC_ALL=C grep -m 1 -q ^log_group /etc/audit/auditd.conf; then
          GROUP=$(awk -F "=" '/log_group/ {print $2}' /etc/audit/auditd.conf | tr -d ' ')
            if ! [ "${GROUP}" == 'root' ]; then
              chgrp ${GROUP} $FILE*
            else
              chgrp root $FILE*
            fi
        else
          chgrp root $FILE*
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

