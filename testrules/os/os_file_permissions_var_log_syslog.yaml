id: os_file_permissions_var_log_syslog
title: Verify Permissions on /var/log/syslog File
discussion: |
  The /var/log/syslog file contains logs of error messages in
  the system and should only be accessed by authorized personnel.
references:
  disa:
    cci:
      - CCI-001314
    srg:
      - SRG-OS-000206-GPOS-00084
    disa_stig:
      '2004':
        - UBTU-20-010422
      '2204':
        - UBTU-22-232030
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        chmod u-xs,g-xws,o-xwrt /var/log/syslog

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        chmod u-xs,g-xws,o-xwrt /var/log/syslog

        ---
