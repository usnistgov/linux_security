id: os_file_ownership_binary_dirs
title: Verify that System Executables Have Root Ownership
discussion: |
  System binaries are executed by privileged users as well as system services,
  and restrictive permissions are necessary to ensure that their
  execution of these programs cannot be co-opted.
references:
  disa:
    cci:
      - CCI-001499
    srg:
      - SRG-OS-000259-GPOS-00100
    disa_stig:
      '8':
        - RHEL-08-010310
      '9':
        - RHEL-09-232190
      '2004':
        - UBTU-20-010457
      '2204':
        - UBTU-22-232050
  nist:
    800-53r4:
      - AC-6
      - CM-5
      - CM-6
    cce:
      '10':
        - CCE-89620-9
      '8':
        - CCE-80806-3
      '9':
        - CCE-83908-4
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        find /bin/ \
        /usr/bin/ \
        /usr/local/bin/ \
        /sbin/ \
        /usr/sbin/ \
        /usr/local/sbin/ \
        /usr/libexec \
        \! -user root -execdir chown root {} \;

