id: os_file_permissions_etc_gshadow
title: Verify Permissions on gshadow File
discussion: |
  The /etc/gshadow file contains group password hashes. Protection of this file
  is critical for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232065
  nist:
    800-53r4:
      - AC-6(1)
      - CM-6(a)
    cce:
      '10':
        - CCE-86975-0
      '8':
        - CCE-80811-3
      '9':
        - CCE-83921-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        chmod u-xwrs,g-xwrs,o-xwrt /etc/gshadow

        ---
