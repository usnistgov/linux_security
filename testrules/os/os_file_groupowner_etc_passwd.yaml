id: os_file_groupowner_etc_passwd
title: Verify Group Who Owns passwd File
discussion: |
  The /etc/passwd file contains information about the users that are configured on
  the system. Protection of this file is critical for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232135
  nist:
    800-53r4:
      - AC-6(1)
      - CM-6(a)
    cce:
      '10':
        - CCE-89210-9
      '8':
        - CCE-80798-2
      '9':
        - CCE-83950-6
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        chgrp 0 /etc/passwd

        ---
