id: os_file_owner_grub2_cfg
title: Verify /boot/grub2/grub.cfg User Ownership
discussion: Only root should be able to modify important boot parameters.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-212030
  nist:
    800-53r4:
      - AC-6
      - CM-6
    cce:
      '10':
        - CCE-89438-6
      '8':
        - CCE-80805-5
      '9':
        - CCE-83845-8
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( rpm --quiet -q grub2-common && rpm --quiet -q kernel ) && [ ! -d /sys/firmware/efi ] && { ! ( { rpm --quiet -q kernel ;} && { rpm --quiet -q rpm-ostree ;} && { rpm --quiet -q bootc ;} && { ! rpm --quiet -q openshift-kubelet ;} ); }; then

        chown 0 /boot/grub2/grub.cfg

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '8':
      severity: medium
      benchmarks:
        - disa_stig
