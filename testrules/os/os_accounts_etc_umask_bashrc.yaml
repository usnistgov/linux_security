id: os_accounts_etc_umask_bashrc
title: Ensure the Default Bash Umask is Set Correctly
discussion: |
  The umask value influences the permissions assigned to files when they are created.
  A misconfigured umask value could result in files with excessive permissions that can be read or
  written to by unauthorized users.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
      - SRG-OS-000480-GPOS-00228
    disa_stig:
      '8':
        - RHEL-08-020353
      '9':
        - RHEL-09-412055
  nist:
    800-53r4:
      - AC-6(1)
      - CM-6(a)
    cce:
      '10':
        - CCE-88580-6
      '8':
        - CCE-81036-6
      '9':
        - CCE-83644-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q bash; then

        var_accounts_user_umask=''






        grep -q "^[^#]*\bumask" /etc/bashrc && \
          sed -i -E -e "s/^([^#]*\bumask)[[:space:]]+[[:digit:]]+/\1 $var_accounts_user_umask/g" /etc/bashrc
        if ! [ $? -eq 0 ]; then
            echo "umask $var_accounts_user_umask" >> /etc/bashrc
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

