id: os_aide_build_db
title: Build and Test AIDE Database
discussion: |
  For AIDE to be effective, an initial database of "known-good" information about files
  must be captured and it should be able to be verified against the installed files.
references:
  disa:
    cci:
      - CCI-001744
      - CCI-002696
    srg:
      - SRG-OS-000445-GPOS-00199
    disa_stig:
      '8':
        - RHEL-08-010359
      '9':
        - RHEL-09-651010
      '2004':
        - UBTU-20-010450
      '2204':
        - UBTU-22-651015
  nist:
    800-53r4:
      - CM-6(a)
    cce:
      '10':
        - CCE-86942-0
      '8':
        - CCE-80675-2
      '9':
        - CCE-83438-2
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "aide" ; then
            dnf install -y "aide"
        fi

        /usr/sbin/aide --init
        /bin/cp -p /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '8':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
