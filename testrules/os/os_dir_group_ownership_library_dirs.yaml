id: os_dir_group_ownership_library_dirs
title: Verify that Shared Library Directories Have Root Group Ownership
discussion: |
  Files from shared library directories are loaded into the address
  space of processes (including privileged ones) or of the kernel itself at
  runtime. Proper ownership of library directories is necessary to protect
  the integrity of the system.
references:
  disa:
    cci:
      - CCI-001499
    srg:
      - SRG-OS-000259-GPOS-00100
    disa_stig:
      '8':
        - RHEL-08-010351
      '9':
        - RHEL-09-232215
      '2004':
        - UBTU-20-010431
      '2204':
        - UBTU-22-232065
  nist:
    800-53r4:
      - CM-5(6)
      - CM-5(6).1
    cce:
      '10':
        - CCE-88290-2
      '8':
        - CCE-85894-4
      '9':
        - CCE-89858-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        find -H /lib/  -type d -exec chgrp -L 0 {} \;
        find -H /lib64/  -type d -exec chgrp -L 0 {} \;
        find -H /usr/lib/  -type d -exec chgrp -L 0 {} \;
        find -H /usr/lib64/  -type d -exec chgrp -L 0 {} \;

