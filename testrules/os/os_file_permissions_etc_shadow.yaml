  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232270
  nist:
    800-53r4:
      - AC-6(1)
      - CM-6(a)
    cce:
      '10':
        - CCE-88433-8
      '8':
        - CCE-80813-9
      '9':
        - CCE-83941-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        chmod u-xwrs,g-xwrs,o-xwrt /etc/shadow

