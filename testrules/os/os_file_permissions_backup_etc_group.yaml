id: os_file_permissions_backup_etc_group
title: Verify Permissions on Backup group File
discussion: |
  The /etc/group- file is a backup file of /etc/group, and as such,
  it contains information regarding groups that are configured on the system.
  Protection of this file is important for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232060
  nist:
    800-53r4:
      - AC-6 (1)
    cce:
      '10':
        - CCE-86579-0
      '8':
        - CCE-83483-8
      '9':
        - CCE-83939-9
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---




        chmod u-xs,g-xws,o-xwt /etc/group-

        ---
