id: os_kernel_module_hfs_disabled
title: Disable Mounting of hfs
discussion: |
  Linux kernel modules which implement filesystems that are not needed by the
  local system should be disabled.
references:
  nist:
    800-53r4:
      - CM-6(a)
      - CM-7(a)
      - CM-7(b)
    cce:
      '8':
        - CCE-86616-0
      '9':
        - CCE-86764-8
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: low
      benchmarks:
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if LC_ALL=C grep -q -m 1 "^install hfs" /etc/modprobe.d/hfs.conf ; then

           sed -i 's#^install hfs.*#install hfs /bin/false#g' /etc/modprobe.d/hfs.conf
        else
           echo -e "\n# Disable per security requirements" >> /etc/modprobe.d/hfs.conf
           echo "install hfs /bin/false" >> /etc/modprobe.d/hfs.conf
        fi

        if ! LC_ALL=C grep -q -m 1 "^blacklist hfs$" /etc/modprobe.d/hfs.conf ; then
           echo "blacklist hfs" >> /etc/modprobe.d/hfs.conf
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
