id: os_file_owner_etc_gshadow
title: Verify User Who Owns gshadow File
discussion: |
  The /etc/gshadow file contains group password hashes. Protection of this file
  is critical for system security.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '9':
        - RHEL-09-232110
  nist:
    800-53r4:
      - AC-6(1)
      - CM-6(a)
    cce:
      '10':
        - CCE-87701-9
      '8':
        - CCE-80802-2
      '9':
        - CCE-83924-1
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        chown 0 /etc/gshadow

        ---
