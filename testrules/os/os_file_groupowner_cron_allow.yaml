id: os_file_groupowner_cron_allow
title: Verify Group Who Owns /etc/cron.allow file
discussion: |
  If the owner of the cron.allow file is not set to root, the possibility exists for an
  unauthorized user to view or edit sensitive information.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
  nist:
    800-53r4:
      - AC-6(1)
      - CM-6(a)
    cce:
      '10':
        - CCE-90094-4
      '8':
        - CCE-86829-9
      '9':
        - CCE-86830-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        chgrp 0 /etc/cron.allow

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
