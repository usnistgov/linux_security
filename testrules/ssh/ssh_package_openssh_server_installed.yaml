id: ssh_package_openssh_server_installed
title: Install the OpenSSH Server Package
discussion: |
  Without protection of the transmitted information, confidentiality, and
  integrity may be compromised because unprotected communications can be
  intercepted and either read or altered.
references:
  disa:
    cci:
      - CCI-002418
      - CCI-002420
      - CCI-002421
      - CCI-002422
    srg:
      - SRG-OS-000423-GPOS-00187
      - SRG-OS-000424-GPOS-00188
      - SRG-OS-000425-GPOS-00189
      - SRG-OS-000426-GPOS-00190
    disa_stig:
      '8':
        - RHEL-08-040159
      '9':
        - RHEL-09-255010
      '2004':
        - UBTU-20-010042
      '2204':
        - UBTU-22-255010
  nist:
    800-53r4:
      - CM-6
    cce:
      '10':
        - CCE-89241-4
      '8':
        - CCE-83303-8
      '9':
        - CCE-90823-6
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "openssh-server" ; then
            dnf install -y "openssh-server"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '8':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "openssh-server" ; then
            yum install -y "openssh-server"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "openssh-server" ; then
            dnf install -y "openssh-server"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "openssh-server"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "openssh-server"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
