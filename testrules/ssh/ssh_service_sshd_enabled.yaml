  disa:
    cci:
      - CCI-002418
      - CCI-002420
      - CCI-002421
      - CCI-002422
    srg:
      - SRG-OS-000423-GPOS-00187
      - SRG-OS-000424-GPOS-00188
      - SRG-OS-000425-GPOS-00189
      - SRG-OS-000426-GPOS-00190
    disa_stig:
      '8':
        - RHEL-08-040160
      '9':
        - RHEL-09-255015
      '2004':
        - UBTU-20-010042
      '2204':
        - UBTU-22-255015
  nist:
    800-53r4:
      - CM-6
      - SC-8
    cce:
      '10':
        - CCE-88621-8
      '8':
        - CCE-82426-8
      '9':
