id: ssh_file_permissions_sshd_pub_key
title: Verify Permissions on SSH Server Public *.pub Key Files
discussion: |
  If a public host key file is modified by an unauthorized user, the SSH service
  may be compromised.
references:
  disa:
    cci:
      - CCI-000366
    srg:
      - SRG-OS-000480-GPOS-00227
    disa_stig:
      '8':
        - RHEL-08-010480
      '9':
        - RHEL-09-255125
  nist:
    800-53r4:
      - AC-6(1)
      - AC-17(a)
      - CM-6(a)
    cce:
      '10':
        - CCE-87454-5
      '8':
        - CCE-82428-4
      '9':
        - CCE-90819-4
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        find -L /etc/ssh/ -maxdepth 1 -perm /u+xs,g+xws,o+xwt  -type f -regextype posix-extended -regex '^.*\.pub$' -exec chmod u-xs,g-xws,o-xwt {} \;

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
