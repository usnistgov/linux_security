id: pwpolicy_pw_dcredit_set
title: Ensure PAM Enforces Password Requirements - Minimum Digit Characters
discussion: |
  Use of a complex password helps to increase the time and resources required
  to compromise the password. Password complexity, or strength, is a measure of
  the effectiveness of a password in resisting attempts at guessing and brute-force
  attacks.


  Password complexity is one factor of several that determines how long it takes
  to crack a password. The more complex the password, the greater the number of
  possible combinations that need to be tested before the password is compromised.
  Requiring digits makes password guessing attacks more difficult by ensuring a larger
  search space.
references:
  disa:
    cci:
      - CCI-004066
    srg:
      - SRG-OS-000071-GPOS-00039
    disa_stig:
      '8':
        - RHEL-08-020130
      '9':
        - RHEL-09-611070
      '2004':
        - UBTU-20-010052
      '2204':
        - UBTU-22-611020
  nist:
    800-53r4:
      - CM-6(a)
      - IA-5(1)(a)
      - IA-5(4)
      - IA-5(c)
    cce:
      '10':
        - CCE-89089-7
      '8':
        - CCE-80653-9
      '9':
        - CCE-83566-0
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q pam; then

        var_password_pam_dcredit=''



        if grep -sq dcredit /etc/security/pwquality.conf.d/*.conf ; then
            sed -i "/dcredit/d" /etc/security/pwquality.conf.d/*.conf
        fi






        # Strip any search characters in the key arg so that the key can be replaced without
        # adding any search characters to the config file.
        stripped_key=$(sed 's/[\^=\$,;+]*//g' <<< "^dcredit")

        # shellcheck disable=SC2059
        printf -v formatted_output "%s = %s" "$stripped_key" "$var_password_pam_dcredit"

        # If the key exists, change it. Otherwise, add it to the config_file.
        # We search for the key string followed by a word boundary (matched by \>),
        # so if we search for 'setting', 'setting2' won't match.
        if LC_ALL=C grep -q -m 1 -i -e "^dcredit\\>" "/etc/security/pwquality.conf"; then
            escaped_formatted_output=$(sed -e 's|/|\\/|g' <<< "$formatted_output")
            LC_ALL=C sed -i --follow-symlinks "s/^dcredit\\>.*/$escaped_formatted_output/gi" "/etc/security/pwquality.conf"
        else
            if [[ -s "/etc/security/pwquality.conf" ]] && [[ -n "$(tail -c 1 -- "/etc/security/pwquality.conf" || true)" ]]; then
                LC_ALL=C sed -i --follow-symlinks '$a'\\ "/etc/security/pwquality.conf"
            fi
            cce="CCE-89089-7"
            printf '# Per %s: Set %s in %s\n' "${cce}" "${formatted_output}" "/etc/security/pwquality.conf" >> "/etc/security/pwquality.conf"
            printf '%s\n' "$formatted_output" >> "/etc/security/pwquality.conf"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

