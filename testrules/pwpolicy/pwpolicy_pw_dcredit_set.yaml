        conf_name=cac_pwquality
        if [ ! -f /usr/share/pam-configs/"$conf_name" ]; then
            cat << EOF > /usr/share/pam-configs/"$conf_name"
        Name: Pwquality password strength checking
        Default: yes
        Priority: 1025
        Conflicts: cracklib, pwquality
        Password-Type: Primary
        Password:
