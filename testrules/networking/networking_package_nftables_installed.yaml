id: networking_package_nftables_installed
title: Install nftables Package
discussion: |
  nftables is a subsystem of the Linux kernel that can protect against threats
  originating from within a corporate network to include malicious mobile code and poorly
  configured software on a host.
references:
  nist:
    cce:
      '10':
        - CCE-87358-8
      '8':
        - CCE-86376-1
      '9':
        - CCE-86378-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( rpm --quiet -q kernel ); then

        if ! rpm -q --quiet "nftables" ; then
            dnf install -y "nftables"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '8':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( rpm --quiet -q kernel ); then

        if ! rpm -q --quiet "nftables" ; then
            yum install -y "nftables"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( rpm --quiet -q kernel ); then

        if ! rpm -q --quiet "nftables" ; then
            dnf install -y "nftables"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed ); then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "nftables"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed ); then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "nftables"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2404':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed ); then

        var_network_filtering_service=''



          if [ $var_network_filtering_service == nftables ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y "nftables"
          fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
