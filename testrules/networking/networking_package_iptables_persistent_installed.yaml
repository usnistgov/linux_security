id: networking_package_iptables_persistent_installed
title: Install iptables-persistent Package
discussion: |
  A method of configuring and maintaining firewall rules is
  necessary to configure a Host Based Firewall.
references: {}
os_specifics:
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}\n' 'iptables' 2>/dev/null | grep -q '^installed'; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "iptables-persistent"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
