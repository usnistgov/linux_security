id: networking_package_ufw_installed
title: Install ufw Package
discussion: |
  ufw controls the Linux kernel network packet filtering
  code. ufw allows system operators to set up firewalls and IP
  masquerading, etc.
references:
  disa:
    cci:
      - CCI-002314
    srg:
      - SRG-OS-000297-GPOS-00115
    disa_stig:
      '2004':
        - UBTU-20-010433
      '2204':
        - UBTU-22-251010
os_specifics:
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "ufw"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "ufw"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2404':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        var_network_filtering_service=''



          if [[ "ufw" =~ $var_network_filtering_service ]]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y "ufw"
          fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
tags:
  - cis_lvl1
