id: networking_package_iptables_installed
title: Install iptables Package
discussion: |
  iptables controls the Linux kernel network packet filtering
  code. iptables allows system operators to set up firewalls and IP
  masquerading, etc.
references:
  nist:
    800-53r4:
      - CM-6
    cce:
      '8':
        - CCE-82982-0
  disa:
    srg:
      - SRG-OS-000480-GPOS-00227
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( rpm --quiet -q kernel ); then

        if ! rpm -q --quiet "iptables" ; then
            yum install -y "iptables"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed ); then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "iptables"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed ); then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "iptables"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2404':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if ( dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed ); then

        var_network_filtering_service=''



          if [ $var_network_filtering_service == iptables ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y "iptables"
          fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
