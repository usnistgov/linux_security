id: services_package_httpd_removed
title: Uninstall httpd Package
discussion: |
  If there is no need to make the web server software available,
  removing it provides a safeguard against its activation.
references:
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      '10':
        - CCE-89436-0
      '8':
        - CCE-85970-2
      '9':
        - CCE-85974-4
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove httpd
        #      from the system, and may remove any packages
        #      that depend on httpd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "httpd" ; then
        dnf remove -y --noautoremove "httpd"
        fi

        ---
    '8':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove httpd
        #      from the system, and may remove any packages
        #      that depend on httpd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "httpd" ; then
        yum remove -y "httpd"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove httpd
        #      from the system, and may remove any packages
        #      that depend on httpd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "httpd" ; then
        dnf remove -y --noautoremove "httpd"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove apache2
        #      from the system, and may remove any packages
        #      that depend on apache2. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "apache2"

        ---
    '2204':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove apache2
        #      from the system, and may remove any packages
        #      that depend on apache2. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "apache2"

        ---
    '2404':
      severity: unknown
      benchmarks:
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove apache2
        #      from the system, and may remove any packages
        #      that depend on apache2. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "apache2"

        ---
