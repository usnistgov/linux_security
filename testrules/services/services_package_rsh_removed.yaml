id: services_package_rsh_removed
title: Uninstall rsh Package
discussion: |
  These legacy clients contain numerous security exposures and have
  been replaced with the more secure SSH package. Even if the server is removed,
  it is best to ensure the clients are also removed to prevent users from
  inadvertently attempting to use these commands and therefore exposing

  their credentials. Note that removing the rsh package removes

  the clients for rsh,rcp, and rlogin.
references:
  nist:
    cce:
      '8':
        - CCE-82183-5
      '9':
        - CCE-84142-9
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh
        #      from the system, and may remove any packages
        #      that depend on rsh. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rsh" ; then
        yum remove -y "rsh"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh
        #      from the system, and may remove any packages
        #      that depend on rsh. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rsh" ; then
        dnf remove -y --noautoremove "rsh"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh-client
        #      from the system, and may remove any packages
        #      that depend on rsh-client. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "rsh-client"

        ---
    '2204':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh-client
        #      from the system, and may remove any packages
        #      that depend on rsh-client. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "rsh-client"

        ---
    '2404':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh-client
        #      from the system, and may remove any packages
        #      that depend on rsh-client. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "rsh-client"

        ---
