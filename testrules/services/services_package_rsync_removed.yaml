id: services_package_rsync_removed
title: Uninstall rsync Package
discussion: |
  The rsyncd service presents a security risk as it uses unencrypted protocols for
  communication.
references:
  nist:
    cce:
      '10':
        - CCE-88025-2
      '8':
        - CCE-86335-7
      '9':
        - CCE-86336-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsync-daemon
        #      from the system, and may remove any packages
        #      that depend on rsync-daemon. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rsync-daemon" ; then
        dnf remove -y --noautoremove "rsync-daemon"
        fi

        ---
    '8':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsync-daemon
        #      from the system, and may remove any packages
        #      that depend on rsync-daemon. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rsync-daemon" ; then
        yum remove -y "rsync-daemon"
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsync-daemon
        #      from the system, and may remove any packages
        #      that depend on rsync-daemon. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rsync-daemon" ; then
        dnf remove -y --noautoremove "rsync-daemon"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsync
        #      from the system, and may remove any packages
        #      that depend on rsync. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "rsync"

