id: services_package_dovecot_removed
title: Uninstall dovecot Package
discussion: |
  If there is no need to make the Dovecot software available,
  removing it provides a safeguard against its activation.
references:
  nist:
    cce:
      '10':
        - CCE-86197-1
      '8':
        - CCE-85976-9
      '9':
        - CCE-85977-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove dovecot
        #      from the system, and may remove any packages
        #      that depend on dovecot. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "dovecot" ; then
        dnf remove -y --noautoremove "dovecot"
        fi

        ---
    '8':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove dovecot
        #      from the system, and may remove any packages
        #      that depend on dovecot. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "dovecot" ; then
        yum remove -y "dovecot"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove dovecot
        #      from the system, and may remove any packages
        #      that depend on dovecot. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "dovecot" ; then
        dnf remove -y --noautoremove "dovecot"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove dovecot-core
        #      from the system, and may remove any packages
        #      that depend on dovecot-core. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "dovecot-core"

        ---
    '2204':
      severity: unknown
      benchmarks:
        - N/A
