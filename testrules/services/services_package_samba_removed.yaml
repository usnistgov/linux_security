id: services_package_samba_removed
title: Uninstall Samba Package
discussion: |
  If there is no need to make the Samba software available,
  removing it provides a safeguard against its activation.
references:
  nist:
    cce:
      '10':
        - CCE-89779-3
      '8':
        - CCE-85978-5
      '9':
        - CCE-85979-3
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove samba
        #      from the system, and may remove any packages
        #      that depend on samba. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "samba" ; then
        dnf remove -y --noautoremove "samba"
        fi

        ---
    '8':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove samba
        #      from the system, and may remove any packages
        #      that depend on samba. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "samba" ; then
        yum remove -y "samba"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove samba
        #      from the system, and may remove any packages
        #      that depend on samba. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "samba" ; then
        dnf remove -y --noautoremove "samba"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove samba
        #      from the system, and may remove any packages
        #      that depend on samba. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "samba"

