id: services_package_net_snmp_removed
title: Uninstall net-snmp Package
discussion: |
  If there is no need to run SNMP server software,
  removing the package provides a safeguard against its
  activation.
references:
  nist:
    cce:
      '10':
        - CCE-89193-7
      '8':
        - CCE-85980-1
      '9':
        - CCE-85981-9
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove net-snmp
        #      from the system, and may remove any packages
        #      that depend on net-snmp. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "net-snmp" ; then
        dnf remove -y --noautoremove "net-snmp"
        fi

        ---
    '8':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove net-snmp
        #      from the system, and may remove any packages
        #      that depend on net-snmp. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "net-snmp" ; then
        yum remove -y "net-snmp"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove net-snmp
        #      from the system, and may remove any packages
        #      that depend on net-snmp. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "net-snmp" ; then
        dnf remove -y --noautoremove "net-snmp"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove snmp
        #      from the system, and may remove any packages
        #      that depend on snmp. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "snmp"

        ---
    '2204':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove snmp
        #      from the system, and may remove any packages
        #      that depend on snmp. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "snmp"

        ---
    '2404':
      severity: unknown
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove snmpd
        #      from the system, and may remove any packages
        #      that depend on snmpd. Execute this
