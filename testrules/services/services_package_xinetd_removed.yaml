id: services_package_xinetd_removed
title: Uninstall xinetd Package
discussion: |
  Removing the xinetd package decreases the risk of the
  xinetd service's accidental (or intentional) activation.
references:
  disa:
    cci:
      - CCI-000305
  nist:
    800-53r4:
      - CM-6
      - CM-7
    cce:
      '8':
        - CCE-80850-1
      '9':
        - CCE-84155-1
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        # CAUTION: This remediation script will remove xinetd
        #      from the system, and may remove any packages
        #      that depend on xinetd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "xinetd" ; then
        yum remove -y "xinetd"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '9':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        # CAUTION: This remediation script will remove xinetd
        #      from the system, and may remove any packages
        #      that depend on xinetd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "xinetd" ; then
        dnf remove -y --noautoremove "xinetd"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        # CAUTION: This remediation script will remove xinetd
        #      from the system, and may remove any packages
        #      that depend on xinetd. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "xinetd"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        # CAUTION: This remediation script will remove xinetd
