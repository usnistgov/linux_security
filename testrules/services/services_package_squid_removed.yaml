id: services_package_squid_removed
title: Uninstall squid Package
discussion: |
  If there is no need to make the proxy server software available,
  removing it provides a safeguard against its activation.
references:
  nist:
    cce:
      '10':
        - CCE-87396-8
      '8':
        - CCE-82189-2
      '9':
        - CCE-84238-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove squid
        #      from the system, and may remove any packages
        #      that depend on squid. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "squid" ; then
        dnf remove -y --noautoremove "squid"
        fi

        ---
    '8':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove squid
        #      from the system, and may remove any packages
        #      that depend on squid. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "squid" ; then
        yum remove -y "squid"
        fi

        ---
    '9':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove squid
        #      from the system, and may remove any packages
        #      that depend on squid. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "squid" ; then
        dnf remove -y --noautoremove "squid"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: unknown
      benchmarks:
        - N/A
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove squid
        #      from the system, and may remove any packages
        #      that depend on squid. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "squid"

