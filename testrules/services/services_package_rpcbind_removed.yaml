id: services_package_rpcbind_removed
title: Uninstall rpcbind Package
discussion: |
  If the system does not require rpc based services, it is recommended that
  rpcbind be disabled to reduce the attack surface.
references:
  nist:
    cce:
      '8':
        - CCE-86645-9
      '9':
        - CCE-86646-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: low
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        # CAUTION: This remediation script will remove rpcbind
        #      from the system, and may remove any packages
        #      that depend on rpcbind. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rpcbind" ; then
        yum remove -y "rpcbind"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '9':
      severity: low
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        # CAUTION: This remediation script will remove rpcbind
        #      from the system, and may remove any packages
        #      that depend on rpcbind. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rpcbind" ; then
        dnf remove -y --noautoremove "rpcbind"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: low
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        # CAUTION: This remediation script will remove rpcbind
        #      from the system, and may remove any packages
        #      that depend on rpcbind. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "rpcbind"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
