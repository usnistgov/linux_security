id: services_package_nis_removed
title: Uninstall the nis package
discussion: |
  NIS is the historical SUN service for central account management, more and more replaced by LDAP.
  NIS does not support efficiently security constraints, ACL, etc. and should not be used.
references: {}
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: low
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove nis
        #      from the system, and may remove any packages
        #      that depend on nis. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "nis" ; then
        yum remove -y "nis"
        fi

        ---
    '9':
      severity: low
      benchmarks:
        - N/A
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove nis
        #      from the system, and may remove any packages
        #      that depend on nis. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "nis" ; then
        dnf remove -y --noautoremove "nis"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: low
      benchmarks:
        - N/A
