id: services_package_rsh_server_removed
title: Uninstall rsh-server Package
discussion: |
  The rsh-server service provides unencrypted remote access service which does not
  provide for the confidentiality and integrity of user passwords or the remote session and has very weak
  authentication. If a privileged user were to login using this service, the privileged user password
  could be compromised. The rsh-server package provides several obsolete and insecure
  network services. Removing it decreases the risk of those services' accidental (or intentional)
  activation.
references:
  disa:
    cci:
      - CCI-000381
    srg:
      - SRG-OS-000095-GPOS-00049
    disa_stig:
      '8':
        - RHEL-08-040010
      '9':
        - RHEL-09-215035
      '2004':
        - UBTU-20-010406
      '2204':
        - UBTU-22-215030
  nist:
    800-53r4:
      - CM-6
      - CM-7
      - IA-5
    cce:
      '8':
        - CCE-82184-3
      '9':
        - CCE-84143-7
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh-server
        #      from the system, and may remove any packages
        #      that depend on rsh-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rsh-server" ; then
        yum remove -y "rsh-server"
        fi

        ---
    '9':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh-server
        #      from the system, and may remove any packages
        #      that depend on rsh-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "rsh-server" ; then
        dnf remove -y --noautoremove "rsh-server"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh-server
        #      from the system, and may remove any packages
        #      that depend on rsh-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "rsh-server"

        ---
    '2204':
      severity: high
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove rsh-server
        #      from the system, and may remove any packages
        #      that depend on rsh-server. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "rsh-server"

        ---
