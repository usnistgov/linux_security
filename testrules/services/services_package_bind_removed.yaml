id: services_package_bind_removed
title: Uninstall bind Package
discussion: |
  If there is no need to make DNS server software available,
  removing it provides a safeguard against its activation.
references:
  disa:
    cci:
      - CCI-000366
  nist:
    800-53r4:
      - CM-6(a)
      - CM-7(a)
      - CM-7(b)
    cce:
      '10':
        - CCE-87806-6
      '8':
        - CCE-82408-6
      '9':
        - CCE-86505-5
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove bind
        #      from the system, and may remove any packages
        #      that depend on bind. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "bind" ; then
        dnf remove -y --noautoremove "bind"
        fi

        ---
    '8':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove bind
        #      from the system, and may remove any packages
        #      that depend on bind. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "bind" ; then
        yum remove -y "bind"
        fi

        ---
    '9':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove bind
        #      from the system, and may remove any packages
        #      that depend on bind. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        if rpm -q --quiet "bind" ; then
        dnf remove -y --noautoremove "bind"
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove bind9
        #      from the system, and may remove any packages
        #      that depend on bind9. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "bind9"

        ---
    '2204':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove bind9
        #      from the system, and may remove any packages
        #      that depend on bind9. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "bind9"

        ---
    '2404':
      severity: low
      benchmarks:
        - disa_stig
        - nist_800-53r5
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---

        # CAUTION: This remediation script will remove bind9
        #      from the system, and may remove any packages
        #      that depend on bind9. Execute this
        #      remediation AFTER testing on a non-production
        #      system!

        DEBIAN_FRONTEND=noninteractive apt-get remove -y "bind9"

        ---
