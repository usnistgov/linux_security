id: audit_package_audit_audispd_plugins_installed
title: Ensure the default plugins for the audit dispatcher are Installed
discussion: Information stored in one location is vulnerable to accidental or incidental
  deletion or alteration. Off-loading is a common process in information systems with
  limited audit storage capacity.
references:
  disa:
    cci:
      - CCI-001851
    srg:
      - SRG-OS-000342-GPOS-00133
    disa_stig:
      '2004':
        - UBTU-20-010216
      '2204':
        - UBTU-22-653020
  nist:
    cce:
      '9':
        - CCE-89457-6
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '8':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "audit-audispd-plugins" ; then
            yum install -y "audit-audispd-plugins"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '9':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q kernel; then

        if ! rpm -q --quiet "audit-audispd-plugins" ; then
            dnf install -y "audit-audispd-plugins"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
  ubuntu:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '2004':
      severity: medium
      benchmarks:
        - disa_stig
        - disa_stigs
      check:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if dpkg-query --show --showformat='${db:Status-Status}
        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "audispd-plugins"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2204':
      severity: medium
      benchmarks:
        - disa_stig
