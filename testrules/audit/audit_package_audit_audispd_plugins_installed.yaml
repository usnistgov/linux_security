        ' 'linux-base' 2>/dev/null | grep -q ^installed; then

        DEBIAN_FRONTEND=noninteractive apt-get install -y "audispd-plugins"

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
    '2404':
      severity: medium
      benchmarks:
        - disa_stig
