id: audit_auditd_data_retention_space_left_action
title: Configure auditd space_left Action on Low Disk Space
discussion: |
  Notifying administrators of an impending disk space problem may
  allow them to take corrective action prior to any disruption.
references:
  disa:
    cci:
      - CCI-001855
    srg:
      - SRG-OS-000343-GPOS-00134
    disa_stig:
      '8':
        - RHEL-08-030731
      '9':
        - RHEL-09-653040
      '2004':
        - UBTU-20-010217
      '2204':
        - UBTU-22-653040
  nist:
    800-53r4:
      - AU-5
      - CM-6
    cce:
      '10':
        - CCE-88897-4
      '8':
        - CCE-80684-4
      '9':
        - CCE-83703-9
os_specifics:
  rhel:
    check: $OS_VALUE
    result: $OS_VALUE
    fix: $OS_VALUE
    '10':
      severity: medium
      benchmarks:
        - disa_stig
        - nist_800-53r4
      enforcement_info:
        - N/A
      result:
        integer: 0
      fix: |
        [source,bash]
        ---
        # Remediation is applicable only in certain platforms
        if rpm --quiet -q audit && rpm --quiet -q kernel; then

        var_auditd_space_left_action=''


        var_auditd_space_left_action="$(echo $var_auditd_space_left_action | cut -d \| -f 1)"
        #
        # If space_left_action present in /etc/audit/auditd.conf, change value
        # to var_auditd_space_left_action, else
        # add "space_left_action = $var_auditd_space_left_action" to /etc/audit/auditd.conf
        #

        AUDITCONFIG=/etc/audit/auditd.conf

        # Strip any search characters in the key arg so that the key can be replaced without
        # adding any search characters to the config file.
        stripped_key=$(sed 's/[\^=\$,;+]*//g' <<< "^space_left_action")

        # shellcheck disable=SC2059
        printf -v formatted_output "%s = %s" "$stripped_key" "$var_auditd_space_left_action"

        # If the key exists, change it. Otherwise, add it to the config_file.
        # We search for the key string followed by a word boundary (matched by \>),
        # so if we search for 'setting', 'setting2' won't match.
        if LC_ALL=C grep -q -m 1 -i -e "^space_left_action\\>" "$AUDITCONFIG"; then
            escaped_formatted_output=$(sed -e 's|/|\\/|g' <<< "$formatted_output")
            LC_ALL=C sed -i --follow-symlinks "s/^space_left_action\\>.*/$escaped_formatted_output/gi" "$AUDITCONFIG"
        else
            if [[ -s "$AUDITCONFIG" ]] && [[ -n "$(tail -c 1 -- "$AUDITCONFIG" || true)" ]]; then
                LC_ALL=C sed -i --follow-symlinks '$a'\\ "$AUDITCONFIG"
            fi
            cce="CCE-88897-4"
            printf '# Per %s: Set %s in %s\n' "${cce}" "${formatted_output}" "$AUDITCONFIG" >> "$AUDITCONFIG"
            printf '%s\n' "$formatted_output" >> "$AUDITCONFIG"
        fi

        else
            >&2 echo 'Remediation is not applicable, nothing was done'
        fi

        ---
